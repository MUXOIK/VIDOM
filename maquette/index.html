<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIDOM — la mémoire de votre logement</title>
<meta name="description" content="VIDOM construit avec vous la mémoire de votre logement.">
<meta name="theme-color" content="#F6F3ED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VIDOM">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235F7A6A'/%3E%3Cpath d='M14 30l18-14 18 14' fill='none' stroke='%23FFFDF9' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M19 29v18h26V29' fill='none' stroke='%23FFFDF9' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M28 47v-10h8v10' fill='none' stroke='%23FFFDF9' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%235F7A6A'/%3E%3Cpath d='M14 30l18-14 18 14' fill='none' stroke='%23FFFDF9' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M19 29v18h26V29' fill='none' stroke='%23FFFDF9' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M28 47v-10h8v10' fill='none' stroke='%23FFFDF9' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{
  --sauge:#5F7A6A;--sauge-f:#4A6255;--sauge-c:#E4EBE6;--sauge-cc:#F0F4F1;
  --ivoire:#F6F3ED;--blanc:#FFFDF9;--bois:#D8C8B2;--bois-c:#EFE6D8;--sable:#B5B0A5;
  --ardoise:#50575E;--encre:#2F3439;--terra:#C9775B;--terra-c:#F4E3DB;--terra-f:#A85F45;
  --fs:17px;--r:12px;--r2:16px;
}
html[data-texte="grand"]{--fs:19px}
html[data-texte="tres-grand"]{--fs:21px}
@media (min-width:1024px){:root{--fs:16px}html[data-texte="grand"]{--fs:18px}html[data-texte="tres-grand"]{--fs:20px}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ivoire);color:var(--encre);font-family:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;font-size:var(--fs);line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--sauge-f)}
h1,h2,h3{margin:0;font-weight:600;line-height:1.15;text-wrap:balance}
h1{font-size:1.65em}h2{font-size:1.3em}h3{font-size:1.1em}
p{margin:0}
.muted{color:var(--ardoise)}.faint{color:var(--sable)}.small{font-size:.85em}.b{font-weight:600}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
svg.i{width:20px;height:20px;flex:0 0 auto}

/* ---------- squelette ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.col{width:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 20px 8px}
.top .t{font-size:.8em;color:var(--ardoise);font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.top .back{display:inline-flex;align-items:center;gap:6px;color:var(--sauge-f);font-weight:600;min-height:44px}
.aide{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--bois);background:var(--blanc);color:var(--sauge-f);flex:0 0 auto}.aide svg{width:20px;height:20px}.aide:hover{border-color:var(--sauge)}
.top .chip{overflow:hidden;text-overflow:ellipsis;max-width:48vw}
.view{flex:1 1 auto;display:flex;flex-direction:column;gap:14px;padding:6px 18px 24px}
.view.center{justify-content:center;padding-bottom:120px}
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:var(--blanc);border-top:1px solid var(--bois-c)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;text-decoration:none;color:var(--ardoise);font-size:.8em;font-weight:500;border-radius:var(--r)}
.nav a svg{width:24px;height:24px}
.nav a.on{color:var(--sauge-f);background:var(--sauge-cc)}
.nav a.cam{color:var(--blanc);background:var(--sauge)}
.nav a.cam.on{background:var(--sauge-f)}

/* ---------- ordinateur ---------- */
.desk{display:none}
@media (min-width:1024px){
  body.app .col{display:none}
  body.app .desk{display:grid;grid-template-columns:420px minmax(0,1fr);gap:32px;max-width:1280px;margin:0 auto;padding:0 32px;min-height:100vh}
  .desk .pane{display:flex;flex-direction:column;min-height:100vh}
  .desk .pane.left{position:sticky;top:0;max-height:100vh;overflow:auto;padding-bottom:24px}
  .desk .pane .view{padding:6px 4px 32px}
  .desk .topbar{position:sticky;top:0;z-index:5;background:var(--ivoire);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 4px 8px}
  .desk .topbar .t{font-size:.8em;color:var(--ardoise);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .desk .topbar .actions{display:flex;gap:8px;align-items:center}
  .nav{display:none}
}

/* ---------- composants ---------- */
.card{background:var(--blanc);border:1px solid var(--bois-c);border-radius:var(--r2);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.card.soft{background:var(--sauge-cc);border-color:var(--sauge-c)}
.card.attn{border-color:var(--terra);background:var(--terra-c)}
.card.dash{border-style:dashed;background:transparent;color:var(--sable)}
a.card{text-decoration:none;color:inherit}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r);border:1px solid var(--bois);background:var(--blanc);color:var(--encre);font-size:.95em;font-weight:600;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{border-color:var(--sauge)}
.btn.primary{background:var(--sauge);border-color:var(--sauge);color:var(--blanc)}
.btn.primary:hover{background:var(--sauge-f)}
.btn.terra{background:var(--terra);border-color:var(--terra);color:var(--blanc)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sauge-f)}
.btn.big{min-height:56px;font-size:1.05em;border-radius:14px}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85em}
.btn.grow{flex:1 1 auto}
.btn svg{width:20px;height:20px}
.btn.file{position:relative;overflow:hidden}
.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--sauge-c);color:var(--sauge-f);font-size:.8em;font-weight:600;white-space:nowrap}
.chip.terra{background:var(--terra-c);color:var(--terra-f)}
.chip.neutre{background:var(--bois-c);color:var(--ardoise)}
.chip.btn-chip{border:1px solid var(--bois);background:var(--blanc);color:var(--ardoise);font-weight:500;font-size:.9em;padding:8px 14px;cursor:pointer}
.chip.btn-chip.on{background:var(--sauge-c);border-color:var(--sauge);color:var(--sauge-f)}
.input{min-height:54px;border-radius:14px;border:1.5px solid var(--bois);background:var(--blanc);padding:0 16px;font-size:1.05em;display:flex;align-items:center;width:100%;color:var(--encre)}
.input:focus{border-color:var(--sauge);outline:none}
textarea.input{min-height:90px;padding:12px 16px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px}
label.f>span{font-size:.85em;color:var(--ardoise)}
.sep{display:flex;align-items:center;gap:10px;color:var(--sable);font-size:.75em;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.sep i{flex:1 1 auto;height:1px;background:var(--sauge-c);display:block}
.when{font-size:.8em;color:var(--sable);font-weight:500}
.h{font-size:1.65em;font-weight:600;line-height:1.15}
.tile{width:40px;height:40px;border-radius:12px;background:var(--sauge-c);color:var(--sauge-f);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tile svg{width:22px;height:22px}
.tile.terra{background:var(--terra-c);color:var(--terra-f)}
.tile.dash{background:transparent;border:1.5px dashed var(--bois);color:var(--sable)}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bois-c);text-decoration:none;color:inherit}
.line:last-child{border-bottom:0}
.step{display:flex;justify-content:space-between;align-items:center;min-height:50px;border-bottom:1px solid var(--bois-c)}
.step:last-of-type{border-bottom:0}
.step .ctl{display:flex;align-items:center}
.step .ctl button{width:42px;height:42px;border-radius:10px;border:1px solid var(--bois);display:flex;align-items:center;justify-content:center;color:var(--ardoise);font-size:1.4em;background:var(--blanc)}
.step .ctl b{width:40px;text-align:center;font-size:1.1em}
.photo{border-radius:var(--r2);background:#E9E4DA;border:1px solid var(--bois);min-height:150px;display:flex;align-items:flex-end;padding:12px;overflow:hidden;position:relative}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .chip{position:relative;background:var(--blanc);color:var(--ardoise)}
.bulle{align-self:flex-end;max-width:85%;background:var(--sauge);color:var(--blanc);border-radius:18px 18px 4px 18px;padding:10px 16px}
.ask{display:flex;gap:8px;align-items:center;position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--ivoire);padding:8px 0 4px}
@media (min-width:1024px){.ask{bottom:0;padding:10px 0 18px}}
.ask input{flex:1 1 auto}
.ask button{width:54px;height:54px;border-radius:14px;background:var(--sauge);color:var(--blanc);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.house{display:block;width:100%;max-width:300px;margin:0 auto}
.house rect{cursor:pointer}
.plan{width:100%;border-radius:var(--r);border:1px solid var(--bois-c);display:block}
.mono{font-variant-numeric:tabular-nums;word-break:break-all}
.qr{width:96px;height:96px;flex:0 0 auto;border-radius:6px;background:var(--blanc);padding:4px;border:1px solid var(--bois-c)}
.qr svg{width:100%;height:100%;display:block}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--encre);color:var(--blanc);padding:10px 16px;border-radius:999px;font-size:.9em;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (min-width:1024px){.toast{bottom:32px}}
.modal-bg{position:fixed;inset:0;background:rgba(47,52,57,.35);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:0}
@media (min-width:600px){.modal-bg{align-items:center;padding:24px}}
.modal{background:var(--ivoire);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.modal{border-radius:20px;padding:24px}}
.drop{position:fixed;inset:0;background:rgba(95,122,106,.18);border:4px dashed var(--sauge);z-index:60;display:flex;align-items:center;justify-content:center;font-size:1.4em;font-weight:600;color:var(--sauge-f);pointer-events:none}
.fadein{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--bois-c);border-top-color:var(--sauge);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fadein{animation:none}.toast{transition:none}.spin{animation:none}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95em}
.kv dt{color:var(--ardoise)}.kv dd{margin:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.progress{height:6px;border-radius:3px;background:var(--bois-c);overflow:hidden}
.progress i{display:block;height:100%;background:var(--sauge);border-radius:3px}
.book{background:var(--blanc);border:1px solid var(--bois);border-radius:8px;padding:18px 20px;box-shadow:2px 2px 0 var(--bois-c)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--bois-c)}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--sauge)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status"></div>
<div id="modal"></div>
<div id="drop" class="drop" hidden>Déposez vos fichiers : VIDOM range.</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

const h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const now=()=>{const d=new Date(),o=-d.getTimezoneOffset(),a=Math.abs(o);return iso(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())+(o<0?"-":"+")+pad(Math.floor(a/60))+":"+pad(a%60)};
const jourLocal=s=>{const d=String(s).length>10?dateDe(s):null;return d?iso(d):String(s).slice(0,10)}; // le jour tel qu'on le vit ici
function dateFr(s){if(!s)return"";const [y,m,d]=jourLocal(s).split("-").map(Number);return `${d===1?"1er":d} ${MOIS[m-1]} ${y}`}
function moisFr(s){const [y,m]=s.slice(0,7).split("-").map(Number);return `${MOIS[m-1]} ${y}`}
function dateDe(s){ // accepte "2026-09-15T08:12", "2026-09-15 06:12:00+00", "…+00:00" ; renvoie null si illisible
  if(!s)return null;
  let v=String(s).trim().replace(" ","T").replace(/([+-]\d{2})$/,"$1:00");
  const d=new Date(v);return isNaN(d.getTime())?null:d;
}
function heure(s){const d=dateDe(s);return d?pad(d.getHours())+" h "+pad(d.getMinutes()):""}
function joursDepuis(s){const a=new Date(jourLocal(s)),b=new Date(today());return Math.round((b-a)/86400000)}
function shiftDate(s,jours){const d=new Date(s.slice(0,10));d.setDate(d.getDate()+jours);return iso(d)}

/* adresse VIDOM réelle : allouée et vérifiée unique en base (vidom.fr, le domaine que Murielle possède) */
async function allouerDepot(nom){
  const base=slug(nom).replace(/-/g,"")||"logement"; // D-175 : le nom d'un seul tenant, un seul tiret avant les trois caractères
  const secours=()=>`${base}-${uid().slice(0,4)}@vidom.fr`; // hors ligne, ou en dernier recours
  if(!supa)return secours();
  let session=null;
  try{const {data}=await supa.auth.getSession();session=data&&data.session}catch(e){}
  if(!session)return secours();
  for(let tentative=0;tentative<8;tentative++){
    const graine=tentative===0?[...nom].reduce((a,ch)=>a*31+ch.charCodeAt(0)|0,7):Math.floor(Math.random()*46656)+tentative;
    const ALPHA="abcdefghjkmnpqrstuvwxyz23456789";let g=Math.abs(graine),c="";for(let i=0;i<3;i++){c+=ALPHA[g%ALPHA.length];g=Math.floor(g/ALPHA.length)+7} // ni 0 ni o, ni 1 ni l ni i : l'adresse se dicte
    const candidat=`${base}-${c}@vidom.fr`;
    try{
      const {error}=await supa.from("logements").upsert({id:S.logement.id,nom,adresse_depot:candidat,created_by:session.user.id},{onConflict:"id"});
      if(!error)return candidat;
      if(error.code!=="23505")return candidat; // erreur d'un autre type : on garde ce nom localement, pousserTout() réessaiera la synchro
    }catch(e){return candidat}
  }
  return secours();
}

async function enrichirAdresse(){ // best-effort : chaque source est indépendante, silencieuse si elle échoue
  const lat=S.logement.latitude,lon=S.logement.longitude;
  const t=[];
  t.push((async()=>{ // base DPE de l'ADEME
    try{
      const q=encodeURIComponent(S.logement.adresse||"");
      const qs=S.logement.cp?`&qs=${encodeURIComponent(`code_postal_ban:"${S.logement.cp}"`)}`:"";
      const r=await fetchAvecDelai(`https://data.ademe.fr/data-fair/api/v1/datasets/dpe03existant/lines?size=1&q_fields=adresse_ban&q=${q}${qs}`);
      const j=await r.json();
      const d=j.results&&j.results[0];
      if(d){
        if(d.etiquette_dpe)S.logement.dpe=d.etiquette_dpe;
        if(d.etiquette_ges)S.logement.classeClimat=d.etiquette_ges;
        if(d.date_etablissement_dpe)S.logement.dpeDate=d.date_etablissement_dpe;

        if(!S.logement.surface&&d.surface_habitable_logement)S.logement.surface=d.surface_habitable_logement;
      }
    }catch(e){}
  })());
  if(lat!=null&&lon!=null){
    t.push((async()=>{ // cadastre IGN, par point
      try{
        const geom=encodeURIComponent(JSON.stringify({type:"Point",coordinates:[lon,lat]}));
        const r=await fetchAvecDelai(`https://apicarto.ign.fr/api/cadastre/parcelle?geom=${geom}`);
        const j=await r.json();
        const p=j.features&&j.features[0]&&j.features[0].properties;
        if(p)S.logement.numeroCadastral=[p.code_dep,p.code_com,p.section,p.numero].filter(Boolean).join(" ");
      }catch(e){}
    })());
    t.push((async()=>{ // Référentiel National des Bâtiments
      try{
        const d=0.0006;
        const r=await fetchAvecDelai(`https://rnb-api.beta.gouv.fr/api/alpha/buildings/?bbox=${lon-d},${lat-d},${lon+d},${lat+d}`);
        const j=await r.json();
        const b=(j.results||[])[0];
        if(b){S.logement.rnbId=b.rnb_id||"";S.logement.rnbStatut=b.status||""}
      }catch(e){}
    })());
    t.push((async()=>{ // altitude, Géoplateforme IGN
      try{
        const r=await fetchAvecDelai(`https://data.geopf.fr/altimetrie/1.0/calcul/alti/rest/elevation.json?lon=${lon}&lat=${lat}&resource=ign_rge_alti_wld&indent=false`);
        const j=await r.json();
        const e=j.elevations&&j.elevations[0];
        if(e&&typeof e.z==="number")S.logement.altitude=e.z;
      }catch(e){}
    })());
    t.push((async()=>{ // Géorisques
      try{
        const r=await fetchAvecDelai(`https://georisques.gouv.fr/api/v1/resultats_rapport_risque?latlon=${lon},${lat}`);
        const j=await r.json();
        if(j&&j.risquesNaturels)S.logement.risquesNaturels=j.risquesNaturels;
      }catch(e){}
    })());
  }
  await Promise.allSettled(t);
}

    const liste=(membres||[]).filter(m=>m.logements).map(m=>({id:m.logement_id,nom:m.logements.nom||"",ville:m.logements.ville||"",adresse:m.logements.adresse||""}));
    const avant=Array.isArray(S.logements)?S.logements:[]; // la liste du compte telle que cet appareil la connaissait
    const efface=id=>!!id&&avant.some(l=>l.id===id)&&!liste.some(l=>l.id===id); // était sur le compte, n'y est plus : supprimé ailleurs
    if(efface(S.logement.id))oublierLogement(S.logement.id); // on ne ressuscite pas une maison effacée depuis un autre appareil
    S.logements=liste;
    if(!liste.length){ // compte réel, mais plus aucun logement : on reste (ou on revient) sur l'installation
      if(S.cree&&!S.logement.id){S.cree=false;S.etape="adresse"}
      save();return}
    if(S.ajout&&!S.cree){save();return} // un logement de plus est en train d'être créé : on ne l'interrompt pas
    // le logement à ouvrir : celui demandé, sinon celui qu'on regardait sur cet appareil, sinon le premier du compte
    const connu=id=>liste.some(l=>l.id===id);
    const logementId=connu(voulu)?voulu:(connu(S.logement.id)?S.logement.id:liste[0].id);
    if(S.cree&&S.logement.id&&!connu(S.logement.id)){ // ce que l'appareil regarde n'est pas (encore) dans le compte : on ne l'écrase pas, la synchro suivra
      save();return}
    if(S.logement.id&&S.logement.id!==logementId){mettreDeCote();S=etatPour(logementId)}
    const [{data:logement},{data:pieces},{data:equipements},{data:artisans},{data:interventions},{data:documents},{data:rappels},{data:expediteurs},{data:fil},{data:etatRow},{data:guideInviteRow},{data:sejoursInvitesRows}]=await Promise.all([
      supa.from("logements").select("*").eq("id",logementId).maybeSingle(),
      supa.from("pieces").select("*").eq("logement_id",logementId),
      supa.from("equipements").select("*").eq("logement_id",logementId),
      supa.from("artisans").select("*").eq("logement_id",logementId),
      supa.from("interventions").select("*").eq("logement_id",logementId),
      supa.from("documents").select("*").eq("logement_id",logementId),
      supa.from("rappels").select("*").eq("logement_id",logementId),
      supa.from("expediteurs_autorises").select("*").eq("logement_id",logementId),
      supa.from("fil_activite").select("*").eq("logement_id",logementId).order("horodatage",{ascending:false}).limit(300),
      supa.from("etat_logement").select("*").eq("logement_id",logementId).maybeSingle(),
      supa.from("guides_invites").select("*").eq("logement_id",logementId).maybeSingle(),
      supa.from("sejours_invites").select("*").eq("logement_id",logementId).order("cree_le",{ascending:false}),
    ]);
    if(!logement){save();return}
    const chemins=(documents||[]).map(d=>d.chemin_stockage).filter(Boolean);
    let urlParChemin={};
    if(chemins.length){
      try{const {data:signed}=await supa.storage.from("logement-files").createSignedUrls(chemins,60*60*24*30);
        (signed||[]).forEach(s=>{if(s&&s.signedUrl&&s.path)urlParChemin[s.path]=s.signedUrl});
      }catch(e){}
    }
    Object.assign(S.logement,{
      id:logement.id,nom:logement.nom||"",adresse:logement.adresse||"",cp:logement.code_postal||"",
      ville:logement.ville||"",annee:logement.annee_construction||null,surface:logement.surface||null,
      dpe:logement.classe_energetique||logement.dpe||"",dpeDate:logement.dpe_date||"",depot:logement.adresse_depot||S.logement.depot||"",
      latitude:logement.latitude!=null?Number(logement.latitude):null,longitude:logement.longitude!=null?Number(logement.longitude):null,
      numeroCadastral:logement.numero_cadastral||"",classeClimat:logement.classe_climat||"",
      altitude:logement.altitude!=null?Number(logement.altitude):null,rnbId:logement.rnb_id||"",rnbStatut:logement.rnb_statut||"",
      surfaceEmpriseSol:logement.surface_emprise_sol!=null?Number(logement.surface_emprise_sol):null,
      risquesNaturels:logement.risques_naturels||null,
    });
    S.pieces=(pieces||[]).map(p=>({id:p.id,type:p.type_piece||"autre",nom:p.nom,photos:[]}));
    S.pros=(artisans||[]).map(a=>({id:a.id,nom:a.nom,metier:a.metier||"",tel:a.telephone||"",mail:a.email||"",ville:a.ville||"",categorie:a.categorie||"",interventions:[],avis:(a.memo&&a.memo.avis)||[],vocales:(a.memo&&a.memo.vocales)||[]}));
    S.travaux=(interventions||[]).map(iv=>({id:iv.id,titre:iv.type_intervention||"Travaux",par:iv.artisan_nom||"",date:iv.date_intervention||"",montant:iv.cout||0,docs:(documents||[]).filter(r=>r.intervention_id===iv.id).map(r=>r.id)}));
    const photoParEquip={};const docsBruts=[];
    (documents||[]).forEach(r=>{
      if(r.type_document==="photo"&&r.equipement_id&&!r.fournisseur&&r.montant_ttc==null){
        const prev=photoParEquip[r.equipement_id];
        if(!prev||new Date(r.created_at)>new Date(prev.created_at))photoParEquip[r.equipement_id]=r;
      }else docsBruts.push(r);
    });
    S.docs=docsBruts.map(r=>{
      const iv=r.intervention_id?(interventions||[]).find(x=>x.id===r.intervention_id):null;
      return {id:r.id,piece:r.piece_id||"maison",type:r.type_document||"autre",titre:r.titre||r.nom_fichier||"Document",
        date:(r.date_document||(r.created_at||"").slice(0,10)),fournisseur:r.fournisseur||"",montant:r.montant_ttc,
        lie:r.equipement_id||"",travaux:iv?(iv.type_intervention||""):"",garantie:r.date_garantie_fin||"",
        img:r.chemin_stockage?(urlParChemin[r.chemin_stockage]||null):null,pdf:r.mime_type==="application/pdf",chemin:r.chemin_stockage||null,
        recu:r.source==="adresse_vidom"?"adresse":"photo",dateRecu:(r.created_at||"").slice(0,10)};
    });
    S.equipements=(equipements||[]).map(r=>{
      const photo=photoParEquip[r.id];
      return {id:r.id,piece:r.piece_id||"maison",nom:r.categorie||"Équipement",marque:r.marque||"",modele:r.modele||"",
        ref:r.numero_serie||"",achat:r.date_achat||r.date_installation||"",garantie:r.date_garantie_fin||"",
        installateur:r.installateur||"",notice:!!r.notice,sav:r.service_apres_vente||"",etat:r.etat||"bon",
        entretien:!!r.entretien_requis,
        img:photo&&photo.chemin_stockage?(urlParChemin[photo.chemin_stockage]||null):null,
        pdf:photo?photo.mime_type==="application/pdf":false,chemin:photo?(photo.chemin_stockage||null):null,
        date:r.created_at,entretiens:[]};
    });
    reconstituerActivitesPros();
    reconstituerPhotosPieces();
    S.rappels=(rappels||[]).map(r=>({id:r.id,t:r.texte,equip:r.equipement_id||"",pro:"",du:r.date_echeance||"",fait:!!r.fait,info:!!r.info}));
    S.expediteursOk=(expediteurs||[]).map(e=>e.expediteur);
    lireCourrielMensuel(); // D-186
    S.fil=(fil||[]).map(f=>({id:f.id,d:f.horodatage,fait:!!f.fait,type:f.type,...(f.donnees||{})}));
    S.guideInvite=guideInviteRow?{equipementIds:guideInviteRow.equipement_ids||[],message:guideInviteRow.message_accueil||""}:null;
    S.sejoursInvites=(sejoursInvitesRows||[]).map(s=>({id:s.id,nom:s.nom_invite||"",code:s.code,debut:s.debut,fin:s.fin,creeLe:s.cree_le,ouvertLe:s.ouvert_le,revoqueLe:s.revoque_le}));
    if(etatRow&&etatRow.etat){
      const et=etatRow.etat;
      if(et.nees)S.nees=et.nees;if(et.questionsPosees)S.questionsPosees=et.questionsPosees;
      if(et.dernierJour)S.dernierJour=et.dernierJour;if(et.reserveServie)S.reserveServie=et.reserveServie;
    }
    S.cree=true;S.etape="";S.ajout=false;S.retourVers=null;
    if(!S.logement.depot&&S.logement.nom){try{S.logement.depot=await allouerDepot(S.logement.nom)}catch(e){}} // un logement créé avant l'adresse VIDOM (VIDOM-mobile) en reçoit une
    hydrateEnCours=false;save();
    verifierEnvoiEnAttente();
  }catch(e){/* pas grave : on continue avec la dernière version connue, en local */}
  finally{hydrateEnCours=false}
}

let pousserTout_timer=null,pousserTout_actif=false,pousserTout_rejoue=false,hydrateEnCours=false;
/* D-176 : ce qui arrive par l'adresse VIDOM apparaît sans recharger la page. On relit le fil en ligne
   toutes les quarante-cinq secondes et au retour sur l'onglet ; on n'ajoute que les entrées inconnues. */
let relireFil_encours=false;
async function relireFil(){
  if(!supa||relireFil_encours||hydrateEnCours||!S.logement||!S.logement.id||!S.cree||document.hidden)return;
  relireFil_encours=true;
  try{
    const {data:s}=await supa.auth.getSession();if(!s||!s.session)return;
    const {data:fil}=await supa.from("fil_activite").select("*").eq("logement_id",S.logement.id).order("horodatage",{ascending:false}).limit(30);
    const connus=new Set(S.fil.map(f=>f.id));
    const neufs=(fil||[]).filter(f=>!connus.has(f.id)).map(f=>({id:f.id,d:f.horodatage,fait:!!f.fait,type:f.type,...(f.donnees||{})}));
    if(neufs.length){
      S.fil=[...neufs,...S.fil].sort((x,y)=>String(y.d).localeCompare(String(x.d)));
      save();
      const ae=document.activeElement;const saisie=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
      if(!document.getElementById("modal").innerHTML&&!saisie)render();
      const n=neufs.filter(f=>f.type==="recu"&&!f.fait).length;
      if(n)toast(n===1?"Un document vient d'arriver par l'adresse VIDOM":n+" documents viennent d'arriver par l'adresse VIDOM");
    }
  }catch(e){}finally{relireFil_encours=false}
}
setInterval(relireFil,45000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)relireFil()});
window.addEventListener("focus",relireFil);
const idPhoto=id=>String(id).replace(/^./,c=>((parseInt(c,16)+8)%16).toString(16)); // un identifiant stable pour la photo d'un équipement, dérivé du sien
function syncDiffere(){ if(!supa)return; clearTimeout(pousserTout_timer); pousserTout_timer=setTimeout(pousserTout,900); }
if(typeof window!=="undefined")window.addEventListener("online",()=>syncDiffere());
async function pousserTout(){ // pousse l'état courant vers le compte réel ; échoue en silence si hors ligne, réessaiera plus tard
  if(!supa||!S.logement||!S.logement.id||!S.logement.nom||hydrateEnCours)return; // jamais un état vide ou en cours de relecture : il écraserait la vraie mémoire
  if(pousserTout_actif){pousserTout_rejoue=true;return}
  let session=null;
  try{const {data}=await supa.auth.getSession();session=data&&data.session}catch(e){return}
  if(!session)return;
  pousserTout_actif=true;
  try{
    const lig=S.logement;
    await supa.from("logements").upsert({
      id:lig.id,nom:lig.nom||"",adresse:lig.adresse||null,code_postal:lig.cp||null,ville:lig.ville||null,
      annee_construction:lig.annee||null,surface:lig.surface||null,classe_energetique:/^[A-G]$/.test(lig.dpe)?lig.dpe:null,
      dpe_date:lig.dpeDate||null,adresse_depot:lig.depot||null,created_by:session.user.id,
      latitude:lig.latitude??null,longitude:lig.longitude??null,numero_cadastral:lig.numeroCadastral||null,
      classe_climat:/^[A-G]$/.test(lig.classeClimat)?lig.classeClimat:null,altitude:lig.altitude??null,
      rnb_id:lig.rnbId||null,rnb_statut:lig.rnbStatut||null,surface_emprise_sol:lig.surfaceEmpriseSol??null,
      risques_naturels:lig.risquesNaturels||null,canal_acquisition:lig.canalAcquisition||null,
    },{onConflict:"id"});
    if(S.pieces.length)await supa.from("pieces").upsert(S.pieces.map(p=>({id:p.id,logement_id:lig.id,nom:p.nom,type_piece:p.type||null})),{onConflict:"id"});
    if(S.pros.length)await supa.from("artisans").upsert(S.pros.map(p=>({id:p.id,logement_id:lig.id,nom:p.nom,metier:p.metier||null,telephone:p.tel||null,email:p.mail||null,ville:p.ville||null,categorie:p.categorie||null,memo:{avis:p.avis||[],vocales:(p.vocales||[]).filter(v=>v.chemin).map(v=>({id:v.id,chemin:v.chemin,d:v.d,duree:v.duree||0}))}})),{onConflict:"id"});
    if(S.travaux.length)await supa.from("interventions").upsert(S.travaux.map(t=>({id:t.id,logement_id:lig.id,type_intervention:t.titre||"Travaux",artisan_nom:t.par||null,date_intervention:t.date||null,cout:t.montant||null})),{onConflict:"id"});
    if(S.equipements.length){
      await supa.from("equipements").upsert(S.equipements.map(e=>({
        id:e.id,logement_id:lig.id,piece_id:(e.piece&&e.piece!=="maison")?e.piece:null,
        categorie:e.nom||"Équipement",marque:e.marque||null,modele:e.modele||null,numero_serie:e.ref||null,
        date_installation:e.achat||null,date_achat:e.achat||null,date_garantie_fin:e.garantie||null,
        installateur:e.installateur||null,notice:!!e.notice,service_apres_vente:e.sav||null,
        etat:["bon","moyen","a_remplacer","hors_service"].includes(e.etat)?e.etat:"bon",entretien_requis:!!e.entretien
      })),{onConflict:"id"});
      const photosEq=S.equipements.filter(e=>e.chemin).map(e=>({
        id:idPhoto(e.id),logement_id:lig.id,equipement_id:e.id, // D-182 : "ph-"+id n'était pas un identifiant valide, la base refusait toutes les photos d'équipement en silencepiece_id:(e.piece&&e.piece!=="maison")?e.piece:null,
        type_document:"photo",titre:"Photo de l'équipement",nom_fichier:e.chemin.split("/").pop(),chemin_stockage:e.chemin,mime_type:e.pdf?"application/pdf":"image/jpeg",
        source:"manuel",uploaded_by:session.user.id
      }));
      if(photosEq.length)await supa.from("documents").upsert(photosEq,{onConflict:"id"});
    }
    if(S.docs.length){
      const avecFichier=S.docs.filter(d=>d.chemin); // chemin_stockage est obligatoire en base : un document dont la photo n'est pas encore déposée attend le prochain envoi
      if(avecFichier.length){
        const lignesDoc=avecFichier.map(d=>{
          const eq=(d.lie&&typeof equipParLie==="function")?equipParLie(d.lie):null;
          const iv=d.travaux?S.travaux.find(t=>t.titre===d.travaux):null;
          return {
            id:d.id,logement_id:lig.id,piece_id:(d.piece&&d.piece!=="maison")?d.piece:null,
            equipement_id:eq?eq.id:(S.equipements.some(e=>e.id===d.lie)?d.lie:null),intervention_id:iv?iv.id:null,
            type_document:d.type||"autre",titre:d.titre||null,nom_fichier:d.chemin.split("/").pop(),chemin_stockage:d.chemin,
            mime_type:d.pdf?"application/pdf":"image/jpeg",
            date_document:d.date?d.date.slice(0,10):null,date_echeance:d.echeance?d.echeance.slice(0,10):null,fournisseur:d.fournisseur||null,montant_ttc:d.montant,
            date_garantie_fin:d.garantie||null,source:d.recu==="adresse"?"adresse_vidom":"manuel",uploaded_by:session.user.id
          };
        });
        await supa.from("documents").upsert(lignesDoc,{onConflict:"id"});
      }
    }
    if(S.rappels.length)await supa.from("rappels").upsert(S.rappels.map(r=>({id:r.id,logement_id:lig.id,texte:r.t,equipement_id:S.equipements.some(e=>e.id===r.equip)?r.equip:null,date_echeance:r.du||null,fait:!!r.fait,info:!!r.info})),{onConflict:"id"});
    if(S.expediteursOk.length)await supa.from("expediteurs_autorises").upsert(S.expediteursOk.map(exp=>({logement_id:lig.id,expediteur:exp})),{onConflict:"logement_id,expediteur"});
    if(S.fil.length){
      const lignesFil=S.fil.slice(0,300).map(f=>{const {id,d,fait,type,...reste}=f;return {id,logement_id:lig.id,type:type||"info",horodatage:d||now(),fait:!!fait,donnees:reste}});
      await supa.from("fil_activite").upsert(lignesFil,{onConflict:"id"});
    }
    await supa.from("etat_logement").upsert({logement_id:lig.id,etat:{nees:S.nees,questionsPosees:S.questionsPosees,dernierJour:S.dernierJour,reserveServie:S.reserveServie},maj_le:new Date().toISOString()},{onConflict:"logement_id"});
  }catch(e){ console.error("VIDOM : l'enregistrement en ligne a échoué, réessaiera au prochain enregistrement.",e) }
  pousserTout_actif=false;
  if(pousserTout_rejoue){pousserTout_rejoue=false;syncDiffere()}
  verifierEnvoiEnAttente();
}

<script>
/* ================= pièces ================= */
function creerPieces(){
  S.pieces=[];
  const c=S.comptage;
  const ordre=[...TYPES_PIECES.map(t=>t.type),...AUTRES_PIECES.map(t=>t.type)];
  ordre.forEach(type=>{
    const n=c[type]||0;const def=[...TYPES_PIECES,...AUTRES_PIECES].find(t=>t.type===type);
    for(let i=1;i<=n;i++){S.pieces.push({id:uid(),type,nom:n>1?`${def.nom} ${i}`:def.nom,photos:[]})}
  });
  (S.piecesLibres||[]).forEach(nom=>{S.pieces.push({id:uid(),type:"autre",nom,photos:[]})}); // D-167 : une pièce au nom libre (véranda…) saisie dès la création
}
const pieceParId=id=>S.pieces.find(p=>p.id===id);
const pieceALaLumiere=p=>S.equipements.some(e=>e.piece===p.id)||S.docs.some(d=>d.piece===p.id)||p.photos.length>0;
const nomPiece=id=>id==="maison"?"la maison entière":(pieceParId(id)?.nom||"la maison");
/* ================= reconnaissance réelle (Claude, via la fonction Edge extract-document) ================= */
function fileVersBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result||"").split(",")[1]||"");
    r.onerror=()=>reject(r.error);
    r.readAsDataURL(file);
  });
}
/* D-172 : d'un long PDF, VIDOM ne fait lire que les trois premières pages et la dernière. La date, le montant,
   l'émetteur et le titre s'y trouvent presque toujours, et la lecture coûte dix à vingt fois moins.
   Le fichier gardé dans la mémoire du logement reste l'original, entier : seule la copie envoyée à la lecture est allégée.
   Au moindre souci (PDF protégé, bibliothèque injoignable), on envoie l'original, comme avant. */
const PAGES_LUES_DEBUT=3,PAGES_LUES_LONG=15; // un acte ou un contrat dont le montant manque se relit une fois, sur quinze pages
function chargerPdfLib(){
  if(window.PDFLib)return Promise.resolve(window.PDFLib);
  if(!chargerPdfLib.p)chargerPdfLib.p=new Promise((ok,ko)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js";sc.onload=()=>ok(window.PDFLib);sc.onerror=()=>{chargerPdfLib.p=null;ko(new Error("pdf-lib indisponible"))};document.head.appendChild(sc)});
  return chargerPdfLib.p;
}
async function pourLecture(blob,mimeType,nbDebut){ // -> {fileBase64, pages_total, pages_envoyees}
  nbDebut=nbDebut||PAGES_LUES_DEBUT;
  let envoi=blob,total=null,envoyees=null;
  if(mimeType==="application/pdf"){
    try{
      const L=await chargerPdfLib();
      const src=await L.PDFDocument.load(await blob.arrayBuffer(),{parseSpeed:Infinity}); // sans pause : dans un onglet en arrière-plan, les pauses durent une seconde chacune
      total=src.getPageCount();envoyees=total;
      if(total>nbDebut+1){
        const idx=[...Array(nbDebut).keys(),total-1];
        const out=await L.PDFDocument.create();
        (await out.copyPages(src,idx)).forEach(pg=>out.addPage(pg));
        envoi=new Blob([await out.save({objectsPerTick:Infinity})],{type:"application/pdf"});envoyees=idx.length;
      }
    }catch(e){envoi=blob;total=null;envoyees=null}
  }
  return {fileBase64:await fileVersBase64(envoi),pages_total:total,pages_envoyees:envoyees};
}
async function reconnaitre(file,pieceId,dataUrl,pdf,chemin){
  const rec={id:uid(),date:now(),img:dataUrl||null,pdf:!!pdf,chemin:chemin||null,statut:"propose",pieceId:pieceId||S.pieceCourante||"maison"};
  if(!supa||!file){rec.k="inconnu";rec.titre="Photo non reconnue";return rec}
  try{
    const mimeType=file.type||(pdf?"application/pdf":"image/jpeg");
    const lu=await pourLecture(file,mimeType);
    const {data,error}=await supa.functions.invoke("extract-document",{body:{...lu,mimeType}});
    if(error){const r=await raisonEchec(error);if(r&&/aujourd'hui/i.test(r))toast(r)} // D-172 : le plafond du jour se dit, il ne se cache pas
    let c=(!error&&data&&data.fields)?data.fields:null;
    // D-172 : dans un acte notarié ou un contrat, le prix est souvent au milieu. S'il manque et que le PDF a été raccourci, on relit une fois, plus largement.
    if(c&&c.kind==="document"&&c.montant_ttc==null&&["acte","contrat","assurance"].includes(c.type)&&lu.pages_total&&lu.pages_envoyees<lu.pages_total){
      try{
        const lu2=await pourLecture(file,mimeType,PAGES_LUES_LONG);
        const r2=await supa.functions.invoke("extract-document",{body:{...lu2,mimeType}});

async function traduireDocument(d){ // best-effort : relit le document en demandant une traduction du titre pour le classement, sans jamais toucher au fichier d'origine
  if(!supa||!d||!d.img)return;
  try{
    const resp=await fetch(d.img);const blob=await resp.blob(); // fetch lit aussi bien une adresse qu'une image embarquée (data:)
    const mimeType=(d.pdf?"application/pdf":"")||blob.type||"image/jpeg";
    const lu=await pourLecture(blob,mimeType);
    const {data,error}=await supa.functions.invoke("extract-document",{body:{...lu,mimeType,traduire:true}});
    if(error||!data||!data.fields){
      const r=await raisonEchec(error);
      if(r)console.error("extract-document :",r);
      if(serviceNonConfigure(r))toast("La traduction n'est pas encore configurée.");
      return;
    }
    const c=data.fields;
    if(c.langue_originale)d.langueOriginale=c.langue_originale;
    if(c.titre)d.titre=c.titre;
    save();
    if(location.hash==="#/document/"+d.id||location.hash==="#/reconnu")render();
    toast("Traduction ajoutée pour le classement");
  }catch(e){}
}

function ranger(rec){ // C'est bien ça
  const nees=[];
  if(rec.k==="equip"){
    const e={id:rec.id,piece:rec.pieceId,nom:rec.nom,marque:rec.marque,modele:rec.modele,ref:rec.ref,achat:rec.achat,garantie:rec.garantie,installateur:rec.installateur||"",notice:rec.notice,sav:rec.sav,etat:rec.etat,entretien:!!rec.entretien,img:rec.img,pdf:!!rec.pdf,chemin:rec.chemin||null,date:rec.date,entretiens:rec.entretien?[{d:rec.achat,par:rec.installateur}]:[]};
    // D-184 : si cet appareil est déjà connu par sa facture (sans photo), la photo le complète au lieu de créer une seconde fiche
    const m=cleTexte(e.modele),q=cleTexte(e.marque),n=cleTexte(e.nom);
    const deja=S.equipements.find(x=>!x.img&&!x.chemin&&((m&&cleTexte(x.modele)&&(cleTexte(x.modele).includes(m)||m.includes(cleTexte(x.modele))))||(cleTexte(x.nom)===n&&q&&cleTexte(x.marque)===q)));
    if(deja){
      Object.assign(deja,{img:e.img,pdf:e.pdf,chemin:e.chemin,ref:deja.ref||e.ref,modele:deja.modele||e.modele,marque:deja.marque||e.marque,piece:(e.piece&&e.piece!=="maison")?e.piece:deja.piece});
      e.id=deja.id;rec.id=deja.id;rec.fusion=true;
    }else S.equipements.push(e);
    // les documents déjà rangés qui le visaient par son nom (arrivés avant lui) se relient à lui pour de bon
    S.docs.forEach(d=>{if(d.lie&&d.lie!==e.id&&slug(d.lie)===slug(e.nom))d.lie=e.id});
    if(rec.installateur)connaitrePro(rec.installateur,`Installation : ${rec.nom.toLowerCase()}`,rec.achat);
    if(rec.entretien)S.rappels.push({id:uid(),t:`L'entretien annuel de ${lc(rec.nom)} est à faire ce mois-ci.`,equip:e.id,pro:rec.installateur||"",du:today(),fait:false});
    // (D-185 : le rappel de fin de garantie se pose désormais dans rappelsGaranties(), un mois avant, pour les documents comme pour les appareils)
  }else if(rec.k==="doc"){
    relierAppareil(rec); // D-182
    const cible=rec.lie?equipParLie(rec.lie):null; // si l'équipement existe déjà, on relie par identifiant tout de suite
    const d={id:rec.id,piece:rec.pieceId,type:rec.type,titre:rec.titre,date:rec.date,fournisseur:rec.fournisseur,montant:rec.montant,echeance:rec.echeance||"",lie:cible?cible.id:(rec.lie||""),travaux:rec.travaux||"",garantie:rec.garantie||"",img:rec.img,pdf:!!rec.pdf,chemin:rec.chemin||null,recu:rec.recu||"photo",dateRecu:rec.date0||rec.date};
    S.docs.push(d);
    if(rec.fournisseur){ // D-164, affiné par D-167, D-168 puis D-170 : un fournisseur reconnu devient un contact de la maison, dans la bonne rubrique
      const cat=rubriqueFournisseur(rec);
      if(cat)connaitrePro(rec.fournisseur,rec.travaux?rec.travaux:(rec.type==="facture"?"Facture reçue":"Document reçu"),rec.date,cat,rec.metierFournisseur);
    }
    if(rec.travaux){let t=S.travaux.find(t=>t.titre===rec.travaux);if(!t){t={id:uid(),titre:rec.travaux,par:rec.fournisseur,date:rec.date,montant:0,docs:[]};S.travaux.push(t)}t.docs.push(d.id);if(rec.type==="facture")t.montant=rec.montant;if(rec.date>t.date)t.date=rec.date}
    if(d.type==="assurance")suivreAssurance(d); // D-151, 16 septembre 2026
  }
  if(rec.pieceId&&rec.pieceId!=="maison"&&rec.img){const p=pieceParId(rec.pieceId);if(p&&p.photos.length<6)p.photos.push(rec.img)}
  else if(rec.pieceId&&rec.pieceId!=="maison"){const p=pieceParId(rec.pieceId);if(p)p.photos.push(null)}

// D-151 (16 septembre 2026, à la suite de A16 — entretien avec une amie assureuse) : à chaque document d'assurance
// déposé, on compare le tarif au dernier connu du même contrat et à l'évolution de l'indice de référence, et on
// programme un rappel de vérification deux mois avant l'échéance. Pour la France, l'indice retenu est l'indice FFB
// (indice du coût de la construction, Fédération Française du Bâtiment), qui sert de base aux assureurs pour réviser
// les contrats d'habitation. Faute de source branchée à ce jour pour lire sa vraie valeur trimestrielle,
// HAUSSE_FFB_TYPIQUE_ANNUELLE est une estimation à ajuster — reste ouvert au registre (A16/D-151), tout comme
// l'indice équivalent hors de France. Message volontairement prudent : on signale un écart, on n'affirme jamais un
// calcul exact.
const HAUSSE_FFB_TYPIQUE_ANNUELLE=0.03, MARGE_AVANT_SIGNALEMENT=1.5;
function suivreAssurance(d){
  const echeance=d.echeance||shiftDate(d.date,365); // à défaut d'échéance explicite (rare), un an après la date du document
  d.echeance=echeance;
  const precedents=S.docs.filter(x=>x.type==="assurance"&&x.id!==d.id&&x.montant!=null).sort((a,b)=>b.date.localeCompare(a.date));
  const precedent=precedents.find(x=>x.fournisseur&&d.fournisseur&&x.fournisseur===d.fournisseur)||precedents[0];
  if(precedent&&precedent.montant>0&&d.montant!=null){
    const hausse=(d.montant-precedent.montant)/precedent.montant;
    const anneesEcoulees=Math.max(1,joursDepuis(precedent.date)/365);
    const seuil=HAUSSE_FFB_TYPIQUE_ANNUELLE*anneesEcoulees*MARGE_AVANT_SIGNALEMENT;
    if(hausse>seuil&&!S.rappels.some(r=>r.hausseDoc===d.id)){
      S.rappels.push({id:uid(),t:`Le tarif de votre assurance (${d.fournisseur||"votre assureur"}) est passé de ${precedent.montant} € à ${d.montant} €, soit une hausse de ${Math.round(hausse*100)} %, plus que ce qu'une revalorisation habituelle expliquerait. Vérifiez ce montant auprès de votre assureur.`,hausseDoc:d.id,du:today(),fait:false,info:true});
    }
  }
  if(!S.rappels.some(r=>r.docAssurance===d.id)){
    S.rappels.push({id:uid(),t:"Avez-vous reçu l'avis d'échéance de votre assurance habitation ? C'est le moment de vérifier le montant par rapport à l'an dernier.",docAssurance:d.id,du:shiftDate(echeance,-60),fait:false});
  }
}
const lc=s=>s.charAt(0).toLowerCase()+s.slice(1);
function connaitrePro(nom,motif,date,categorie,metier){
  let p=S.pros.find(p=>p.nom===nom);
  const ref=RESERVE.pros[nom]||{metier:"Professionnel",tel:"",mail:"",ville:""};
  if(!p){p={id:uid(),nom,...ref,categorie:categorie||"artisan",interventions:[],avis:[]};S.pros.push(p)}
  else if(categorie&&!p.categorie)p.categorie=categorie; // D-168 : on complète la rubrique si elle manquait encore
  if(metier&&(!p.metier||p.metier==="Professionnel"))p.metier=metier; // D-170 : « Assurance habitation » vaut mieux que « Professionnel »
  if(!p.interventions.some(i=>i.motif===motif&&i.d===date))p.interventions.push({d:date,motif});
  p.interventions.sort((a,b)=>b.d.localeCompare(a.d));
  return p;
}

function filDecider(id,choix){
  const e=S.fil.find(x=>x.id===id);if(!e)return;

    else{e.fait=true;e.t2="Refusé. Rien n'est entré.";}
  }else if(e.type==="rappel"){

    else if(choix==="rappeler"){contacter(r?.pro||"");return}
  }else if(e.type==="question"){
    if(e.q==="annexes"){e.fait=true;e.t2=choix==="oui"?"Ajoutez-la depuis Ma maison, en deux gestes.":"Très bien.";if(choix==="oui"){save();route("#/maison");return}}

/* D-181 : relire une pièce jointe que VIDOM n'a pas su lire à son arrivée. On reprend le fichier gardé, on le relit

async function relireRecu(id){
  const e=S.fil.find(x=>x.id===id);if(!e||!e.rec||!e.rec.chemin||!supa||e.relecture)return;
  e.relecture=true;render();
  try{
    const {data}=await supa.storage.from("logement-files").createSignedUrl(e.rec.chemin,600);
    const blob=await (await fetch(data.signedUrl)).blob();
    const pdf=!!e.rec.pdf;const file=new File([blob],pdf?"document.pdf":"photo.jpg",{type:pdf?"application/pdf":(blob.type||"image/jpeg")});
    const lu=await reconnaitre(file,"maison",null,pdf,e.rec.chemin);
    if(lu.k==="equip"||lu.k==="doc"){
      const garde={id:e.rec.id,chemin:e.rec.chemin,pdf:e.rec.pdf,date0:e.rec.date0,date:lu.k==="doc"?lu.date:e.rec.date,img:e.rec.img||null};
      e.rec={...lu,...garde,statut:"propose"};e.inconnu=false;
      e.t=lu.k==="equip"?`Relu : la fiche d'un équipement, ${lc(lu.nom||"")} ${lu.marque||""}.`.trim():`Relu : ${lu.titre}${lu.montant?" · "+euros(lu.montant):""}${lu.garantie?" · garantie jusqu'au "+dateFr(lu.garantie):""}.`;
      toast("VIDOM a su la lire");
    }else toast("VIDOM n'arrive toujours pas à la lire. Vous pouvez la garder telle quelle.");
  }catch(err){toast("La relecture a échoué. Réessayez dans un instant.")}
  delete e.relecture;save();render();
}

/* rappels dus → une seule entrée visible à la fois */
/* D-185 : un mois avant la fin d'une garantie, VIDOM le rappelle dans le fil. Un rappel par garantie (document ou appareil),
   reconnu à son texte, qui porte la date : une garantie prolongée donne un nouveau rappel, l'ancien ne revient pas. */
function rappelsGaranties(){
  if(typeof listeGaranties!=="function")return;
  listeGaranties().filter(x=>x.enCours).forEach(x=>{
    const t=`La garantie de ${lc(x.quoi)} se termine le ${dateFr(x.fin)}. Si quelque chose ne va pas, c'est le moment de le signaler${x.ou?" à "+x.ou:""}.`;
    if(S.rappels.some(r=>r.t===t))return;
    S.rappels.push({id:uid(),t,equip:x.eq?x.eq.id:"",du:shiftDate(x.fin,-30),fait:false,info:true,garantie:true});
  });
}
function pousserRappels(){
  rappelsGaranties();
  const dus=S.rappels.filter(r=>!r.fait&&r.du<=today()&&!S.fil.some(e=>e.type==="rappel"&&e.rappel===r.id&&!e.fait));
  const dejaUn=S.fil.some(e=>e.type==="rappel"&&!e.fait);
  if(dus.length&&!dejaUn){const r=dus[0];filAjouter({type:"rappel",t:r.t,rappel:r.id,pro:r.pro||"",ico:"cloche",info:!!r.info})}
}

const estAnnexe=p=>{
  const t=(p.type||"").toLowerCase(),n=(p.nom||"").toLowerCase();
  if(t==="garage"||t==="cave"||t==="combles")return true;
  return /parking|annexe|d[ée]pendance|atelier|abri|grenier|box|remise|grange|cellier|garage|cave/.test(n);
};

  {q:"annexes",t:"Avez-vous un parking, une cave ou une annexe ?",boutons:[["Oui, ajouter","oui"],["Non","non"]],cond:()=>!S.pieces.some(estAnnexe)},
  {q:"notaire",t:"Votre notaire a-t-il l'adresse VIDOM de la maison ? Ce qu'il y enverra arrivera ici.",boutons:[["Partager l'adresse","partager"],["Plus tard","plus-tard"]]},
  {q:"manque",t:"Il manque le diagnostic électrique. Le demander au diagnostiqueur ?",boutons:[["Demander","demander"],["Plus tard","plus-tard"]],cond:()=>S.docs.length>=3&&!S.docs.some(d=>d.titre==="Diagnostic électrique")},

function questionDuJour(){
  if(!S.cree)return;
  if(S.dernierJour===today())return;
  const enAttente=S.fil.some(e=>e.type==="question"&&!e.fait);
  if(enAttente){S.dernierJour=today();return}
  const q=QUESTIONS.find(q=>!S.questionsPosees.includes(q.q)&&(!q.cond||q.cond()));
  S.dernierJour=today();
  if(q){S.questionsPosees.push(q.q);filAjouter({type:"question",q:q.q,t:q.t,boutons:q.boutons,ico:"bulle"})}

}

function memoireLogement(){ // résumé compact des vraies données du logement, sans images ni URLs
  return {
    logement:{nom:S.logement.nom,adresse:S.logement.adresse,ville:S.logement.ville,annee:S.logement.annee,
      surface:S.logement.surface,dpe:S.logement.dpe,dpeDate:S.logement.dpeDate,depot:S.logement.depot},
    docs:S.docs.map(d=>({id:d.id,titre:d.titre,type:d.type,date:d.date,fournisseur:d.fournisseur,montant:d.montant,garantie:d.garantie,travaux:d.travaux})),
    equipements:S.equipements.map(e=>({id:e.id,nom:e.nom,marque:e.marque,modele:e.modele,achat:e.achat,garantie:e.garantie,installateur:e.installateur,etat:e.etat,notice:e.notice,entretien:e.entretien})),
    pros:S.pros.map(p=>({id:p.id,nom:p.nom,metier:p.metier,interventions:p.interventions})),
    travaux:S.travaux.map(t=>({id:t.id,titre:t.titre,par:t.par,date:t.date,montant:t.montant})),
  };
}
async function raisonEchec(error){ // le message que la fonction a vraiment renvoyé, quand il y en a un
  try{const r=error&&error.context;if(r&&typeof r.clone==="function"){const c=await r.clone().json();if(c&&typeof c.error==="string")return c.error}}catch(e){}
  return "";
}
const serviceNonConfigure=r=>/configur|cl[ée] api/i.test(r||"");
async function demander(texte){
  const q=(texte||"").trim();if(!q)return;
  const e={type:"qa",q,fait:true,ico:"bulle"};
  if(!supa){e.rep="Indisponible pour l'instant.";e.manque=true;filAjouter(e);return}
  try{
    const {data,error}=await supa.functions.invoke("demander-maison",{body:{question:q,memoire:memoireLogement()}});
    if(error||!data||typeof data.rep!=="string"){
      const r=await raisonEchec(error);
      if(r)console.error("demander-maison :",r);
      // inutile d'inviter à réessayer quand rien ne changera au prochain essai
      e.rep=serviceNonConfigure(r)?"VIDOM ne sait pas encore répondre aux questions : le service de réponse n'est pas configuré.":"Cela n'a pas fonctionné, réessayez.";
      e.manque=true;
    }
    else{
      e.rep=data.rep;e.manque=!!data.manque;
      if(data.refType==="doc"&&S.docs.some(d=>d.id===data.refId))e.doc=data.refId;
      else if(data.refType==="equip"&&S.equipements.some(x=>x.id===data.refId))e.equip=data.refId;
      else if(data.refType==="pro"&&S.pros.some(p=>p.id===data.refId))e.pro=data.refId;
    }
  }catch(err){e.rep="Cela n'a pas fonctionné, réessayez.";e.manque=true}
  filAjouter(e);
}

/* La réception par l'adresse VIDOM est désormais réelle : c'est la fonction Edge receive-email qui
   insère directement dans fil_activite (type "recu", avec le même rec que produisait cette fonction

<script>
/* ================= le dessin de la maison ================= */
function dessinMaison(opts={}){
  const rooms=S.pieces;const n=rooms.length;
  if(!n)return `<p class="small faint" style="text-align:center">Aucune pièce. Ajoutez-en une.</p>`;
  const per=n>9?4:3,bw=per===4?66:88,bh=50,gx=8,gy=8;const rows=Math.ceil(n/per);
  const W=per*bw+(per-1)*gx,H=rows*bh+(rows-1)*gy;const x0=(320-W)/2,y0=48,top=y0+H+10;
  const F='font-family="Source Sans 3, system-ui, sans-serif"';
  let s=`<svg class="house" viewBox="0 0 320 ${top+8}" style="max-width:${opts.mw||300}px" role="img" aria-label="${n} pièces">`;
  s+=`<path d="M${x0-20} ${y0-6} L160 ${y0-40} L${x0+W+20} ${y0-6}" fill="none" stroke="#50575E" stroke-width="2.5" stroke-linejoin="round"/><path d="M${x0-6} ${y0-8} L160 ${y0-34} L${x0+W+6} ${y0-8} Z" fill="#EFE6D8"/>`;
  rooms.forEach((p,i)=>{
    const r=Math.floor(i/per),c=i%per,cnt=Math.min(per,n-r*per),off=(W-(cnt*bw+(cnt-1)*gx))/2;
    const x=x0+off+c*(bw+gx),y=y0+r*(bh+gy);
    const lit=pieceALaLumiere(p),sel=opts.sel===p.id;const nom=p.nom.length>12?p.nom.slice(0,11)+"…":p.nom;const fs=p.nom.length>10?11:12;
    const go=opts.click===false?"":`onclick="location.hash='#/piece/${p.id}'"`;
    if(sel)s+=`<g ${go}><rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="6" fill="#F4E3DB" stroke="#C9775B" stroke-width="2.5"/><text x="${x+bw/2}" y="${y+bh/2+4}" text-anchor="middle" font-size="${fs}" font-weight="600" fill="#A85F45" ${F}>${h(nom)}</text></g>`;
    else if(lit)s+=`<g ${go}><rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="6" fill="#E4EBE6" stroke="#5F7A6A" stroke-width="2"/><text x="${x+bw/2}" y="${y+bh/2+4}" text-anchor="middle" font-size="${fs}" font-weight="600" fill="#4A6255" ${F}>${h(nom)}</text></g>`;
    else s+=`<g ${go}><rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="6" fill="#FFFDF9" stroke="#D8C8B2" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${x+bw/2}" y="${y+bh/2+4}" text-anchor="middle" font-size="${fs}" fill="#B5B0A5" ${F}>${h(nom)}</text></g>`;
  });
  s+=`<line x1="${x0-20}" y1="${top}" x2="${x0+W+20}" y2="${top}" stroke="#50575E" stroke-width="2.5" stroke-linecap="round"/></svg>`;
  return s;
}
function phraseCourte(){const n=S.pieces.length,l=S.pieces.filter(pieceALaLumiere).length;return n?`${l} sur ${n} pièce${n>1?"s":""}`:""}
function phrasePieces(){
  const n=S.pieces.length,l=S.pieces.filter(pieceALaLumiere).length;
  if(!n)return"";
  if(l===0)return `${n} pièce${n>1?"s":""}. Elles s'allumeront à mesure.`;
  if(l===n)return `${n} pièce${n>1?"s":""} sur ${n}. Toute la maison est connue.`;
  const reste=S.pieces.filter(p=>!pieceALaLumiere(p));
  const r=reste.length===1?`il reste ${lc(reste[0].nom)}`:(reste.every(p=>p.type==="chambre")?"les chambres attendent":`il en reste ${reste.length}`);
  return `${l} pièce${l>1?"s":""} sur ${n} · ${r}`;
}

    ${TYPES_PIECES.map(t=>ligne(t.type,t.nom)).join("")}

  </div>

function compter(t,d){S.comptage[t]=Math.max(0,(S.comptage[t]||0)+d);save();render();}
function autrePiece(){modal(`<h2>Une autre pièce</h2><div class="row wrap">${AUTRES_PIECES.map(t=>`<button class="chip btn-chip ${S.comptage[t.type]?"on":""}" onclick="S.comptage['${t.type}']=(S.comptage['${t.type}']||0)+1;save();closeModal();render()">${h(t.nom)}</button>`).join("")}</div><label class="f"><span>Ou un autre nom</span><input class="input" id="apn" placeholder="Atelier, véranda…"></label><button class="btn primary big" onclick="autrePieceLibreOk()">Ajouter</button><button class="btn ghost" onclick="closeModal()">Fermer</button>`)}
function autrePieceLibreOk(){const nom=(document.getElementById("apn")?.value||"").trim();if(!nom){toast("Le nom de la pièce, d'abord.");return}S.piecesLibres=S.piecesLibres||[];S.piecesLibres.push(nom);save();closeModal();render()}
function retirerPieceLibre(i){(S.piecesLibres||[]).splice(i,1);save();render()}
let banSuggestions=[],suggererTimer=null;
function suggerer(v){
  const box=document.getElementById("sugg");S.logement.adresseSaisie=v;
  clearTimeout(suggererTimer);
  if(v.trim().length<3){box.innerHTML="";banSuggestions=[];return}
  suggererTimer=setTimeout(async()=>{
    banSuggestions=await chercherAdresses(v.trim());
    if((document.getElementById("adr")?.value||"")!==v)return; // la saisie a changé entre-temps
    box.innerHTML=banSuggestions.length?`<div class="card" style="position:absolute;left:0;right:0;top:60px;z-index:5;padding:6px 8px;gap:0">${banSuggestions.map((f,i)=>`<button class="line" style="width:100%;text-align:left" onclick="choisirAdresse(${i})">${I.maison}<span style="flex:1 1 auto">${h(f.properties.label)}</span></button>`).join("")}</div>`:"";
  },300);
}
function choisirAdresse(i){
  const f=banSuggestions[i];if(!f)return;
  document.getElementById("adr").value=f.properties.label;
  S.logement.adresseSaisie=f.properties.label;
  S.logement._ban=f;
  document.getElementById("sugg").innerHTML="";save();
}
let adresseOkEnCours=false;
async function adresseOk(){
  const v=(document.getElementById("adr")?.value||S.logement.adresseSaisie||"").trim();
  if(!v){toast("L'adresse, d'abord.");document.getElementById("adr")?.focus();return}
  if(!Object.values(S.comptage).some(n=>n>0)&&!(S.piecesLibres&&S.piecesLibres.length)){toast("Au moins une pièce.");return}
  if(adresseOkEnCours)return; // un double clic pendant la vérification en ligne ne doit jamais créer les pièces deux fois
  adresseOkEnCours=true;
  const btn=document.getElementById("btn-valider-adresse");if(btn){btn.disabled=true;btn.textContent="Un instant…"}
  try{
  S.logement.id=S.logement.id||uid();
  if(!S.logement.canalAcquisition){let _c=null;try{_c=localStorage.getItem("vidom_canal_attente")}catch(e){}if(_c){S.logement.canalAcquisition=_c;try{localStorage.removeItem("vidom_canal_attente")}catch(e){}}}
  const f=S.logement._ban&&S.logement._ban.properties&&S.logement._ban.properties.label===v?S.logement._ban:null;
  if(f){
    const p=f.properties;
    S.logement.adresse=p.name||v;S.logement.cp=p.postcode||"";S.logement.ville=p.city||"";
    const coord=f.geometry&&f.geometry.coordinates;
    S.logement.longitude=coord?coord[0]:null;S.logement.latitude=coord?coord[1]:null;
  }else{ // pas de suggestion choisie : on garde ce qui est tapé, sans deviner de champs qu'on n'a pas
    const m=v.match(/^(.*?),?\s*(\d{5})?\s*([^\d,]*)$/);
    S.logement.adresse=(m&&m[1]||v).trim().replace(/,$/,"")||v;S.logement.cp=(m&&m[2])||"";S.logement.ville=(m&&m[3]||"").trim();
  }
  const rue=S.logement.adresse.replace(/^\d+\s*(bis|ter)?\s*/i,"").replace(/^(rue|avenue|boulevard|impasse|chemin|allée|place|route)\s+(de\s|des\s|du\s|d'|de la\s|de l')?/i,"");
  S.logement.nom=S.logement.nom||`Maison ${/^[aeiouy]/i.test(rue)?"de l'":"des "}${rue.charAt(0).toUpperCase()+rue.slice(1)}`;
  toast("VIDOM vérifie l'adresse…");
  S.logement.depot=await allouerDepot(S.logement.nom);
  await enrichirAdresse();
  if(!S.logements.some(l=>l.id===S.logement.id))S.logements.push({id:S.logement.id,nom:S.logement.nom,ville:S.logement.ville,adresse:S.logement.adresse});
  creerPieces();S.etape="maison-adresse";save();render();
  }finally{adresseOkEnCours=false}
}

function terminerLot(lot){
  const nees=[];lot.forEach(r=>{if(r.k!=="inconnu"){r.statut="range";ranger(r)}});
  const n=naissances();
  S.derniereBatch={date:now(),items:lot.map(r=>({id:r.id,k:r.k,pieceId:r.pieceId,titre:r.k==="equip"?r.nom:(r.titre||"Photo non reconnue"),img:r.img,pdf:!!r.pdf,chemin:r.chemin||null,statut:r.statut,nees:false}))};
  S.derniereBatch.nees=n.map(c=>c.nom);
  S.lot=null;save();
  if(!S.cree){S.cree=true;S.etape="";S.ajout=false;S.retourVers=null;save();route("#/tri")}else route("#/tri");
}

/* Un document arrivé par l'adresse VIDOM n'a que son chemin de stockage, pas encore d'adresse pour l'afficher :
   on la demande à la volée, puis on redessine. */
function assurerImage(o){
  if(!o||o.img||!o.chemin||o._sig||!supa)return;
  o._sig=true;
  supa.storage.from("logement-files").createSignedUrl(o.chemin,60*60*24*30).then(({data})=>{if(data&&data.signedUrl){o.img=data.signedUrl;save();render()}}).catch(()=>{});
}

  if(rec.img)return `<img src="${rec.img}" alt="">`;
  return "";
}

      <p class="muted">${detail}</p>

/* ================= fichiers → photos → reconnaissance ================= */
async function televerser(blob,ext,mime){ // dépose le fichier dans le vrai stockage VIDOM ; renvoie null si indisponible (compte non connecté, hors ligne…)
  if(!supa||!S.logement.id)return null;
  try{
    const chemin=`${S.logement.id}/${uid()}.${ext}`;
    const {error}=await supa.storage.from("logement-files").upload(chemin,blob,{contentType:mime,upsert:false});
    if(error)return null;
    const {data}=await supa.storage.from("logement-files").createSignedUrl(chemin,60*60*24*30);
    if(!data||!data.signedUrl)return null;
    return {chemin,url:data.signedUrl};
  }catch(e){return null}
}
function reduire(file){return new Promise(res=>{
  if(file.type==="application/pdf"){ // gardé tel quel : c'est le vrai document, pas une photo à réduire
    televerser(file,"pdf","application/pdf").then(t=>{
      if(t){res({url:t.url,pdf:true,chemin:t.chemin});return}
      const fr=new FileReader();fr.onload=()=>res({url:fr.result,pdf:true,chemin:null});fr.onerror=()=>res(null);fr.readAsDataURL(file);
    });
    return;
  }
  if(!file.type.startsWith("image/")){res(null);return}
  const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{try{
    // D-179 : la photo gardée en ligne doit rester lisible (une facture à 520 points ne se relit pas) : 2000 points de côté au plus.
    // La petite image (520 points) ne sert plus que de secours, quand la connexion manque et que tout reste sur l'appareil.
    const dessiner=max=>{let w=img.width,h2=img.height;const k=Math.min(1,max/Math.max(w,h2));w=Math.round(w*k);h2=Math.round(h2*k);const cv=document.createElement("canvas");cv.width=w;cv.height=h2;cv.getContext("2d").drawImage(img,0,0,w,h2);return cv};
    const grand=dessiner(2000);let petit=null;const c={toDataURL:(t,q)=>(petit=petit||dessiner(520)).toDataURL(t,q),toBlob:(f,t,q)=>grand.toBlob(f,t,q)};
    c.toBlob(blob=>{
      URL.revokeObjectURL(url);
      if(!blob){res({url:c.toDataURL("image/jpeg",.7),pdf:false,chemin:null});return}
      televerser(blob,"jpg","image/jpeg").then(t=>{
        if(t){res({url:t.url,pdf:false,chemin:t.chemin});return}
        res({url:c.toDataURL("image/jpeg",.7),pdf:false,chemin:null});
      });
    },"image/jpeg",.85);
  }catch(e){URL.revokeObjectURL(url);res(null)}};
  img.onerror=()=>{URL.revokeObjectURL(url);res(null)};img.src=url;
})}
const MOTS_PIECES={ // mots-clés reconnus dans le nom d'un équipement ou d'un document → type de pièce ; ne joue que pour un import général (sans pièce précise)
  cuisine:["lave-vaisselle","réfrigérateur","frigo","congélateur","congelateur","four","hotte","plaque de cuisson","cuisinière","cuisiniere","micro-ondes","évier","evier"],
  "salle de bain":["baignoire","douche","lavabo","chauffe-eau","chauffe eau","ballon d'eau chaude"],
  chambre:["lit","matelas","armoire","dressing"],
  salon:["télévision","television","canapé","canape","cheminée","cheminee"],
  buanderie:["lave-linge","lave linge","sèche-linge","seche-linge","sèchoir","sechoir"],
  bureau:["ordinateur","imprimante"],
};
const MOTS_INVITE=["wifi","wi-fi","internet","box","routeur","modem","chauffage","poêle","poele","cheminée","cheminee","clim","climatisation","chaudière","chaudiere","digicode","alarme","portail","volet"]; // équipements à proposer par défaut dans le mode d'emploi invité (D-157)
function suggererPiece(rec){ // propose une pièce à partir de ce que VIDOM a reconnu ; ne tranche que si une seule pièce de ce type existe dans la maison
  if(rec.k!=="equip"&&rec.k!=="doc")return null;
  const texte=slug(`${rec.nom||""} ${rec.titre||""}`);
  for(const type in MOTS_PIECES){
    if(MOTS_PIECES[type].some(m=>texte.includes(slug(m)))){
      const candidats=S.pieces.filter(p=>p.type===type);
      if(candidats.length===1)return candidats[0].id;
    }
  }
  return null;
}
const MOTS_METIER={ // mots-clés reconnus dans le nom d'un équipement → métier à chercher pour « Trouver un professionnel »
  plombier:["évier","evier","lavabo","baignoire","douche","robinet","wc","toilettes","fuite","chauffe-eau","chauffe eau","ballon d'eau chaude"],
  chauffagiste:["chaudière","chaudiere","chauffage","radiateur","pompe à chaleur","pompe a chaleur"],
  climaticien:["climatisation","clim"],
  "électricien":["tableau électrique","tableau electrique","prise","disjoncteur","électrique","electrique"],
  "réparateur électroménager":["four","plaque de cuisson","cuisinière","cuisiniere","hotte","micro-ondes","lave-vaisselle","réfrigérateur","refrigerateur","frigo","congélateur","congelateur","lave-linge","sèche-linge","seche-linge"],
  serrurier:["serrure","verrou","clé","cle"],
  menuisier:["fenêtre","fenetre","volet","porte","placard","parquet"],
  couvreur:["toiture","toit","gouttière","gouttiere","tuile"],
};
function suggererMetier(nom){ // devine le métier à chercher à partir du nom d'un équipement (D-166)
  const texte=slug(nom||"");
  for(const metier in MOTS_METIER){
    if(MOTS_METIER[metier].some(m=>texte.includes(slug(m))))return metier;
  }
  return null;
}
async function fichiers(files,pieceId){
  const list=[...files].slice(0,30);if(!list.length)return;
  closeModal();
  const maj=i=>{const el=document.getElementById("prog-txt");if(el)el.textContent=list.length>1?`VIDOM regarde vos documents… (${i}/${list.length})`:"VIDOM regarde…"};
  modal(`<div class="stack" style="align-items:center;padding:26px 10px;gap:16px"><div class="spin" aria-hidden="true"></div><p class="b" id="prog-txt" style="text-align:center">${list.length>1?`VIDOM regarde vos documents… (0/${list.length})`:"VIDOM regarde…"}</p></div>`);
  const trop=S.equipements.length+S.docs.length>40;
  const lot=[];let i=0;
  for(const f of list){const r=trop?null:await reduire(f);const rec=await reconnaitre(f,pieceId,r&&r.url,r&&r.pdf,r&&r.chemin);rec.pieceId=rec.pieceId||pieceId||"maison";if(pieceId==="maison")rec.pieceId=suggererPiece(rec)||rec.pieceId;lot.push(rec);i++;maj(i)}

  if(lot.length===1){S.lot=lot;if(!S.cree){S.cree=true;S.etape="";S.ajout=false;S.retourVers=null}save();route("#/reconnu")}
  else terminerLot(lot);
}

function ajouterPiecesOk(){

  const autre=(document.getElementById("pn")?.value||"").trim();
  if(autre){creerPiece("autre",autre,true);n++}

function creerPiece(type,nom,silencieux){if(!nom)return;const n=S.pieces.filter(p=>p.type===type).length;const def=[...TYPES_PIECES,...AUTRES_PIECES].find(t=>t.type===type);

  S.pieces.push({id:uid(),type,nom:def&&n>0?`${def.nom} ${n+1}`:nom,photos:[]});S.comptage[type]=(S.comptage[type]||0)+1;

/* D-184 : toutes les garanties et extensions de garantie au même endroit. Une garantie vient d'un document (facture, contrat de garantie)
   ou de la fiche d'un équipement ; quand les deux disent la même chose, on n'en montre qu'une, rattachée à l'appareil. */
function listeGaranties(){
  const L=[];const vus=new Set();
  S.docs.filter(d=>d.garantie).forEach(d=>{const eq=d.lie?equipParLie(d.lie):null;if(eq)vus.add(eq.id);L.push({fin:d.garantie,quoi:eq?`${eq.nom}${eq.marque?" "+eq.marque:""}`:d.titre,ou:d.fournisseur||"",doc:d,eq})});
  S.equipements.filter(e=>e.garantie&&!vus.has(e.id)).forEach(e=>L.push({fin:e.garantie,quoi:`${e.nom}${e.marque?" "+e.marque:""}`,ou:"",doc:null,eq:e}));
  L.forEach(x=>{x.enCours=joursDepuis(x.fin)<0});
  return L.sort((a,b)=>a.enCours===b.enCours?String(a.fin).localeCompare(String(b.fin)):(a.enCours?-1:1));
}
const aRelire=()=>S.docs.filter(d=>d.chemin&&!d.relu&&!d.garantie&&!d.lie&&["facture","garantie"].includes(d.type));
function vGaranties(){
  const L=listeGaranties();const cours=L.filter(x=>x.enCours),finies=L.filter(x=>!x.enCours);const n=aRelire().length;
  const ligne=x=>`<a class="line" href="${x.doc?"#/document/"+x.doc.id:"#/equipement/"+x.eq.id}">${I.check}<span class="stack" style="flex:1 1 auto;gap:0"><span class="b">${h(x.quoi)}</span><span class="small muted">${x.enCours?"jusqu'au "+dateFr(x.fin):"terminée le "+dateFr(x.fin)}${x.ou?" · "+h(x.ou):""}${x.enCours&&joursDepuis(x.fin)>-180?" · bientôt finie":""}</span></span>${I.fleche}</a>`;
  return `<div class="view" style="gap:12px"><div class="stack" style="gap:2px"><h1 class="h" style="font-size:1.45em">Garanties</h1><p class="muted">Les garanties et les extensions de garantie lues sur vos factures, avec leur date de fin. VIDOM vous le rappelle un mois avant.</p></div>
    ${cours.length?`<div class="card" style="gap:0;padding:4px 16px"><p class="small b" style="padding:8px 0 4px;color:var(--sauge-f)">En cours</p>${cours.map(ligne).join("")}</div>`:`<div class="card soft"><p class="small">Aucune garantie en cours n'est connue pour l'instant.</p></div>`}
    ${finies.length?`<div class="card" style="gap:0;padding:4px 16px"><p class="small b" style="padding:8px 0 4px;color:var(--sauge-f)">Terminées</p>${finies.map(ligne).join("")}</div>`:""}
    ${n?`<div class="card soft" style="gap:8px"><p class="small">${n===1?"Une facture gardée n'a":n+" factures gardées n'ont"} pas encore été relue${n>1?"s":""} pour y chercher une garantie et l'appareil concerné.</p><div class="row"><button class="btn sm" onclick="relireFactures()">Chercher les garanties dans ${n===1?"cette facture":"ces "+n+" factures"}</button></div><p class="small faint">Chaque relecture compte comme une lecture de document.</p></div>`:""}
  </div>`;
}
let relectureLot=false;
async function relireFactures(){
  if(relectureLot)return;relectureLot=true;
  const liste=aRelire();let i=0,trouvees=0;
  for(const d of liste){
    i++;toast(`VIDOM relit vos factures… ${i} sur ${liste.length}`);
    const avant=d.garantie;await relireDoc(d.id,true);d.relu=true;if(d.garantie&&!avant)trouvees++;
  }
  relectureLot=false;naissances();save();render();
  toast(trouvees?(trouvees===1?"Une garantie retrouvée":trouvees+" garanties retrouvées"):"Aucune garantie de plus dans ces factures");
}

/* D-180 : retirer, c'est retirer pour de vrai — sur l'appareil, sur le compte et dans les fichiers gardés.
   (Avant, le document retiré revenait à la relecture du compte : la maquette n'effaçait rien en ligne.) */
async function effacerEnLigne({docs=[],equips=[],chemins=[]}){
  if(!supa)return;
  try{
    const {data:s}=await supa.auth.getSession();if(!s||!s.session)return;
    if(equips.length){
      const {data:photos}=await supa.from("documents").select("id,chemin_stockage").in("equipement_id",equips).eq("type_document","photo");
      (photos||[]).forEach(ph=>{docs.push(ph.id);if(ph.chemin_stockage)chemins.push(ph.chemin_stockage)});
    }
    if(docs.length)await supa.from("documents").delete().in("id",docs);
    if(equips.length){try{await supa.from("rappels").delete().in("equipement_id",equips)}catch(_){}}
    if(equips.length)await supa.from("equipements").delete().in("id",equips);
    const uniques=[...new Set(chemins.filter(Boolean))];
    const encore=new Set([...S.docs,...S.equipements].map(x=>x.chemin).filter(Boolean)); // un même fichier peut servir à deux fiches : on ne l'efface que s'il ne sert plus
    const aEffacer=uniques.filter(c=>!encore.has(c));
    if(aEffacer.length)await supa.storage.from("logement-files").remove(aEffacer);
  }catch(e){console.error("VIDOM : l'effacement en ligne a échoué.",e)}
}
/* D-182 : relire un document déjà gardé, pour profiter d'une lecture devenue meilleure (garantie, appareil visé). */
async function relireDoc(id,silence){
  const d=S.docs.find(x=>x.id===id);if(!d||!d.chemin||!supa)return;
  const toastOrig=toast;if(silence)toast=()=>{};else toast("VIDOM relit le document…");
  try{await relireDocInterne(d)}finally{toast=toastOrig}
}
async function relireDocInterne(d){
  try{
    const {data}=await supa.storage.from("logement-files").createSignedUrl(d.chemin,600);
    const blob=await (await fetch(data.signedUrl)).blob();
    const file=new File([blob],d.pdf?"document.pdf":"photo.jpg",{type:d.pdf?"application/pdf":(blob.type||"image/jpeg")});
    const lu=await reconnaitre(file,d.piece||"maison",null,d.pdf,d.chemin);
    if(lu.k!=="doc"){toast("VIDOM n'a rien trouvé de plus.");return}
    if(lu.garantie&&!d.garantie)d.garantie=lu.garantie;
    if(!d.lie){const r={lie:"",appareil:lu.appareil,type:d.type,date:d.date,garantie:d.garantie||lu.garantie,pieceId:d.piece};relierAppareil(r);if(r.lie)d.lie=r.lie}
    d.relu=true;naissances();save();render();
    const eq=d.lie?equipParLie(d.lie):null;
    toast(eq?`Relié à : ${eq.nom}${eq.marque?" "+eq.marque:""}`:"Relu. Aucun appareil précis n'est visé par ce document.");
  }catch(e){toast("La relecture a échoué. Réessayez dans un instant.")}
}

/* D-180 : les doublons. Deux documents sont tenus pour le même quand ils ont le même émetteur, la même date et le même montant
   (ou, sans montant, le même titre) ; deux équipements, quand ils ont la même marque et le même modèle (ou, sans modèle, le même nom).
   VIDOM propose, le gardien décide : on garde le plus complet, à défaut le plus ancien. */
const cleTexte=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"");
function doublonsDocs(){
  const par={};
  S.docs.forEach(d=>{const k=d.montant!=null&&d.montant!==""?[cleTexte(d.fournisseur).slice(0,12),d.date,Math.round(d.montant*100)].join("|"):["t",cleTexte(d.titre),d.date,cleTexte(d.fournisseur).slice(0,12)].join("|");(par[k]=par[k]||[]).push(d)});
  const poids=d=>(d.lie?4:0)+(d.garantie?2:0)+(S.travaux.some(t=>(t.docs||[]).includes(d.id))?4:0)+(d.pdf?1:0);
  return Object.values(par).filter(g=>g.length>1).map(g=>{const tri=g.slice().sort((a,b)=>poids(b)-poids(a)||String(a.dateRecu||"").localeCompare(String(b.dateRecu||"")));return {garde:tri[0],retire:tri.slice(1)}});
}
function doublonsEquips(){
  const par={};
  S.equipements.forEach(e=>{const k=e.modele?[cleTexte(e.marque),cleTexte(e.modele)].join("|"):["n",cleTexte(e.nom),cleTexte(e.marque),e.piece].join("|");(par[k]=par[k]||[]).push(e)});
  const poids=e=>docsLies(e).length*4+(e.garantie?2:0)+(e.ref?1:0)+(e.img||e.chemin?1:0);
  return Object.values(par).filter(g=>g.length>1).map(g=>{const tri=g.slice().sort((a,b)=>poids(b)-poids(a)||String(a.date||"").localeCompare(String(b.date||"")));return {garde:tri[0],retire:tri.slice(1)}});
}
function carteDoublons(quoi){
  const g=quoi==="docs"?doublonsDocs():doublonsEquips();const n=g.reduce((a,x)=>a+x.retire.length,0);
  if(!n)return "";
  return `<div class="card soft" style="gap:8px"><p class="small">${n===1?"Un doublon probable":n+" doublons probables"} : ${quoi==="docs"?"le même document gardé plusieurs fois":"le même appareil gardé plusieurs fois"}.</p><div class="row"><button class="btn sm" onclick="voirDoublons('${quoi}')">Voir et retirer les doublons</button></div></div>`;

/* D-178 : la note vocale sur la fiche d'un professionnel. On enregistre avec le micro de l'appareil, on réécoute,
   on retire. Le son est rangé avec les fichiers du logement ; la fiche n'en garde que le chemin, la date et la durée. */
let enreg=null; // {proId,rec,flux,morceaux,debut,timer}
const dureeFr=s=>{s=Math.round(s||0);return s<60?s+" s":Math.floor(s/60)+" min "+String(s%60).padStart(2,"0")};
function carteVocales(p){
  const liste=p.vocales||[];
  liste.forEach(v=>{if(v.chemin&&!v.url&&!v._sig&&supa){v._sig=true;supa.storage.from("logement-files").createSignedUrl(v.chemin,60*60*24*30).then(({data})=>{if(data&&data.signedUrl){v.url=data.signedUrl;if(!enreg)render()}}).catch(()=>{})}});
  const enCours=enreg&&enreg.proId===p.id;
  return `<div class="card" style="gap:10px"><p class="small b" style="color:var(--sauge-f)">Vos notes vocales</p>
    ${liste.length?"":`<p class="small muted">Dites ce que vous voulez retenir : comment le chantier s'est passé, ce qu'il faudra lui redemander. L'artisan ne l'entend jamais.</p>`}
    ${liste.map(v=>`<div class="stack" style="gap:4px"><div class="split"><span class="small muted">${dateFr(v.d)} · ${dureeFr(v.duree)}</span><button class="btn sm ghost" onclick="retirerVocale('${p.id}','${v.id}')">Retirer</button></div>${v.url?`<audio controls preload="metadata" src="${v.url}" style="width:100%"></audio>`:`<p class="small muted">Un instant…</p>`}</div>`).join("")}
    ${enCours?`<div class="row"><span class="small b" style="color:var(--terra-f);flex:1 1 auto">● Enregistrement… <span id="enreg-t">0 s</span></span><button class="btn primary" onclick="arreterVocale()">Terminer</button><button class="btn" onclick="arreterVocale(true)">Annuler</button></div>`
      :`<div class="row"><button class="btn grow" onclick="enregistrerVocale('${p.id}')">${I.micro} Enregistrer une note</button></div>`}
  </div>`;
}
async function enregistrerVocale(proId){
  if(enreg)return;
  if(!navigator.mediaDevices||!window.MediaRecorder){toast("Cet appareil ne permet pas d'enregistrer ici.");return}
  let flux;
  try{flux=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast("VIDOM n'a pas accès au micro. Autorisez-le dans le navigateur.");return}
  const type=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].find(t=>MediaRecorder.isTypeSupported(t))||"";
  const rec=new MediaRecorder(flux,type?{mimeType:type}:undefined);
  enreg={proId,rec,flux,morceaux:[],debut:Date.now(),annule:false,timer:null};
  rec.ondataavailable=e=>{if(e.data&&e.data.size)enreg.morceaux.push(e.data)};
  rec.onstop=()=>finirVocale();
  rec.start();
  enreg.timer=setInterval(()=>{const el=document.getElementById("enreg-t");const s=(Date.now()-enreg.debut)/1000;if(el)el.textContent=dureeFr(s);if(s>=180)arreterVocale()},500); // trois minutes au plus
  render();
}
function arreterVocale(annuler){if(!enreg)return;enreg.annule=!!annuler;clearInterval(enreg.timer);try{enreg.rec.stop()}catch(e){finirVocale()}}
async function finirVocale(){
  const e=enreg;if(!e)return;enreg=null;
  try{e.flux.getTracks().forEach(t=>t.stop())}catch(_){}
  const p=S.pros.find(x=>x.id===e.proId);
  if(e.annule||!p||!e.morceaux.length){render();return}
  const mime=(e.rec.mimeType||"audio/webm").split(";")[0];
  const blob=new Blob(e.morceaux,{type:mime});
  const v={id:uid(),d:today(),duree:Math.round((Date.now()-e.debut)/1000),chemin:null,url:URL.createObjectURL(blob)};
  p.vocales=p.vocales||[];p.vocales.unshift(v);render();
  let ok=false;
  try{
    if(supa&&S.logement.id){
      const ext=mime.includes("mp4")?"m4a":(mime.includes("ogg")?"ogg":"webm");
      const chemin=`${S.logement.id}/vocal-${v.id}.${ext}`;
      const {error}=await supa.storage.from("logement-files").upload(chemin,blob,{contentType:mime,upsert:false});
      if(!error){v.chemin=chemin;ok=true}
    }
  }catch(_){}
  save();
  toast(ok?"Note vocale conservée":"Note gardée sur cet appareil seulement : la connexion a manqué.");
}
