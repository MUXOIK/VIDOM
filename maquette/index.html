async function garderEnvoi(code){
  let session=null;
  try{const {data}=await supa.auth.getSession();session=data&&data.session}catch(e){}
  if(session&&S.cree&&S.logement&&S.logement.id){
    toast("Un instant…");
    try{
      const {data,error}=await supa.rpc("garder_envoi",{p_code:code,p_logement_id:S.logement.id});
      if(error){toast("Cela n'a pas fonctionné : "+error.message);return}
      const art=data&&data.artisan;
      if(art&&!S.pros.some(x=>x.id===art.id)){S.pros.push({id:art.id,nom:art.nom,metier:art.metier||"",tel:art.telephone||"",mail:art.email||"",ville:art.ville||"",interventions:[],avis:[]});save()}
      location.hash=art?("#/pro/"+art.id):"#/carte/pro";render();
      toast(`Gardé dans la mémoire de ${S.logement.nom}`);
    }catch(e){toast("Cela n'a pas fonctionné.")}
    return;
  }
  try{localStorage.setItem("vidom_envoi_attente",code)}catch(e){}
  try{localStorage.setItem("vidom_canal_attente","envoi")}catch(e){}
  S.etape="compte";save();location.hash="";render();
}
async function verifierEnvoiEnAttente(){
  let code=null;try{code=localStorage.getItem("vidom_envoi_attente")}catch(e){}
  if(!code||!supa||!S.cree||!S.logement||!S.logement.id)return;
  try{
    const {data,error}=await supa.rpc("garder_envoi",{p_code:code,p_logement_id:S.logement.id});
    if(error){
      if(/introuvable|expiré/i.test(error.message||"")){try{localStorage.removeItem("vidom_envoi_attente")}catch(e){}}
      return;
    }
    try{localStorage.removeItem("vidom_envoi_attente")}catch(e){}
    const art=data&&data.artisan;
    if(art&&!S.pros.some(x=>x.id===art.id)){
      S.pros.push({id:art.id,nom:art.nom,metier:art.metier||"",tel:art.telephone||"",mail:art.email||"",ville:art.ville||"",interventions:[],avis:[]});

}

/* ================= transmission ================= */
function vTransmission(){const T=S.transmission;
  const dossier=(id,nom,contenu)=>`<button class="card" style="text-align:left;gap:4px" onclick="ouvrirDossier('${id}')"><span class="b">${nom}</span><span class="small muted">${contenu}</span></button>`;
  return `<div class="view" style="gap:12px"><h1 class="h" style="font-size:1.45em">Transmission</h1><p class="muted">${T.motif==="vente"?"La maison va changer de mains. Voici ce qu'elle peut laisser au suivant.":T.motif==="depart"?"Vous quittez la maison. Sa mémoire peut continuer sans vous.":"Quelqu'un demande la mémoire de la maison."}</p>
    ${dossier("vente","Le dossier de vente","Acte, diagnostics, travaux, équipements et garanties — pour le notaire, l'agent, l'acquéreur.")}
    ${dossier("livre","Le livre du logement","Son histoire, année par année, avec les artisans qui la connaissent. Gratuit, toujours.")}
    ${dossier("carnet","Le carnet d'entretien","Ce qui est à faire, et quand. Gratuit, toujours.")}
    <div class="card soft" style="gap:8px"><p class="small b" style="color:var(--sauge-f)">Le jour où la maison change de mains</p><p class="small">Vous triez en trois catégories : ce qui reste à la maison, ce qui part avec vous, ce qui s'efface. Rien ne part sans votre geste.</p><button class="btn" onclick="trierTransmission()">Faire le tri</button><button class="btn ghost sm" onclick="modeBlanc()">Le jouer à blanc, sans rien changer</button></div>
    <button class="btn ghost" onclick="S.transmission=null;S.nees=S.nees.filter(x=>x!=='transmission');save();route('#/maison')">Finalement, pas maintenant</button>
  </div>`}
function ouvrirDossier(id){const docs=S.docs;const eqs=S.equipements;const pages={vente:{titre:"Dossier de vente",pages:[["Le logement",[`${S.logement.nom}, ${S.logement.adresse}, ${S.logement.cp} ${S.logement.ville}`,`Construite en ${S.logement.annee||"?"} · ${S.logement.surface||"?"} m² · DPE ${S.logement.dpe||"?"}`]],["Acte et diagnostics",docs.filter(d=>d.type==="acte"||d.type==="diagnostic").map(d=>d.titre+" — "+dateFr(d.date))],["Travaux",S.travaux.map(t=>`${t.titre} — ${t.par}, ${dateFr(t.date)}${t.montant?", "+euros(t.montant):""}`)],["Équipements et garanties",eqs.map(e=>`${e.nom} ${e.marque}${e.garantie&&joursDepuis(e.garantie)<0?" — garanti jusqu'en "+e.garantie.slice(0,4):""}`)]]},
    livre:{titre:"Le livre du logement",pages:[["L'histoire",[...docs.map(d=>dateFr(d.date)+" — "+d.titre),...S.fil.filter(e=>e.type==="souvenir").map(e=>dateFr(e.d)+" — "+e.t)].sort()],["Ceux qui la connaissent",S.pros.filter(p=>categorieDe(p)==="artisan").map(p=>`${p.nom}, ${p.metier.toLowerCase()}`)]]}, // D-168 : le notaire et l'assureur ne sont pas de « ceux qui la connaissent »
    carnet:{titre:"Le carnet d'entretien",pages:[["À faire chaque année",eqs.filter(e=>e.entretien).map(e=>`${e.nom} — entretien annuel${e.installateur?", "+e.installateur:""}`)],["Garanties en cours",eqs.filter(e=>e.garantie&&joursDepuis(e.garantie)<0).map(e=>`${e.nom} — jusqu'au ${dateFr(e.garantie)}`)]]}}[id];
  modal(`<h2>${pages.titre}</h2>${pages.pages.map(([t,l])=>`<div class="book"><p class="b">${h(t)}</p>${l.length?l.map(x=>`<label class="check"><input type="checkbox" checked><span class="small">${h(x)}</span></label>`).join(""):`<p class="small faint">Rien encore.</p>`}</div>`).join("")}<p class="small muted">Chaque ligne se garde ou se retire. ${id==="vente"?"19 € — gratuit pendant la version test.":"Gratuit."}</p><div class="row"><a class="btn primary grow" href="mailto:?subject=${encodeURIComponent(pages.titre+" — "+S.logement.nom)}" onclick="closeModal();S.journalAcces.unshift({d:now(),t:'${h(pages.titre)} envoyé par vous'});filAjouter({type:'info',t:'${h(pages.titre)} envoyé depuis votre messagerie.',ico:'envoi',fait:true});render()">${I.envoi} Envoyer</a><button class="btn" onclick="closeModal()">Fermer</button></div>`)}
function trierTransmission(blanc){const cat=x=>`<div class="card" style="gap:4px"><p class="small b" style="color:var(--sauge-f)">${x[0]}</p><p class="small muted">${x[1]}</p>${x[2].map(i=>`<label class="check"><input type="checkbox" checked><span class="small">${h(i)}</span></label>`).join("")||`<p class="small faint">Rien.</p>`}</div>`;
  modal(`<h2>${blanc?"À blanc — rien ne change":"Le tri"}</h2>${cat(["Reste à la maison","Pour le prochain gardien.",[...S.docs.filter(d=>d.type!=="impot"&&d.type!=="contrat").map(d=>d.titre),...S.equipements.map(e=>e.nom),...S.pros.map(p=>p.nom)]])}${cat(["Part avec vous","Vos papiers à vous.",S.docs.filter(d=>d.type==="impot"||d.type==="contrat").map(d=>d.titre)])}${cat(["S'efface","Ce qui ne regarde personne.",S.fil.filter(e=>e.type==="souvenir").map(e=>e.t)])}<div class="row"><button class="btn ${blanc?"":"primary"} grow" onclick="closeModal();${blanc?"toast('Joué à blanc. Rien n\\'a changé.')":"transmettre()"}">${blanc?"Terminer l'essai":"Transmettre la mémoire"}</button><button class="btn" onclick="closeModal()">Annuler</button></div>`)}

function changerDeMains(motif){S.transmission={motif,d:today()};naissances();filAjouter({type:"naissance",t:motif==="vente"?"Vous vendez la maison. La rubrique Transmission est apparue : le dossier de vente, le livre du logement, et le tri du dernier jour.":"Vous quittez la maison. La rubrique Transmission est apparue.",go:"#/carte/transmission",ico:"cle"});save();route("#/carte/transmission")}

function montrerCompte(){
  modal(`<h2>Votre compte</h2><p class="muted">${h(S.compte.email||"Sans courriel")}</p>
  <p class="small faint">Votre compte et la mémoire de vos logements sont enregistrés pour de vrai, et retrouvés sur chacun de vos appareils quand vous vous connectez.</p>
  <button class="btn" onclick="confirmerDeconnexion()">${I.cle} Se déconnecter</button>
  <button class="btn ghost" onclick="closeModal()">Fermer</button>`);
}
function confirmerDeconnexion(){
  modal(`<h2>Se déconnecter ?</h2>
  <p class="muted">Cet appareil oublie vos logements. Rien n'est effacé : votre mémoire reste sur votre compte, et vous la retrouvez en vous reconnectant.</p>
  <button class="btn primary big" onclick="seDeconnecter()">Se déconnecter</button>
  <button class="btn ghost" onclick="closeModal()">Annuler</button>`);
}
async function seDeconnecter(){
  clearTimeout(pousserTout_timer);hydrateEnCours=true; // plus rien ne part vers le compte une fois la porte fermée
  try{if(supa)await supa.auth.signOut()}catch(e){}
  toutEffacer(); // efface cet appareil et recharge : on revient à l'écran d'accueil
}
function toutEffacer(){try{Object.keys(localStorage).filter(k=>k===KEY||k.startsWith(KEY+":")).forEach(k=>localStorage.removeItem(k))}catch(e){}location.hash="";location.reload()}
function emporter(){const data=JSON.stringify(S,null,2);const b=new Blob([data],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`vidom-${slug(S.logement.nom||"maison")}-${today()}.json`;document.body.appendChild(a);a.click();a.remove();toast("Votre mémoire est téléchargée")}
</script>

AIDE.forEach((s,i)=>s.l.forEach((e,j)=>e.id=i+"-"+j));
const AIDE_VIDES=new Set("je veux voudrais voudrai vais souhaite une un le la les des de du mon ma mes comment faire pour et à en avec ce cette que qui quoi est il y a ou vous on se sa son ses dans sur au aux faut dois puis peut peux veut me moi nous notre nos comment où".split(" "));
const aideNorm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g," ");
function aideMots(q){return aideNorm(q).split(/[^a-z0-9]+/).filter(m=>m.length>1&&!AIDE_VIDES.has(m)).map(m=>m.replace(/(s|x)$/,""))}
function aideCherche(q){
  const mots=aideMots(q);
  if(!mots.length)return AIDE;
  const texte=e=>aideNorm(e.q+" "+e.c+" "+(e.k||""));
  const filtre=test=>AIDE.map(s=>({t:s.t,l:s.l.filter(e=>test(texte(e)))})).filter(s=>s.l.length);
  const tous=filtre(t=>mots.every(m=>t.includes(m)));
  return tous.length?tous:filtre(t=>mots.some(m=>t.includes(m)));
}
let aideQ="";
const boutonAide=()=>`<button class="aide" onclick="ouvrirAide()" aria-label="Aide : tout ce que VIDOM sait faire" title="Aide">${I.aide}</button>`;
function ouvrirAide(q){
  aideQ=q||"";
  modal(`<div class="split"><h2 style="margin:0">Que voulez-vous faire ?</h2><button class="btn ghost sm" onclick="closeModal()" aria-label="Fermer">${I.croix}</button></div>
  <p class="small muted">Tout ce que VIDOM sait faire, et par où commencer. Choisissez, ou écrivez ce que vous cherchez.</p>
  <input class="input" id="aide-q" placeholder="Une facture, un sinistre, vendre…" autocomplete="off" value="${h(aideQ)}" oninput="aideQ=this.value;aideRendre()" aria-label="Chercher dans l'aide">
  <div id="aide-liste" class="stack" style="gap:12px"></div>`);
  aideRendre();
  if(isDesk())setTimeout(()=>{const i=document.getElementById("aide-q");if(i)i.focus()},50);
}
function aideRendre(){
  const box=document.getElementById("aide-liste");if(!box)return;
  const sections=aideCherche(aideQ);
  const ligne=e=>`<button class="line" style="width:100%;text-align:left" onclick="aideAller('${e.id}')"><span class="stack" style="gap:0;flex:1 1 auto"><span class="b">${h(e.q)}</span><span class="small muted">${h(e.c)}</span></span>${e.go?I.fleche:`<span class="chip neutre">${I.cadenas} Bientôt</span>`}</button>`;
  box.innerHTML=sections.length
    ?sections.map(s=>`<div class="card" style="gap:0;padding:4px 16px"><p class="small b" style="padding:8px 0 4px;color:var(--sauge-f)">${h(s.t)}</p>${s.l.map(ligne).join("")}</div>`).join("")
    :`<div class="card soft" style="gap:8px"><p class="small">Rien de ce nom dans l'aide. La maison, elle, saura peut-être répondre.</p><button class="btn primary" onclick="aideQuestion(aideQ)">${I.bulle} Demander à la maison</button></div>`;
}
function aideAller(id){
  const e=AIDE.flatMap(s=>s.l).find(x=>x.id===id);if(!e)return;
  closeModal();
  if(!e.go){aideBientot(e);return}
  if(typeof e.go==="string")route(e.go);else e.go();
}
function aideBientot(e){modal(`<h2>Pas encore.</h2><p class="muted"><b>${h(e.q)}</b> — VIDOM saura le faire dans une version à venir. ${h(e.c)}</p><p class="small faint">La version test grandit avec ce que vous lui demandez. Dites-nous si cela vous manque.</p><div class="row"><a class="btn grow" href="mailto:contact@vidom.fr?subject=${encodeURIComponent("VIDOM — "+e.q)}" onclick="closeModal()">${I.mail} Cela me manque</a><button class="btn ghost" onclick="closeModal()">Fermer</button></div>`)}
/* les gestes que l'aide déclenche */
function aideFichier(accept,capture,fn){ // ouvre le choix de fichier depuis n'importe quel écran
  const inp=document.createElement("input");inp.type="file";inp.accept=accept||"image/*";inp.multiple=!fn;inp.className="sr";
  if(capture&&!isDesk())inp.setAttribute("capture","environment");
  document.body.appendChild(inp);
  inp.onchange=()=>{const f=inp.files;if(f&&f.length){if(fn)fn(f);else fichiers(f,S.pieceCourante||"maison")}setTimeout(()=>inp.remove(),1000)};
  inp.click();
}
function aideDemander(){route("#/fil");setTimeout(()=>{const i=document.querySelector(".ask input");if(i){i.focus();i.scrollIntoView({block:"center"})}},80)}
function aideQuestion(q){closeModal();if(!(q||"").trim())return;filtreFil="tout";if(parseHash().name!=="fil")location.hash="#/fil";poserQuestion(q)}
function aideRecommander(){
  if(!S.pros.length){modal(`<h2>Pas encore d'artisan</h2><p class="muted">La maison ne connaît encore aucun professionnel. Photographiez une facture : l'artisan qui l'a signée entre dans sa mémoire, et vous pourrez envoyer sa fiche.</p><button class="btn primary" onclick="closeModal();aideFichier('image/*,.pdf')">${I.camera} Photographier une facture</button><button class="btn ghost" onclick="closeModal()">Fermer</button>`);return}
  if(S.pros.length===1){recommanderArtisan(S.pros[0].id);return}
  modal(`<h2>Quel artisan ?</h2><div class="card" style="gap:0;padding:4px 16px">${S.pros.map(p=>`<button class="line" style="width:100%;text-align:left" onclick="closeModal();recommanderArtisan('${p.id}')"><span class="stack" style="gap:0;flex:1 1 auto"><span class="b">${h(p.nom)}</span><span class="small muted">${h(p.metier||"")}</span></span>${I.fleche}</button>`).join("")}</div><button class="btn ghost" onclick="closeModal()">Annuler</button>`);
}
function aideEquipement(fn,titre){
  if(!S.equipements.length){modal(`<h2>Pas encore d'appareil</h2><p class="muted">La maison ne connaît encore aucun appareil. Photographiez son étiquette : marque, modèle et garantie entrent dans sa mémoire.</p><button class="btn primary" onclick="closeModal();aideFichier('image/*',true)">${I.camera} Photographier une étiquette</button><button class="btn ghost" onclick="closeModal()">Fermer</button>`);return}
  if(S.equipements.length===1){fn(S.equipements[0].id);return}
  aideEquipement.fn=fn;
  modal(`<h2>${h(titre||"Quel appareil ?")}</h2><div class="card" style="gap:0;padding:4px 16px">${S.equipements.map(e=>`<button class="line" style="width:100%;text-align:left" onclick="closeModal();aideEquipement.fn('${e.id}')"><span class="stack" style="gap:0;flex:1 1 auto"><span class="b">${h(e.nom)}</span><span class="small muted">${h(e.marque||"")} · ${h(nomPiece(e.piece))}</span></span>${I.fleche}</button>`).join("")}</div><button class="btn ghost" onclick="closeModal()">Annuler</button>`);
}
function declarerSinistre(){
  const ligne=(t,s,oc)=>`<button class="line" style="width:100%;text-align:left" onclick="closeModal();${oc}"><span class="stack" style="gap:0;flex:1 1 auto"><span class="b">${h(t)}</span><span class="small muted">${h(s)}</span></span>${I.fleche}</button>`;
  modal(`<h2>Déclarer un sinistre</h2><p class="muted">Sur quoi ? VIDOM prépare la déclaration avec ce que la maison sait.</p><div class="card" style="gap:0;padding:4px 16px">${ligne("La maison elle-même","Dégât des eaux, toiture, tempête, effraction…","sinistre(null)")}${S.equipements.map(e=>ligne(e.nom,(e.marque||"")+" · "+nomPiece(e.piece),`sinistre('${e.id}')`)).join("")}</div><button class="btn ghost" onclick="closeModal()">Annuler</button>`);
}
function aideChangerDeMains(motif){
  if(S.transmission){route("#/carte/transmission");return}
  const vente=motif==="vente";
  modal(`<h2>${vente?"Vous vendez la maison ?":"Vous quittez la maison ?"}</h2><p class="muted">${vente?"La rubrique Transmission apparaît : le dossier de vente pour le notaire et l'acquéreur, le livre du logement, et le tri du dernier jour. Rien ne part sans votre geste.":"La rubrique Transmission apparaît : ce qui reste à la maison, ce qui part avec vous, ce qui s'efface. Rien ne part sans votre geste."}</p><div class="row"><button class="btn primary grow" onclick="closeModal();changerDeMains('${motif}')">${vente?"Je vends":"Je pars"}</button><button class="btn grow" onclick="closeModal()">Pas maintenant</button></div>`);
}
function aideTransmission(quoi){
  if(quoi==="livre"){ouvrirDossier("livre");return}
  if(S.transmission){route("#/carte/transmission");setTimeout(()=>ouvrirDossier("vente"),150);return}
  modal(`<h2>Le dossier de vente</h2><p class="muted">Il se prépare le jour où la maison change de mains, avec tout ce qu'elle sait : acte, diagnostics, travaux, équipements, garanties. Pour le notaire, l'agent, l'acquéreur.</p><div class="row"><button class="btn primary grow" onclick="closeModal();aideChangerDeMains('vente')">Je vends</button><button class="btn grow" onclick="closeModal()">Pas maintenant</button></div>`);
}
function aideAutreAppareil(){const url=location.href.split("#")[0];modal(`<h2>Sur un autre appareil</h2><div class="card" style="flex-direction:row;align-items:center;gap:14px"><div class="qr" style="width:96px;height:96px">${qrSvg(url)}</div><span class="small muted">Ouvrez ce code avec l'appareil photo de votre téléphone, ou tapez l'adresse sur votre ordinateur, puis connectez-vous avec le même compte : vous retrouvez la même maison.</span></div><div class="card"><span class="mono small">${h(url)}</span></div><button class="btn" onclick="closeModal()">Fermer</button>`)}
</script>
<script>
/* ================= navigation et rendu ================= */
const TITRES={fil:"Le fil",maison:"Ma maison",reglages:"Réglages",carte:"Ma maison",piece:"Ma maison",equipement:"Équipements",document:"Documents",pro:"Les artisans de la maison",tri:"Le tri","adresse-vidom":"Adresse VIDOM",reconnu:"Photographier"};
const RETOUR={carte:"#/maison",piece:"#/maison",equipement:"#/carte/equipements",document:"#/carte/documents",pro:"#/carte/artisans",reglages:"#/maison","adresse-vidom":"#/maison",tri:"#/fil",reconnu:"#/fil"};
function parseHash(){const hh=location.hash.replace(/^#\/?/,"");const [name,...rest]=hh.split("/");return {name:name||"fil",arg:rest.join("/")}}
function vue(name,arg){
  if(name==="carte")return V.carte(arg);
  if(name==="piece")return V.piece(arg);
  if(name==="equipement")return V.equipement(arg);
  if(name==="document")return V.document(arg);
  if(name==="pro")return V.pro(arg);
  if(V[name])return V[name]();
  return V.fil();
}
function nav(name){
  const on=k=>k===name?"on":"";
  const cap=isDesk()?"":'capture="environment"';
  return `<nav class="nav">
    <a href="#/fil" class="${on("fil")}">${I.bulle}<span>Le fil</span></a>
    <label class="cam ${on("reconnu")}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;border-radius:var(--r);color:var(--blanc);background:var(--sauge);font-size:.8em;font-weight:500;cursor:pointer;position:relative;overflow:hidden">${I.camera}<span>Photographier</span><input class="sr" type="file" accept="image/*" ${cap} multiple onchange="fichiers(this.files,S.pieceCourante||'maison')"></label>
    <a href="#/maison" class="${["maison","carte","piece","equipement","document","pro","adresse-vidom","reglages"].includes(name)?"on":""}">${I.maison}<span>Ma maison</span></a>
  </nav>`;
}
function renderReinitialiser(){
  document.body.classList.remove("app");
  document.getElementById("app").innerHTML=`<div class="col"><div class="top"><span class="t">VIDOM</span></div><div class="view center fadein" style="gap:18px">
    <div class="stack"><h1 class="h">Nouveau mot de passe.</h1><p class="muted">Choisissez un nouveau mot de passe pour votre compte VIDOM.</p></div>
    <form class="stack" style="gap:14px" onsubmit="event.preventDefault();reinitialiserOk()">
      <label class="f"><span>Nouveau mot de passe</span><input class="input" id="npw" type="password" autocomplete="new-password" minlength="8" required></label>
      <button class="btn primary big" type="submit">Enregistrer</button>
    </form>
  </div></div>`;
}
async function reinitialiserOk(){
  const pw=document.getElementById("npw").value;
  if(!supa){toast("Indisponible pour l'instant.");return}
  try{
    const {error}=await supa.auth.updateUser({password:pw});
    if(error){toast("Cela n'a pas fonctionné : "+error.message);return}
    toast("Mot de passe enregistré.");
    await hydrate();
    location.hash=S.cree?"#/fil":"#/";
    render();
  }catch(e){toast("Cela n'a pas fonctionné.")}
}
function render(){
  document.documentElement.dataset.texte=S.reglages.texte||"normal";
  const app=document.getElementById("app");
  const _hh=parseHash();
  if(_hh.name==="e"){renderEnvoiPublic(_hh.arg);return}
  if(_hh.name==="g"){renderSejourPublic(_hh.arg);return}
  if(_hh.name==="reinitialiser"||location.hash.indexOf("type=recovery")>-1){renderReinitialiser();return}
  if(!S.cree){
    document.body.classList.remove("app");
    const e=S.etape||"bienvenue";
    const pre=e==="bienvenue"||e==="compte"?"VIDOM":(e==="adresse"?(S.ajout?"Un logement de plus":"Commençons"):h(S.logement.nom||"VIDOM"));
    const right=e==="maison-adresse"||e==="commencons"?`<span class="chip">Premier jour</span>`:"";
    const back=e==="compte"?`<button class="back" onclick="S.etape='bienvenue';save();render()">${I.retour}</button>`:e==="adresse"?`<button class="back" onclick="${S.ajout?"annulerAjout()":"S.etape='compte';save();render()"}">${I.retour}</button>`:e==="maison-adresse"?`<button class="back" onclick="S.etape='adresse';save();render()">${I.retour}</button>`:e==="commencons"?`<button class="back" onclick="S.etape='maison-adresse';save();render()">${I.retour}</button>`:"";
    app.innerHTML=`<div class="col"><div class="top"><span class="row">${back}<span class="t">${pre}</span></span>${right}</div>${(V[e]||V.bienvenue)()}</div>`;
    return;
  }
  document.body.classList.add("app");
  questionDuJour();
  const {name,arg}=parseHash();
  const html=vue(name,arg);
  let titre=TITRES[name]||"VIDOM";
  let retour=RETOUR[name];
  if(name==="pro"){const pp=S.pros.find(x=>x.id===arg);if(pp&&categorieDe(pp)!=="artisan"){titre="Notaire, syndic, assurance, fournisseurs";retour="#/carte/contacts"}} // D-179 : un fournisseur d'énergie n'est pas un artisan
  if(isDesk()){
    const rightName=name==="maison"?"fil":name;
    const rightHtml=name==="maison"?V.fil():html;
    const rt=name==="maison"?"Le fil":titre;
    const rr=name==="maison"?"":retour;
    app.innerHTML=`<div class="desk">
      <div class="pane left"><div class="topbar">${boutonLogement(S.logement.nom,"")}<span class="small muted">${h(S.logement.ville)}</span></div>${V.maison()}</div>
      <div class="pane right"><div class="topbar"><span class="row">${rr&&rr!=="#/fil"&&rightName!=="fil"?`<a class="back" href="${rr}">${I.retour}</a>`:(rightName!=="fil"&&rightName!=="maison"?`<a class="back" href="#/fil">${I.retour}</a>`:"")}<span class="t">${rt}</span></span><span class="actions"><label class="btn primary file">${I.plus} Ajouter<input type="file" accept="image/*,.pdf" multiple onchange="fichiers(this.files,S.pieceCourante||'maison')"></label><button class="btn" onclick="ajouterDesk()" aria-label="Photographier ou continuer sur le téléphone">${I.camera}</button><button class="btn" onclick="ouvrirAide()" aria-label="Aide">${I.aide}</button><a class="btn" href="#/reglages" aria-label="Réglages">${I.reglages}</a></span></div>${rightHtml}</div>
    </div>`;
  }else{
    app.innerHTML=`<div class="col"><div class="top"><span class="row">${retour?`<a class="back" href="${retour}">${I.retour}</a>`:""}${name==="fil"?boutonLogement(S.logement.nom,""):`<span class="t">${titre}</span>`}</span><span class="row" style="gap:8px">${name==="fil"?`<span class="chip">${h(phraseCourte())}</span>`:""}${boutonAide()}</span></div>${html}${nav(name)}</div>`;
  }
  const dv=document.querySelector(".pane.right")||window;
  if(render.lastRoute!==location.hash){window.scrollTo(0,0);render.lastRoute=location.hash}
}
function ajouterDesk(){modal(`<h2>Photographier</h2><div class="stack"><label class="btn primary big file">${I.camera} Avec la caméra de l'ordinateur<input type="file" accept="image/*" capture="environment" multiple onchange="fichiers(this.files,S.pieceCourante||'maison')"></label><div class="card" style="flex-direction:row;align-items:center;gap:14px"><div class="qr" style="width:96px;height:96px">${qrSvg(location.href.split("#")[0])}</div><span class="small muted">Pour continuer sur votre téléphone, ouvrez ce code avec l'appareil photo, puis connectez-vous avec le même compte : vous retrouverez la même maison.</span></div></div><button class="btn" onclick="closeModal()">Fermer</button>`)}
function route(hsh){if(hsh&&location.hash!==hsh){location.hash=hsh}else render()}
window.addEventListener("hashchange",render);
window.addEventListener("resize",()=>{clearTimeout(render.rt);render.rt=setTimeout(render,120)});

/* glisser-déposer, n'importe où sur la page */
(function(){
  let n=0;const d=document.getElementById("drop");
  document.addEventListener("dragenter",e=>{if(!S.cree&&S.etape!=="commencons")return;n++;d.hidden=false});
  document.addEventListener("dragleave",()=>{n=Math.max(0,n-1);if(!n)d.hidden=true});
  document.addEventListener("dragover",e=>e.preventDefault());
  document.addEventListener("drop",e=>{e.preventDefault();n=0;d.hidden=true;if(e.dataTransfer&&e.dataTransfer.files.length)fichiers(e.dataTransfer.files,S.pieceCourante||"maison")});
})();
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
/* rendre le premier écran : si un compte réel est déjà connecté, on va d'abord chercher sa vraie mémoire */
(async function(){
  if(supa){
    let recuperation=location.hash.indexOf("type=recovery")>-1; // repli si l'évènement ci-dessous n'arrivait pas à temps
    try{supa.auth.onAuthStateChange((event)=>{ // enregistré avant tout "await" : sinon la fenêtre de récupération de mot de passe peut être manquée
      if(event==="PASSWORD_RECOVERY"){recuperation=true;location.hash="#/reinitialiser";render()}
    })}catch(e){}
    try{
      const {data}=await supa.auth.getSession();
      if(!recuperation&&data&&data.session&&parseHash().name!=="reinitialiser"){
        document.getElementById("app").innerHTML=`<div class="view center" style="min-height:100vh"><p class="muted">Un instant, VIDOM retrouve votre maison…</p></div>`;
        await hydrate();
      }
    }catch(e){}
  }
  if(S.cree&&!location.hash)location.hash="#/fil";
  render();
})();
</script>
</body>
</html>
