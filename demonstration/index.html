<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VIDOM — Maison des Tilleuls</title>
<meta name="theme-color" content="#4A6255">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VIDOM">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{
  --sauge:#5F7A6A;--sauge-f:#4A6255;--sauge-c:#E4EBE6;--sauge-cc:#F0F4F1;
  --ivoire:#F6F3ED;--ivoire-f:#EEE9DF;--blanc:#FFFDF9;
  --bois:#D8C8B2;--bois-c:#EFE6D8;--sable:#B5B0A5;--ardoise:#50575E;--encre:#2F3439;
  --terra:#C9775B;--terra-c:#F4E3DB;--terra-f:#A85F45;
  --r:6px;--r2:8px;--nav:220px;
  --fs:14px;
}
html[data-texte="grand"]{--fs:16px}
html[data-texte="tres-grand"]{--fs:18px}
*{box-sizing:border-box;scroll-margin-top:70px}
html,body{height:100%}
body{margin:0;background:var(--ivoire);color:var(--encre);font-family:"Source Sans 3",system-ui,-apple-system,sans-serif;font-size:var(--fs);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sauge-f)}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.2;text-wrap:balance}
h1{font-size:1.5em}h2{font-size:1.25em}h3{font-size:1.08em}
p{margin:0 0 .6em}
.muted{color:var(--ardoise)}.faint{color:var(--sable)}
.small{font-size:.9em}.tiny{font-size:.8em}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.sr{position:absolute;left:-9999px}
[hidden]{display:none!important}

/* ---------- shell ---------- */
#root.app{display:grid;grid-template-columns:var(--nav) 1fr;min-height:100vh}
.nav{background:var(--sauge-f);color:#fff;padding:14px 10px 80px;position:sticky;top:0;height:100vh;overflow:auto}
.nav .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.15em;letter-spacing:.02em;padding:4px 8px 12px}
.nav .logo svg{width:26px;height:26px}
.home{background:rgba(255,255,255,.08);border-radius:var(--r2);padding:10px 12px;margin-bottom:10px;cursor:pointer;border:0;color:#fff;text-align:left;width:100%}
.home b{display:block;font-size:1em}
.home span{font-size:.85em;color:rgba(255,255,255,.7);display:block}
.home .chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{font-size:.78em;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:1px 7px;color:#fff}
.grp{font-size:.72em;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);margin:12px 8px 4px}
.nav a.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:5px;color:rgba(255,255,255,.92);text-decoration:none;font-size:.95em}
.nav a.item svg{width:16px;height:16px;flex:none;opacity:.85}
.nav a.item .lab{display:flex;align-items:center;gap:8px;min-width:0}
.nav a.item .lab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a.item.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.nav a.item.lock{color:rgba(255,255,255,.5)}
.badge{font-size:.78em;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:1px 7px;min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.badge.alert{background:var(--terra)}
.lockico{font-size:.72em;border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:0 5px;white-space:nowrap}

.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.bar{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--ivoire);border-bottom:1px solid var(--bois);position:sticky;top:0;z-index:5}
.bar .search{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--bois);background:var(--blanc);border-radius:var(--r);padding:6px 10px;color:var(--sable);cursor:text;min-width:0}
.bar .search span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .search kbd{font-size:.75em;border:1px solid var(--bois);border-radius:4px;padding:0 5px;color:var(--ardoise);white-space:nowrap}
.bar .search svg{width:16px;height:16px;flex:none}
.btn{border:1px solid var(--bois);background:var(--blanc);border-radius:var(--r);padding:6px 11px;font-size:.95em;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--encre);text-decoration:none;line-height:1.3}
.btn svg{width:15px;height:15px}
.btn:hover{border-color:var(--sable)}
.btn.primary{background:var(--sauge);color:#fff;border-color:var(--sauge)}
.btn.primary:hover{background:var(--sauge-f)}
.btn.terra{background:var(--terra);color:#fff;border-color:var(--terra)}
.btn.warn{border-color:var(--terra);color:var(--terra-f)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 8px;font-size:.85em}
.btn[disabled]{opacity:.5;cursor:default}
.page{padding:18px 20px 90px;max-width:1180px;width:100%}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.page-h p{margin:2px 0 0;color:var(--ardoise)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--blanc);border:1px solid var(--bois);border-radius:var(--r2);padding:14px 16px}
.card+.card{margin-top:14px}
.card h3{margin-bottom:2px}
.card .sub{color:var(--ardoise);margin:0 0 10px;font-size:.95em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.kv dt{color:var(--sable)}.kv dd{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:.95em}
th{text-align:left;font-weight:600;color:var(--ardoise);border-bottom:1px solid var(--bois);padding:5px 6px;font-size:.8em;text-transform:uppercase;letter-spacing:.06em}
td{padding:7px 6px;border-bottom:1px solid var(--bois-c);vertical-align:top}
tr.link{cursor:pointer}tr.link:hover td{background:var(--sauge-cc)}
.tbl{overflow-x:auto}
.state{display:inline-block;font-size:.78em;padding:1px 8px;border-radius:999px;background:var(--bois-c);color:var(--ardoise);white-space:nowrap}
.state.propose{background:var(--terra-c);color:var(--terra-f)}
.state.valide,.state.actif{background:var(--sauge-c);color:var(--sauge-f)}
.state.refuse{background:#eee;color:#888;text-decoration:line-through}
.state.attention{background:var(--terra-c);color:var(--terra-f)}
.tl{list-style:none;margin:8px 0 0;padding:0;border-left:2px solid var(--sauge-c)}
.tl li{padding:0 0 12px 14px;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--sauge)}
.tl li.wow::before{background:var(--terra)}
.tl li .d{color:var(--sable);font-size:.85em;display:block}
.tl .year{font-weight:700;color:var(--sauge-f);padding:6px 0 6px 14px;font-size:1.05em}
.empty{border:1px dashed var(--bois);border-radius:var(--r2);padding:22px;text-align:center;color:var(--ardoise);background:var(--blanc)}
.empty b{display:block;color:var(--encre);margin-bottom:4px}
.doc{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:10px;border:1px solid var(--bois-c);border-radius:var(--r);margin-top:8px;background:var(--blanc)}
.doc .thumb{width:44px;height:56px;background:linear-gradient(var(--ivoire-f),var(--bois-c));border-radius:3px;border:1px solid var(--bois);display:flex;align-items:center;justify-content:center;color:var(--sable);font-size:.65em;text-transform:uppercase;overflow:hidden}
.doc .thumb img{width:100%;height:100%;object-fit:cover}
.doc b{display:block}.doc .l{display:block;color:var(--ardoise);font-size:.9em}
.tag{display:inline-block;font-size:.78em;border:1px solid var(--bois);border-radius:4px;padding:0 6px;color:var(--ardoise);margin-right:4px}
.notice{background:var(--sauge-cc);border-left:3px solid var(--sauge);padding:8px 12px;border-radius:0 var(--r) var(--r) 0;font-size:.95em;margin:10px 0}
.notice.terra{background:var(--terra-c);border-color:var(--terra)}
.lockbox{background:var(--blanc);border:1px dashed var(--sable);border-radius:var(--r2);padding:22px;color:var(--ardoise);display:flex;gap:14px;align-items:flex-start}
.lockbox svg{width:28px;height:28px;flex:none;color:var(--sable)}
.input{width:100%;border:1px solid var(--bois);background:var(--blanc);border-radius:var(--r);padding:8px 10px}
textarea.input{min-height:90px;resize:vertical}
label.f{display:block;margin-bottom:8px}
label.f span{display:block;font-size:.85em;color:var(--ardoise);margin-bottom:3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.split{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--bois);border-radius:999px;padding:3px 10px;background:var(--blanc);font-size:.9em;cursor:pointer}
.pill.on{background:var(--sauge);color:#fff;border-color:var(--sauge)}
.stat{background:var(--blanc);border:1px solid var(--bois);border-radius:var(--r2);padding:12px 14px}
.stat b{font-size:1.5em;display:block;font-variant-numeric:tabular-nums;font-weight:600}
.stat span{color:var(--ardoise);font-size:.9em}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--bois-c)}
.check input{margin-top:4px}
.progress{height:6px;background:var(--bois-c);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sauge)}


/* visuels */
.ico{display:inline-flex;width:22px;height:22px;color:var(--sauge-f);flex:none;vertical-align:middle}
.ico svg{width:100%;height:100%}
.ico.lg{width:34px;height:34px}
.ico.xl{width:48px;height:48px;padding:10px;box-sizing:content-box;background:var(--sauge-cc);border-radius:12px}
.ico.tile{width:26px;height:26px;padding:7px;box-sizing:content-box;background:var(--sauge-cc);border-radius:9px}
.mono{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:.72em;letter-spacing:.02em;flex:none}
.mono.big{width:46px;height:46px;font-size:1em}
.ill{width:100%;max-width:320px;height:auto;display:block;margin:0 auto 14px}
.ill.small{max-width:120px;margin:0 auto 6px}
.room{position:relative;padding-top:14px}
.room .ico{margin-bottom:8px}
.room.done .ico{background:var(--sauge);color:#fff}
.doc .thumb{color:var(--sauge-f);font-size:1em;background:var(--sauge-cc);border-color:var(--bois-c)}
.doc .thumb .ico{width:22px;height:22px}
.hub .t .ico{width:16px;height:16px;margin-right:5px}
.eqrow{display:flex;align-items:center;gap:10px}
.hero{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:center;background:var(--blanc);border:1px solid var(--bois);border-radius:var(--r2);padding:16px 18px;margin-bottom:16px}
.hero .ill{margin:0}
.stat{display:flex;align-items:center;gap:12px}
.stat>div b{font-size:1.4em}
.empty .ill{margin-bottom:8px}
.tabs-ico{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:860px){.hero{grid-template-columns:1fr}.hero .ill{max-width:240px}}

/* plan simplifié */
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.room{border:1px solid var(--bois);background:var(--blanc);border-radius:var(--r2);padding:12px;cursor:pointer;text-align:left;min-height:88px;display:flex;flex-direction:column;justify-content:space-between}
.room:hover{border-color:var(--sauge)}
.room b{display:block}
.room .c{color:var(--ardoise);font-size:.9em}
.room.done{border-color:var(--sauge);background:var(--sauge-cc)}

/* hub */
.hubgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.tiers2{grid-template-columns:1fr 1fr}
.hub{position:relative;height:420px;max-width:520px;margin:0 auto}
.hub .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:118px;height:118px;border-radius:50%;background:var(--sauge);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;font-size:.9em;padding:10px}
.hub .ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:330px;height:330px;border:1px dashed var(--bois);border-radius:50%}
.hub .t{position:absolute;transform:translate(-50%,-50%);border:1px solid var(--bois);background:var(--blanc);border-radius:999px;padding:5px 11px;font-size:.9em;cursor:pointer;white-space:nowrap}
.hub .t.open{border-color:var(--sauge);background:var(--sauge-c)}
.hub .t:hover{border-color:var(--sauge)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-width:720px}
.msg{max-width:85%;padding:9px 12px;border-radius:10px;background:var(--blanc);border:1px solid var(--bois-c)}
.msg.me{align-self:flex-end;background:var(--sauge-c);border-color:var(--sauge-c)}
.msg .att{display:flex;gap:8px;align-items:center;margin-top:6px;padding:6px 8px;border:1px solid var(--bois);border-radius:var(--r);background:var(--ivoire);font-size:.9em}
.chat-in{display:flex;gap:8px;margin-top:14px;max-width:720px}
.chat-in input{flex:1}

/* onboarding */
.ob{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 18px 60px;background:var(--ivoire)}
.ob .box{width:100%;max-width:640px}
.ob .logo{display:flex;align-items:center;gap:8px;color:var(--sauge-f);font-weight:700;font-size:1.3em;margin-bottom:26px}
.ob .logo svg{width:30px;height:30px}
.ob h1{font-size:1.6em;margin-bottom:6px}
.ob .lead{color:var(--ardoise);margin-bottom:18px}
.ob .big{font-size:1.15em;padding:12px 14px}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--bois-c)}
.steps i.on{background:var(--sauge)}
.map{position:relative;height:300px;border-radius:var(--r2);overflow:hidden;border:1px solid var(--bois);background:#8fa78f}
.map svg{width:100%;height:100%;display:block}
.map .parc{fill:rgba(255,255,255,.12);stroke:#fff;stroke-width:2;cursor:pointer}
.map .parc.sel{fill:rgba(201,119,91,.45);stroke:var(--terra)}
.map .lbl{fill:#fff;font-size:12px;font-weight:600;pointer-events:none}
.sug{border:1px solid var(--bois);background:var(--blanc);border-radius:var(--r);padding:10px 12px;cursor:pointer;margin-top:6px}
.sug:hover{background:var(--sauge-cc)}
.found{border:1px solid var(--bois);background:var(--blanc);border-radius:var(--r2);padding:12px 14px;margin-top:10px}
.found .src{font-size:.78em;color:var(--sable)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--bois-c);border-radius:var(--r);margin-top:6px;cursor:pointer}
.opt.on{border-color:var(--sauge);background:var(--sauge-cc)}
.qr{width:120px;height:120px;image-rendering:pixelated;border:6px solid #fff;border-radius:4px;background:#fff}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(47,52,57,.45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px}
.modal{background:var(--blanc);border-radius:10px;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:18px 20px;border:1px solid var(--bois)}
.modal h2{margin-bottom:4px}
.modal .x{float:right;border:0;background:transparent;font-size:1.3em;line-height:1;color:var(--ardoise)}
.toasts{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--encre);color:#fff;padding:8px 14px;border-radius:var(--r);font-size:.95em;box-shadow:0 6px 18px -8px rgba(0,0,0,.4)}
.cmd{position:fixed;inset:0;z-index:50;background:rgba(47,52,57,.35);display:flex;justify-content:center;align-items:flex-start;padding:8vh 14px}
.cmd .box{width:100%;max-width:620px;background:var(--blanc);border-radius:10px;border:1px solid var(--bois);overflow:hidden}
.cmd input{width:100%;border:0;border-bottom:1px solid var(--bois);padding:14px 16px;font-size:1.05em;background:transparent}
.cmd .res{max-height:50vh;overflow:auto}
.cmd .r{padding:9px 16px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;border-bottom:1px solid var(--bois-c)}
.cmd .r:hover,.cmd .r.on{background:var(--sauge-cc)}
.cmd .r small{color:var(--sable)}
.tip{position:fixed;right:16px;bottom:80px;z-index:30;background:var(--sauge-f);color:#fff;padding:12px 14px;border-radius:var(--r2);max-width:300px;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)}
.tip b{display:block;margin-bottom:4px}
.tip .btn{margin-top:8px;background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.avis{position:fixed;right:14px;bottom:16px;z-index:25}
.tabbar{display:none}
.simul{border:1px dashed var(--sable);border-radius:var(--r2);padding:12px 14px;background:var(--blanc)}
.book{background:#fff;border:1px solid var(--bois);box-shadow:0 10px 30px -18px rgba(0,0,0,.4);padding:32px 36px;max-width:640px;margin:0 auto;min-height:420px;font-size:.98em}
.book h2{font-size:1.4em;margin-bottom:2px}
.book .pn{color:var(--sable);text-align:right;font-size:.8em;margin-top:24px}
.sortcol{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sortcol .col{border:1px solid var(--bois);border-radius:var(--r2);padding:10px;background:var(--blanc);min-height:120px}
.sortcol .col h4{font-size:.9em;margin-bottom:6px;color:var(--sauge-f)}
.sortcol .it{display:flex;justify-content:space-between;gap:6px;padding:5px 6px;border:1px solid var(--bois-c);border-radius:4px;margin-bottom:4px;font-size:.9em;background:var(--ivoire)}
.sortcol .it button{border:0;background:transparent;color:var(--sable);padding:0 2px}
.photo{width:100%;max-height:260px;object-fit:cover;border-radius:var(--r);border:1px solid var(--bois)}
.print-only{display:none}
@media (max-width:860px){
  #root.app{grid-template-columns:1fr}
  .nav{display:none}
  .grid2,.grid3,.sortcol{grid-template-columns:1fr}
  .page{padding:14px 14px 96px}
  .bar{padding:8px 10px}
  .bar .btn .t{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--sauge-f);color:#fff;z-index:20;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,.85);text-decoration:none;font-size:.7em;padding:4px 0;position:relative}
  .tabbar a svg{width:20px;height:20px}
  .tabbar a.on{color:#fff;font-weight:600}
  .tabbar a.plus span.c{width:44px;height:44px;border-radius:50%;background:var(--terra);display:flex;align-items:center;justify-content:center;margin-top:-16px;border:3px solid var(--sauge-f)}
  .tabbar a.plus span.c svg{width:22px;height:22px}
  .tabbar .badge{position:absolute;top:0;right:14%}
  .hubgrid,.tiers2{grid-template-columns:1fr}
  .hub{height:340px}.hub .ring{width:250px;height:250px}.hub .t{font-size:.8em;padding:4px 8px}.hub .center{width:96px;height:96px;font-size:.8em}
  .avis{bottom:78px}
  .tip{bottom:120px}
  .toasts{bottom:90px}
}
@media print{
  body *{visibility:hidden}
  .print-only,.print-only *{visibility:visible;display:block}
  .print-only{position:absolute;left:0;top:0;width:100%;padding:40px;text-align:center}
}
@media (prefers-reduced-motion:no-preference){
  .view{animation:fade .18s ease}
  @keyframes fade{from{opacity:.4}to{opacity:1}}
}
</style>
</head><body><div id="root"></div><div class="toasts" id="toasts"></div>
<script>
/* ================= DONNÉES FICTIVES — Maison des Tilleuls ================= */
const DATA = (() => {
  const logement = {

function mono(nom, big) {
  const s = String(nom || "?").trim(); let x = 0; for (let i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) >>> 0;
  const parts = s.split(/[\s'’-]+/).filter(Boolean); const ini = (parts.length > 1 ? parts[0][0] + parts[1][0] : s.slice(0, 2)).toUpperCase();
  return `<span class="mono ${big ? "big" : ""}" style="background:${TEINTES[x % TEINTES.length]}">${h(ini)}</span>`;
}

/* ---------- QR (motif dessiné, pour la démonstration) ---------- */
function drawQR(canvas, seed) {
  const n = 25, s = 4; canvas.width = n * s; canvas.height = n * s; const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, n * s, n * s); ctx.fillStyle = "#2F3439";
  let x = 0; for (let i = 0; i < seed.length; i++) x = (x * 31 + seed.charCodeAt(i)) >>> 0;
  const rnd = () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return (x >>> 0) / 4294967296; };
  const eye = (cx, cy) => { for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) { const b = i === 0 || j === 0 || i === 6 || j === 6 || (i >= 2 && i <= 4 && j >= 2 && j <= 4); if (b) ctx.fillRect((cx + i) * s, (cy + j) * s, s, s); } };
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const inEye = (i < 8 && j < 8) || (i > 16 && j < 8) || (i < 8 && j > 16); if (!inEye && rnd() < .45) ctx.fillRect(i * s, j * s, s, s); }
  eye(0, 0); eye(18, 0); eye(0, 18);
}

/* ---------- photo : compression locale ---------- */
function lirePhoto(file, cb) {
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => { const c = document.createElement("canvas"); const k = Math.min(1, 900 / Math.max(img.width, img.height)); c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); cb(c.toDataURL("image/jpeg", .7)); }; img.src = r.result; };
  r.readAsDataURL(file);
}

        <polygon points="40,40 260,30 270,225 45,225" class="parc ${sel.includes("AB 213") ? "sel" : ""}" onclick="Onb.parc('AB 213')"/><text x="70" y="60" class="lbl">AB 213</text>
        <polygon points="270,30 430,28 435,225 275,225" class="parc ${sel.includes("AB 214") ? "sel" : ""}" onclick="Onb.parc('AB 214')"/><text x="300" y="55" class="lbl">AB 214</text>

  photo(inp) { const f = inp.files && inp.files[0]; if (!f) return; if (f.type === "application/pdf") { S.onb.photo = "pdf"; save(); route(); return; } lirePhoto(f, d => { S.onb.photo = d; save(); route(); }); },

  e4() {

      { id: "m1", t: "Le diagnostic de performance énergétique complet", qui: "Diagnostic Loire (diagnostiqueur)", mail: "contact@diagnostic-loire.fr", delai: 14 },

    const L = S.logement;

  },
  envoye(id, qui, t, delai) {
    S.onb.demandes = S.onb.demandes || []; S.onb.demandes.push(id);

};
/* ================= ACTIONS COMMUNES ================= */
const A = {

    modal(`<h2>Partager l'adresse de la maison</h2><p class="muted">Donnez-la à un artisan, un notaire, un assureur. Ce qu'ils enverront arrivera dans la boîte d'arrivée, et rien n'entrera sans votre accord.</p>
      <div class="row" style="align-items:flex-start;margin:8px 0 12px"><canvas id="qr2" class="qr"></canvas><div><b class="num" style="word-break:break-all">${h(L.adresseDepot)}</b><div class="small muted" style="margin-top:6px">Le code QR mène à la même adresse.</div></div></div>
      <label class="f"><span>Demander la mise en copie — message tout fait</span><textarea class="input">${h(txt)}</textarea></label>
      <div class="row"><button class="btn primary" onclick="A.copier();closeModal()">Copier l'adresse</button><button class="btn" onclick="toast('Message ouvert dans votre messagerie');closeModal()">Envoyer la demande</button><a class="btn" href="#/etiquette" onclick="closeModal()">Imprimer la carte de la maison</a></div>`);
    setTimeout(() => { const c = document.getElementById("qr2"); if (c) drawQR(c, L.adresseDepot); }, 20);
    S.journal.push({ d: today(), t: "Adresse de dépôt partagée" }); save();
  },
  regenerer() {
    modal(`<h2>Changer l'adresse de dépôt ?</h2><p class="muted">L'ancienne adresse cessera de fonctionner. Les professionnels qui l'ont devront recevoir la nouvelle. Votre réglage de transfert, lui, ne change pas : il utilise une adresse séparée qui ne circule jamais.</p><div class="row"><button class="btn terra" onclick="A.regenOk()">Changer d'adresse</button><button class="btn" onclick="closeModal()">Garder l'actuelle</button></div>`);
  },
  regenOk() { const al = "abcdefghjkmnpqrstuvwxyz23456789"; let s = ""; for (let i = 0; i < 3; i++) s += al[Math.floor(Math.random() * al.length)]; S.logement.adresseDepot = "maison-des-tilleuls-" + s + "@depot.vidom.fr"; S.journal.push({ d: today(), t: "Adresse de dépôt régénérée ; l'ancienne ne sera jamais réattribuée" }); closeModal(); toast("Nouvelle adresse : " + S.logement.adresseDepot); save(); route(); },
  recevoir() {
    modal(`<h2>Recevoir un document</h2><p class="muted">Trois façons, un seul endroit d'arrivée : la boîte d'arrivée de votre logement.</p>
      <div class="opt" onclick="closeModal();A.partager()"><div><b>Par courriel</b><div class="small muted">Un professionnel écrit à ${h(S.logement.adresseDepot)}</div></div><span class="tag">Partager</span></div>
      <div class="opt" onclick="closeModal();location.hash='#/etiquette'"><div><b>Par le code QR</b><div class="small muted">La carte de la maison, à coller sur le tableau électrique</div></div><span class="tag">Imprimer</span></div>
      <div class="opt" onclick="closeModal();A.ajouter()"><div><b>Vous-même</b><div class="small muted">Prendre une photo ou importer un fichier</div></div><span class="tag">Ajouter</span></div>`);
  },
  ajouter() {
    modal(`<h2>Ajouter à la mémoire de la maison</h2>
      <label class="opt" style="cursor:pointer"><div><b>Prendre une photo</b><div class="small muted">Un appareil, une étiquette, une facture : VIDOM reconnaît et range.</div></div><span class="tag">${I.camera}</span><input type="file" accept="image/*" capture="environment" class="sr" onchange="A.photoPrise(this,null)"></label>
      <label class="opt" style="cursor:pointer"><div><b>Importer un document</b><div class="small muted">Un fichier déjà sur cet appareil.</div></div><span class="tag">Fichier</span><input type="file" accept="image/*,application/pdf" class="sr" onchange="A.photoPrise(this,null)"></label>
      <div class="opt" onclick="closeModal();location.hash='#/professionnels'"><div><b>Demander à un professionnel</b><div class="small muted">Un document manquant, une intervention, un devis.</div></div><span class="tag">Professionnels</span></div>
      <div class="opt" onclick="closeModal();location.hash='#/memoire'"><div><b>Ajouter un souvenir</b><div class="small muted">Un moment de la vie de la maison — une plantation, une fin de chantier.</div></div><span class="tag">Souvenir</span></div>`);
  },
  photoPrise(inp, pieceId) {
    const f = inp.files && inp.files[0]; if (!f) return;
    closeModal(); toast("Photo prise. VIDOM regarde…");
    const go = (data) => { const r = DATA.recos[(S.simul + S.docs.length) % DATA.recos.length]; S.simul++; setTimeout(() => A.propose(r, data, pieceId), 900); };

         <dl class="kv" style="margin-top:10px"><dt>Équipement</dt><dd>${h(r.titre)}</dd><dt>Marque</dt><dd>${h(r.marque)}</dd><dt>Modèle</dt><dd>${h(r.modele)}</dd><dt>Référence</dt><dd class="num">${h(r.ref)}</dd><dt>Pièce</dt><dd>${h(piece(pc).nom)}</dd></dl>
         <div class="notice"><b>À partir de la référence, VIDOM a retrouvé :</b><br>${h(r.notice)}<br>Service après-vente : ${h(r.sav)}<div class="tiny faint">Source : site du fabricant · proposé, jamais imposé</div></div>`
      : `<p class="muted">VIDOM a reconnu un document. Vérifiez, puis conservez — ou corrigez.</p>

         <dl class="kv" style="margin-top:10px"><dt>Type</dt><dd>${TYPES[r.type]}</dd><dt>Titre</dt><dd>${h(r.titre)}</dd><dt>Fournisseur</dt><dd>${h(r.four)}</dd><dt>Date</dt><dd>${fdate(r.date)}</dd><dt>Montant</dt><dd>${eur(r.montant)}</dd><dt>Référence lue</dt><dd class="num">${h(r.ref)}</dd><dt>Pièce</dt><dd>${h(piece(pc).nom)}</dd></dl>
         <div class="notice"><b>À partir de la référence lue sur ce document, VIDOM a retrouvé :</b><br>${h(r.notice)}<br>Service après-vente : ${h(r.sav)}<div class="tiny faint">Source : site du fabricant · proposé, jamais imposé</div></div>`;
    modal(`<h2 class="eqrow">${r.kind === "equipement" ? ico(r.cat,"lg") : icoDoc(r.type).replace('class="ico ','class="ico lg ')}${r.kind === "equipement" ? "Un équipement reconnu" : "Un document reconnu"}</h2>${body}
      <div class="row" style="margin-top:12px"><button class="btn primary" onclick='A.conserve(${JSON.stringify(r).replace(/'/g, "&#39;")},"${pc}",${img ? "true" : "false"})'>Conserver</button><button class="btn" onclick="A.corrige()">Corriger</button><button class="btn ghost" onclick="closeModal()">Ne pas garder</button></div>`, { noX: false });
    S._img = img;
  },
  corrige() { modal(`<h2>Corriger</h2><p class="muted">Dans la version test, chaque champ reconnu se modifie ici avant d'être conservé. Dans cette démonstration, la correction est simulée.</p><button class="btn primary" onclick="closeModal();toast('Correction enregistrée')">Compris</button>`); },
  conserve(r, pc, hasImg) {
    const img = hasImg ? S._img : null;
    if (r.kind === "equipement") {
      const id = uid("e");
      S.equipements.push({ id, nom: r.titre, marque: r.marque, modele: r.modele, ref: r.ref, serie: "", piece: pc, cat: r.cat, install: today(), par: "", garantie: addDays(today(), 730), entretien: "", prochain: "", etat: "bon", notes: "Reconnu sur photo.", notice: true, sav: r.sav, cout: null, photo: img });
      S.docs.push({ id: uid("d"), type: "photo", titre: "Photo — " + r.titre, date: today(), four: S.logement.gardien, montant: null, cible: id, source: "photo", statut: "valide", img });
      S.docs.push({ id: uid("d"), type: "notice", titre: r.notice.replace(/ retrouvée.*$/, " (retrouvée)"), date: today(), four: r.marque, montant: null, cible: id, source: "web", statut: "valide" });
      S.events.push({ d: today(), t: r.titre + " ajouté à la mémoire (" + piece(pc).nom + ")", k: "install", eq: id });
      S.metrics.docs += 2;
    } else {
      const id = uid("d");
      S.docs.push({ id, type: r.type, titre: r.titre, date: r.date, four: r.four, montant: r.montant, cible: pc, source: "photo", statut: "valide", img });
      S.docs.push({ id: uid("d"), type: "notice", titre: r.notice.replace(/ retrouvée.*$/, " (retrouvée)"), date: today(), four: r.four, montant: null, cible: pc, source: "web", statut: "valide" });
      S.events.push({ d: today(), t: TYPES[r.type] + " ajoutée : " + r.titre, k: "info" });
      S.metrics.docs += 2;
    }
    const ps = S.pieces[pc] = S.pieces[pc] || { objets: [], photos: 0 }; ps.photos = (ps.photos || 0) + 1; if (!ps.objets.includes(r.titre)) ps.objets.push(r.titre);
    S._img = null; closeModal(); toast("Conservé. Notice et service après-vente rattachés."); save(); route();
  },
  avis(ecran) {
    const m = S.metrics;
    const corps = `Bonjour,\n\nMon avis sur l'écran « ${ecran} » :\n\n\n\nMes mesures : ${m.docs} documents déposés, ${m.jours.length} jours d'activité, ${m.demandes} demandes envoyées.`;
    modal(`<h2>Donner mon avis</h2><p class="muted small">Le message part vers contact@vidom.fr depuis votre messagerie. Vos trois mesures y sont jointes si vous le souhaitez.</p><textarea class="input" id="avistxt" style="min-height:160px">${h(corps)}</textarea><div class="row" style="margin-top:8px"><a class="btn primary" href="mailto:contact@vidom.fr?subject=${encodeURIComponent("Avis sur VIDOM — " + ecran)}&body=${encodeURIComponent(corps)}" onclick="closeModal()">Envoyer depuis ma messagerie</a><button class="btn" onclick="closeModal()">Fermer</button></div>`);
  }
};

    <div class="grid3" style="margin-bottom:16px">
      <div class="stat">${ico("facture","xl")}<div><b>${nDocs}</b><span>documents conservés</span></div></div>

    </div>
    <div class="grid2">

        ${inbox.length ? `<div class="card"><div class="split"><h3>Boîte d'arrivée</h3><a class="btn sm" href="#/boite">Tout voir</a></div><p class="sub">${inbox.length} document${inbox.length > 1 ? "s" : ""} à confirmer. Rien n'entre sans vous.</p>${inbox.slice(0, 2).map(i => `<div class="doc" onclick="location.hash='#/boite'" style="cursor:pointer"><div class="thumb">${icoDoc(i.reco.type)}</div><div><span class="state propose">Proposé</span><b>${h(i.titre)}</b><span class="l">${fdate(i.date)} · ${h(i.exp)}</span></div></div>`).join("")}</div>` : `<div class="card"><h3>Boîte d'arrivée</h3><p class="sub">Rien en attente. Ce qui arrive par l'adresse de la maison apparaîtra ici.</p></div>`}
        <div class="card"><div class="split"><h3>Ce qui vient de se passer</h3><a class="btn sm" href="#/chronologie">Chronologie</a></div><ul class="tl">${dern.map(e => `<li class="${e.wow ? "wow" : ""}">${h(e.t)}<span class="d">${fdate(e.d)}</span></li>`).join("")}</ul></div>

        <div class="card"><h3>La boîte aux lettres de la maison</h3><p class="sub num" style="word-break:break-all">${h(L.adresseDepot)}</p><div class="row"><button class="btn sm" onclick="A.partager()">Partager</button><button class="btn sm" onclick="A.copier()">Copier</button></div></div>
      </div>

};

V.manque = () => `<div class="page"><div class="page-h"><div><a class="small" href="#/accueil">← Accueil</a></div></div>${Onb.e4().replace('<button class="btn primary big" onclick="Onb.fin()">Entrer dans ma maison</button>', '<a class="btn" href="#/accueil">Retour à l\'accueil</a>')}</div>`;

V.memoire = () => {
  const L = S.logement;
  const wow = S.events.filter(e => e.wow || e.k === "achat" || e.k === "construction");
  const ans = new Date().getFullYear() - L.annee;
  return `<div class="page">
    <div class="page-h"><div><h1>La maison raconte</h1><p>${ans} ans d'histoire, réunis au même endroit.</p></div><button class="btn" onclick="A.souvenir()">${I.arbre} Ajouter un souvenir</button></div>
    <div class="grid2">
      <div class="card"><h3>Le livre du logement</h3><p class="sub">Gratuit, toujours. Il s'écrit tout seul à partir de ce que vous conservez.</p>
        <p>La Maison des Tilleuls a été construite en ${L.annee}, sur deux parcelles au bout de la rue. Elle a connu au moins deux familles. Marie et Julien Lefort l'ont achetée le ${fdate(L.acquisition)} et y ont planté un tilleul dès le printemps suivant.</p>
        <p>Ses grands chantiers : les fenêtres en 2016, l'électricité remise aux normes en 2019, la pompe à chaleur qui a remplacé la chaudière d'origine en 2022, la toiture refaite en 2023 — garantie jusqu'en 2033. Une tempête, en novembre 2023, a laissé une trace dans ses tuiles et un dossier clos dans sa mémoire.</p>
        <p>Aujourd'hui, ${S.equipements.filter(e => !e.deposee).length} équipements y sont connus, ${S.docs.filter(d => d.statut !== "refuse").length} documents conservés, et ${S.pros.length} professionnels savent y revenir.</p>

      </div>

    </div></div>`;
};
A.souvenir = () => modal(`<h2>Ajouter un souvenir</h2><p class="muted">Un moment de la vie de la maison — une fin de chantier, un arbre planté, un anniversaire.</p><label class="f"><span>Ce qui s'est passé</span><input class="input" id="svt" placeholder="Par exemple : première flambée dans le poêle"></label><label class="f"><span>Quand</span><input class="input" id="svd" type="date" value="${today()}"></label><label class="btn">${I.camera} Ajouter une photo<input type="file" accept="image/*" class="sr" onchange="toast('Photo ajoutée au souvenir')"></label><div class="row" style="margin-top:10px"><button class="btn primary" onclick="A.souvenirOk()">Conserver</button><button class="btn" onclick="closeModal()">Annuler</button></div>`);
A.souvenirOk = () => { const t = document.getElementById("svt").value.trim(); const d = document.getElementById("svd").value || today(); if (!t) { toast("Dites-nous ce qui s'est passé"); return; } S.events.push({ d, t, k: "wow", wow: true }); S.metrics.docs++; closeModal(); toast("Souvenir conservé"); save(); route(); };

V.chronologie = (param) => {
  const f = param || "";
  const evs = S.events.filter(e => !f || e.eq === f).sort((a, b) => b.d.localeCompare(a.d));
  const byYear = {}; evs.forEach(e => { const y = e.d.slice(0, 4); (byYear[y] = byYear[y] || []).push(e); });
  const eqs = S.equipements.filter(e => S.events.some(v => v.eq === e.id));
  return `<div class="page"><div class="page-h"><div><h1>Chronologie</h1><p>Construite automatiquement à partir des documents, des travaux et des équipements.</p></div></div>
    <div class="row" style="margin-bottom:12px"><a class="pill ${!f ? "on" : ""}" href="#/chronologie">Tout</a>${eqs.map(e => `<a class="pill ${f === e.id ? "on" : ""}" href="#/chronologie/${e.id}">${h(e.nom)}</a>`).join("")}</div>
    <div class="card"><ul class="tl">${Object.keys(byYear).sort((a, b) => b - a).map(y => `<li class="year" style="list-style:none">${y}</li>` + byYear[y].map(e => `<li class="${e.wow ? "wow" : ""}">${h(e.t)}${e.eq ? ` <a class="tag" href="#/equipements/${e.eq}">${h(eq(e.eq) ? eq(e.eq).nom : "")}</a>` : ""}<span class="d">${fdate(e.d)}</span></li>`).join("")).join("")}</ul></div></div>`;
};

          <div class="row" style="align-items:flex-start"><canvas id="qr" class="qr"></canvas><div><b class="num" style="word-break:break-all">${h(L.adresseDepot)}</b><div class="actions"><button class="btn sm" onclick="A.partager()">Partager</button><button class="btn sm" onclick="A.copier()">Copier</button><button class="btn sm" onclick="A.regenerer()">Régénérer</button></div></div></div>

/* ---------- pièces ---------- */
V.pieces = (param) => {
  if (param) return V.piece(param);
  const done = DATA.pieces.filter(p => S.pieces[p.id] && S.pieces[p.id].fait).length;
  const rythme = S.rythme;
  return `<div class="page"><div class="page-h"><div><h1>Pièces et espaces</h1><p>Entrez dans une pièce, et photographiez ce qui s'y trouve. Un jeu de recherche, pas un interrogatoire.</p></div></div>
    ${rythme ? "" : `<div class="card" style="margin-bottom:14px"><h3>À quel rythme ?</h3><p class="sub">VIDOM ne vous impose jamais un long parcours d'un bloc.</p><div class="row"><button class="btn primary" onclick="S.rythme='maintenant';save();route()">Maintenant, pièce après pièce</button><button class="btn" onclick="S.rythme='fil';save();route()">Au fil du temps</button><button class="btn" onclick="S.rythme='plustard';save();route();toast('Vous retrouverez les pièces ici quand vous voudrez')">Plus tard</button></div></div>`}
    <div class="split" style="margin-bottom:10px"><span class="muted">${done} pièce${done > 1 ? "s" : ""} sur ${DATA.pieces.length} parcourue${done > 1 ? "s" : ""}</span><span class="progress" style="width:160px"><i style="width:${Math.round(done / DATA.pieces.length * 100)}%"></i></span></div>
    <div class="plan">${DATA.pieces.map(p => { const st = S.pieces[p.id] || {}; const nEq = S.equipements.filter(e => e.piece === p.id && !e.deposee).length; const nObj = (st.objets || []).length; return `<button class="room ${st.fait ? "done" : ""}" onclick="location.hash='#/pieces/${p.id}'">${icoRoom(p.type).replace('class="ico ','class="ico tile ')}<b>${h(p.nom)}</b><span class="c">${nEq + nObj} objet${nEq + nObj > 1 ? "s" : ""} trouvé${nEq + nObj > 1 ? "s" : ""}${st.photos ? ` · ${st.photos} photo${st.photos > 1 ? "s" : ""}` : ""}</span></button>`; }).join("")}</div>
    <p class="tiny faint" style="margin-top:12px">Le plan est simplifié à partir du comptage des pièces. VIDOM ne parle jamais des fondations, des murs ou des matériaux de toiture.</p></div>`;
};
V.piece = (id) => {
  const p = piece(id); if (!p) return V.pieces("");
  const st = S.pieces[id] = S.pieces[id] || { objets: [], photos: 0 };
  const eqs = S.equipements.filter(e => e.piece === id && !e.deposee);
  const docs = S.docs.filter(d => d.cible === id && d.statut !== "refuse");
  return `<div class="page"><div class="page-h"><div><a class="small" href="#/pieces">← Toutes les pièces</a><h1 class="eqrow">${icoRoom(p.type).replace('class="ico ','class="ico xl ')}${h(p.nom)}</h1><p>${eqs.length + st.objets.length} objet${eqs.length + st.objets.length > 1 ? "s" : ""} trouvé${eqs.length + st.objets.length > 1 ? "s" : ""}</p></div>
      <label class="btn primary">${I.camera} Photographier<input type="file" accept="image/*" capture="environment" class="sr" onchange="A.photoPrise(this,'${id}')"></label></div>
    <div class="grid2">
      <div>
        <div class="card"><h3>Ce qu'on trouve souvent dans ${p.type === "jardin" ? "un jardin" : p.type === "exterieur" ? "cette partie" : "cette pièce"}</h3><p class="sub">Cochez ce que vous avez. Ce n'est pas une liste à finir.</p>
          ${p.sugg.map(s => { const on = st.objets.includes(s) || eqs.some(e => e.nom.toLowerCase().includes(s.toLowerCase().split(" ")[0])); return `<label class="check"><input type="checkbox" ${on ? "checked" : ""} onchange="A.coche('${id}','${h(s)}',this.checked)"><span>${h(s)}</span></label>`; }).join("")}
          <div class="row" style="margin-top:10px"><input class="input" id="libre" placeholder="Autre chose : une cave à vin, un deuxième congélateur…" style="max-width:320px"><button class="btn" onclick="A.libre('${id}')">Ajouter</button></div>
          <div class="actions"><button class="btn ${st.fait ? "" : "primary"}" onclick="S.pieces['${id}'].fait=${st.fait ? "false" : "true"};save();route();toast('${st.fait ? "Pièce rouverte" : "Pièce parcourue"}')">${st.fait ? "Rouvrir la pièce" : "J'ai fait le tour"}</button></div>
        </div>
      </div>
      <div>
        <div class="card"><h3>Équipements connus ici</h3>${eqs.length ? eqs.map(e => `<div class="opt" onclick="location.hash='#/equipements/${e.id}'"><div class="eqrow">${mono(e.marque)}<div><b>${h(e.nom)}</b><div class="small muted">${h(e.marque)} ${h(e.modele)}</div></div></div><span class="state ${e.etat === "bon" ? "valide" : "attention"}">${ETATS[e.etat]}</span></div>`).join("") : `<div class="empty">${ILL.vide}<b>Aucun équipement encore</b>Photographiez un appareil ou son étiquette : VIDOM le reconnaît et va chercher sa notice.</div>`}
          ${st.objets.filter(o => !eqs.some(e => e.nom === o)).map(o => `<div class="opt"><span>${h(o)}</span><span class="tag">déclaré</span></div>`).join("")}
        </div>
        <div class="card"><h3>Documents de cette pièce</h3>${docs.length ? docs.map(d => `<div class="doc" onclick="location.hash='#/documents/${d.id}'" style="cursor:pointer"><div class="thumb">${d.img ? `<img src="${d.img}" alt="">` : icoDoc(d.type)}</div><div><b>${h(d.titre)}</b><span class="l">${fdate(d.date)} · ${h(d.four)}</span></div></div>`).join("") : `<div class="empty"><b>Rien encore</b>Une facture, une notice, une photo — tout se rattache à la pièce.</div>`}</div>
      </div>
    </div></div>`;
};
A.coche = (id, s, on) => { const st = S.pieces[id]; if (on && !st.objets.includes(s)) st.objets.push(s); if (!on) st.objets = st.objets.filter(x => x !== s); save(); };
A.libre = (id) => { const i = document.getElementById("libre"); const v = i.value.trim(); if (!v) return; S.pieces[id].objets.push(v); save(); route(); toast("« " + v + " » ajouté"); };

/* ---------- boîte d'arrivée ---------- */
V.boite = () => {
  const items = S.inbox.slice().sort((a, b) => b.date.localeCompare(a.date));
  const prop = items.filter(i => i.statut === "propose");

/* ---------- professionnels ---------- */

  if (param) return V.pro(param);
  return `<div class="page"><div class="page-h"><div><h1>Professionnels du logement</h1><p>Ceux qui sont réellement intervenus ici. Leur présence ne s'achète pas et ne disparaît jamais.</p></div><a class="btn primary" href="#/professionnels/trouver">Trouver un professionnel</a></div>
    <div class="cards">${S.pros.map(p => `<div class="card" style="margin:0"><div class="split"><h3 class="eqrow">${mono(p.nom)}${h(p.nom)}</h3><span class="state ${p.statut === "actif" ? "actif" : ""}">${p.statut === "actif" ? "Actif" : "Historique"}</span></div><p class="sub">${h(p.metier)} · ${h(p.ville)}</p><div class="small">${h(p.motif.charAt(0).toUpperCase() + p.motif.slice(1))}<br><span class="muted">Dernière intervention : ${fdate(p.derniere)}</span></div><div class="actions"><a class="btn sm primary" href="#/professionnels/${p.id}">Recontacter</a></div></div>`).join("")}</div>
    ${S.artisanCarte ? "" : `<div class="notice small" style="margin-top:14px">Quand un professionnel dépose un document, VIDOM lui demande s'il souhaite que sa carte reste mémorisée pour ce logement — jamais à froid. Essayez avec le panneau Simuler, dans le profil.</div>`}</div>`;
};
V.pro = (id) => {

  const eqs = S.equipements.filter(e => e.par === id); const docs = S.docs.filter(d => d.pro === id && d.statut !== "refuse");
  return `<div class="page"><div class="page-h"><div><a class="small" href="#/professionnels">← Professionnels</a><h1 class="eqrow">${mono(p.nom, true)}<span>${h(p.nom)}</span></h1><p>${h(p.metier)} · ${h(p.ville)} · ${p.km} km</p></div><span class="state ${p.statut === "actif" ? "actif" : ""}">${p.statut === "actif" ? "Profil actif" : "Historique"}</span></div>
    <div class="grid2"><div><div class="card"><dl class="kv"><dt>Motif</dt><dd>${h(p.motif)}</dd><dt>Dernière intervention</dt><dd>${fdate(p.derniere)}</dd><dt>Téléphone</dt><dd class="num">${h(p.tel) || "—"}</dd><dt>Courriel</dt><dd>${h(p.mail) || "—"}</dd><dt>SIRET</dt><dd class="num">${h(p.siret) || "non renseigné"}</dd></dl>
      <div class="actions"><button class="btn primary" onclick="A.contact('${id}','tel')">Appeler</button>${p.mail ? `<button class="btn" onclick="A.contact('${id}','mail')">Écrire</button>` : ""}<button class="btn" onclick="A.demandeDoc('${id}')">Demander un document</button></div>
      <p class="tiny faint" style="margin-top:10px">Au premier contact, l'adresse de dépôt de la maison part avec votre message : ce que ${h(p.nom)} enverra arrivera dans la boîte d'arrivée.</p></div>
      <div class="card"><h3>Ce qu'il a fait ici</h3>${eqs.map(e => `<div class="opt" onclick="location.hash='#/equipements/${e.id}'"><span>${h(e.nom)}</span><span class="tag">${fmois(e.install)}</span></div>`).join("") || `<p class="muted">Une intervention ponctuelle.</p>`}</div></div>
    <div class="card"><h3>Documents</h3>${docs.map(d => `<div class="doc" onclick="location.hash='#/documents/${d.id}'" style="cursor:pointer"><div class="thumb">${icoDoc(d.type)}</div><div><b>${h(d.titre)}</b><span class="l">${fdate(d.date)}${d.montant ? " · " + eur(d.montant) : ""}</span></div></div>`).join("") || `<p class="muted">Aucun document.</p>`}</div></div></div>`;
};
A.contact = (id, mode) => { const p = pro(id); S.journal.push({ d: today(), t: "Contact avec " + p.nom + " — adresse de dépôt transmise" }); save(); modal(`<h2>${mode === "tel" ? "Appeler" : "Écrire à"} ${h(p.nom)}</h2><p>${mode === "tel" ? `<b class="num">${h(p.tel)}</b>` : `<b>${h(p.mail)}</b>`}</p><p class="muted small">L'adresse de dépôt de la maison, <span class="num">${h(S.logement.adresseDepot)}</span>, est ${mode === "tel" ? "à dicter : elle a été faite pour ça, sans caractère ambigu" : "déjà en copie de votre message"}.</p><div class="row"><button class="btn primary" onclick="closeModal();toast('${mode === "tel" ? "Appel" : "Message"} préparé')">${mode === "tel" ? "Appeler" : "Ouvrir ma messagerie"}</button><button class="btn" onclick="closeModal()">Fermer</button></div>`); };
A.demandeDoc = (id) => { const p = pro(id); const L = S.logement; modal(`<h2>Demander un document à ${h(p.nom)}</h2><label class="f"><span>Quel document ?</span><input class="input" id="dq" placeholder="Par exemple : l'attestation de garantie de la toiture"></label><label class="f"><span>Message</span><textarea class="input" id="dm" style="min-height:150px">Bonjour,\n\nPourriez-vous m'adresser [le document] concernant ${L.adresse} à ${L.ville} ?\n\nMerci de mettre ${L.adresseDepot} en copie de l'ensemble des échanges de ce dossier.\n\n${L.gardien}</textarea></label><div class="row"><button class="btn primary" onclick="A.demandeOk('${id}')">Envoyer depuis ma messagerie</button><button class="btn" onclick="closeModal()">Annuler</button></div>`); };
A.demandeOk = (id) => { const p = pro(id); const q = document.getElementById("dq").value.trim() || "un document"; S.demandes.push({ id: uid("q"), tiers: p.nom, objet: q, d: today(), delai: addDays(today(), 14), statut: "sans réponse" }); S.metrics.demandes++; S.journal.push({ d: today(), t: "Demande à " + p.nom + " : " + q }); closeModal(); toast("Demande ouverte dans votre messagerie. Suivie dans À faire."); save(); route(); };
V.trouver = (eqId) => {

  const autres = [{ nom: "Chauffage Loire Atlantique", metier: "Chauffage", km: 5, actif: true }, { nom: "Ets Morvan", metier: "Plomberie, chauffage", km: 8, actif: true }, { nom: "Dépann'Énergie 44", metier: "Électroménager, dépannage", km: 3, actif: true }, { nom: "Atelier Ligérien", metier: "Menuiserie", km: 11, actif: false }];
  return `<div class="page"><div class="page-h"><div><a class="small" href="#/professionnels">← Professionnels</a><h1>Trouver un professionnel</h1><p>${e ? "Pour " + h(e.nom.toLowerCase()) + ". " : ""}D'abord ceux que la maison connaît, puis ceux qui sont proches.</p></div></div>
    <div class="card"><h3>La maison les connaît déjà</h3><p class="sub">Un professionnel qui est déjà venu passe avant un inconnu.</p>${connus.map(p => `<div class="opt" onclick="location.hash='#/professionnels/${p.id}'"><div class="eqrow">${mono(p.nom)}<div><b>${h(p.nom)}</b><div class="small muted">${h(p.metier)} · ${h(p.motif)} · ${p.km} km</div></div></div><span class="state ${p.statut === "actif" ? "actif" : ""}">${p.statut === "actif" ? "Actif" : "Historique"}</span></div>`).join("")}</div>
    <div class="card"><h3>Près de chez vous</h3><p class="sub">Profils actifs, dans un rayon de 15 km. Aucun classement acheté, aucune commission.</p>${autres.map(p => `<div class="opt" onclick="A.contactNouveau('${h(p.nom)}')"><div class="eqrow">${mono(p.nom)}<div><b>${h(p.nom)}</b><div class="small muted">${h(p.metier)} · ${p.km} km</div></div></div><span class="state ${p.actif ? "actif" : ""}">${p.actif ? "Actif" : "Historique"}</span></div>`).join("")}</div></div>`;
};
A.contactNouveau = (nom) => modal(`<h2>${h(nom)}</h2><p class="muted">En le contactant, l'adresse de dépôt de la maison part avec votre message. Ce qu'il enverra en fin d'intervention arrivera dans la boîte d'arrivée — proposé, jamais imposé.</p><div class="row"><button class="btn primary" onclick="S.journal.push({d:today(),t:'Contact avec ${h(nom)} — adresse de dépôt transmise'});save();closeModal();toast('Message préparé, adresse de la maison en copie')">Écrire</button><button class="btn" onclick="closeModal()">Fermer</button></div>`);

/* ---------- à faire ---------- */
V.afaire = () => {
  const r = S.rappels.slice().sort((a, b) => a.d.localeCompare(b.d)); const q = S.demandes.filter(d => d.statut === "sans réponse");
  return `<div class="page"><div class="page-h"><div><h1>À faire</h1><p>Une information importante à la fois. Un seul courriel par mois, en tableau de bord — jamais un par équipement.</p></div></div>
    <div class="grid2"><div>
      <div class="card"><h3>Prochaines échéances</h3>${r.length ? r.map(x => `<div class="opt" style="align-items:flex-start"><div class="eqrow" style="align-items:flex-start">${ico(x.eq && eq(x.eq) ? eq(x.eq).cat : "courrier","tile")}<div><b>${h(x.t)}</b><div class="small muted">${fmois(x.d)}${x.eq && eq(x.eq) ? ` · <a href="#/equipements/${x.eq}">${h(eq(x.eq).nom)}</a>` : ""}</div><div class="small">${h(x.txt)}</div></div></div><div class="row" style="flex-direction:column;align-items:flex-end">${x.k === "entretien" || x.k === "garantie" ? `<button class="btn sm primary" onclick="A.dejaFait('${x.id}')">Déjà fait ?</button>` : `<button class="btn sm" onclick="A.relancer('${x.id}')">Relancer</button>`}<button class="btn sm ghost" onclick="A.clore('${x.id}')">Clore</button></div></div>`).join("") : `<div class="empty"><b>Rien à faire</b>La maison est à jour.</div>`}</div>
    </div><div>
      <div class="card"><h3>Demandes envoyées</h3><p class="sub">VIDOM ne voit pas partir vos courriels ; seule la réponse est visible, dans la boîte d'arrivée.</p>${q.length ? q.map(d => `<div class="opt" style="align-items:flex-start"><div><b>${h(d.objet)}</b><div class="small muted">À ${h(d.tiers)} · envoyée le ${fdate(d.d)} · réponse attendue avant le ${fdate(d.delai)}</div></div><div class="row" style="flex-direction:column;align-items:flex-end"><span class="state ${d.delai < today() ? "attention" : ""}">${d.delai < today() ? "en retard" : "sans réponse"}</span><button class="btn sm ghost" onclick="A.cloreDemande('${d.id}')">Clore</button></div></div>`).join("") : `<p class="muted">Aucune demande en attente.</p>`}</div>
      <div class="card"><h3>Le courriel du mois</h3><p class="sub">Ce que vous recevrez, une fois par mois, et rien d'autre.</p><div class="book" style="min-height:0;padding:18px 20px;font-size:.92em"><b>Maison des Tilleuls — ${MOIS[new Date().getMonth()]} ${new Date().getFullYear()}</b><p style="margin-top:8px">Ce mois-ci, ${S.metrics.docs || 3} documents ont rejoint la mémoire de la maison. Il en manque encore ${q.length} que vous avez demandés.<br>Prochaine échéance : ${r[0] ? h(r[0].t.toLowerCase()) + ", " + fmois(r[0].d) : "aucune"}.</p><p class="tiny faint">Aucun courriel de VIDOM ne parle d'argent, d'essai ou d'abonnement.</p></div></div>
    </div></div></div>`;
};
A.dejaFait = (id) => { const x = S.rappels.find(r => r.id === id); modal(`<h2>${h(x.t)} — déjà fait ?</h2><p class="muted">Indiquez la date et joignez la facture : le prochain rappel se recale tout seul, sans doublon.</p><label class="f"><span>Fait le</span><input class="input" type="date" id="df" value="${today()}"></label><label class="btn">${I.camera} Joindre la facture<input type="file" accept="image/*,application/pdf" class="sr" onchange="toast('Facture jointe')"></label><div class="row" style="margin-top:10px"><button class="btn primary" onclick="A.dejaFaitOk('${id}')">C'est fait</button><button class="btn" onclick="closeModal()">Annuler</button></div>`); };
A.dejaFaitOk = (id) => { const x = S.rappels.find(r => r.id === id); const d = document.getElementById("df").value || today(); if (x.eq && eq(x.eq)) { eq(x.eq).entretien = d; eq(x.eq).prochain = addDays(d, 365); } S.events.push({ d, t: x.t + " — fait", k: "entretien", eq: x.eq }); x.d = addDays(d, 365).slice(0, 7) + "-01"; x.txt = "Fait le " + fdate(d) + ". Prochain rappel recalé automatiquement."; S.metrics.docs++; closeModal(); toast("Noté. Prochain rappel : " + fmois(x.d)); save(); route(); };
A.clore = (id) => { S.rappels = S.rappels.filter(r => r.id !== id); toast("Clos — c'est votre geste, jamais celui de VIDOM"); save(); route(); };

A.cloreDemande = (id) => { const d = S.demandes.find(x => x.id === id); d.statut = "close"; S.rappels = S.rappels.filter(r => !(r.k === "demande" && d.objet && r.t.includes(d.tiers.split(" ")[0]))); toast("Dossier clos"); save(); route(); };

  const acc = S.acces;
  return `<div class="page"><div class="page-h"><div><h1>Échanges et accès</h1><p>Le logement au centre, les tiers autour. Chacun voit ce qui le concerne, et rien d'autre.</p></div><a class="btn" href="#/echanges/journal">Qui a vu quoi</a></div>

    <div class="cards tiers2">${T.map(t => `<div class="card" style="margin:0;cursor:pointer" onclick="A.tiers('${t.id}')"><div class="split"><h3 style="font-size:1em" class="eqrow">${ico(t.id,"tile")}${h(t.nom)}</h3>${acc[t.id] && acc[t.id].ouvert ? `<span class="state actif">ouvert</span>` : ""}</div><div class="small muted">${h(t.motif)}</div>${t.particulier ? `<div style="margin-top:6px"><span class="state actif">statut particulier</span></div>` : ""}<div class="small" style="margin-top:6px">${t.voit.length} éléments visibles · ${t.exclus.length} exclus</div></div>`).join("")}</div></div></div>`;
};

  modal(`<h2 class="eqrow">${ico(t.id,"lg")}${h(t.nom)}</h2><p class="muted">${h(t.motif)}</p>${t.particulier ? `<div class="notice">${h(t.particulier)}</div>` : ""}
    <div class="grid2" style="grid-template-columns:1fr 1fr;gap:12px"><div><b class="small">Ce qu'il voit</b>${t.voit.map(v => `<div class="opt" style="padding:5px 8px"><span class="small">${h(v)}</span><span class="state valide">visible</span></div>`).join("")}</div><div><b class="small">Ce qu'il ne voit jamais</b>${t.exclus.map(v => `<div class="opt" style="padding:5px 8px"><span class="small">${h(v)}</span><span class="state refuse">exclu</span></div>`).join("")}</div></div>
    ${a.ouvert ? `<div class="notice">Accès ouvert jusqu'au ${fdate(a.jusqu)}. Il se refermera de lui-même.</div>` : ""}
    <div class="row" style="margin-top:12px"><button class="btn" onclick="A.voirComme('${id}')">Voir comme ${h(t.nom.toLowerCase())}</button>${a.ouvert ? `<button class="btn terra" onclick="A.fermer('${id}')">Fermer l'accès</button>` : `<select class="input" id="duree" style="max-width:160px">${t.mandat ? `<option value="365">1 an (mandat)</option><option value="730">2 ans</option><option value="1095">3 ans</option>` : `<option value="30">1 mois</option><option value="90">3 mois</option><option value="180">6 mois</option>`}</select><button class="btn primary" onclick="A.ouvrir('${id}')">Ouvrir l'accès</button>`}</div>`);
};
A.ouvrir = (id) => { const d = +document.getElementById("duree").value; S.acces[id] = { ouvert: true, jusqu: addDays(today(), d) }; const t = DATA.tiers.find(x => x.id === id); S.journal.push({ d: today(), t: "Accès ouvert à " + t.nom + " jusqu'au " + fdate(S.acces[id].jusqu) }); closeModal(); toast("Accès ouvert. Il se refermera de lui-même."); save(); route(); };
A.fermer = (id) => { S.acces[id] = { ouvert: false }; S.journal.push({ d: today(), t: "Accès fermé : " + DATA.tiers.find(x => x.id === id).nom }); closeModal(); toast("Accès fermé"); save(); route(); };
A.voirComme = (id) => { const t = DATA.tiers.find(x => x.id === id); const L = S.logement; modal(`<h2>Vu par ${h(t.nom.toLowerCase())}</h2><p class="muted small">Exactement ce qu'il verrait, et rien d'autre.</p><div class="book" style="min-height:0"><h2>${h(L.nom)}</h2><p class="muted">${h(L.adresse)}, ${h(L.ville)} · partagé par ${h(L.gardien)}</p>${t.voit.map(v => `<p><b>${h(v)}</b><br><span class="muted small">${v.includes("Chronologie") ? "2016 fenêtres · 2019 électricité · 2022 pompe à chaleur · 2023 toiture" : v.includes("quipement") ? "Pompe à chaleur Daikin (2022), toiture Monier (2023), VMC, ballon…" : v.includes("Garantie") ? "Toiture décennale 2033 · PAC 2027" : v.includes("DPE") || v.includes("Diagnostic") ? "Classe C · 12 mai 2024" : v.includes("Photo") ? "6 photos de chantier" : "…"}</span></p>`).join("")}<div class="pn">accès limité dans le temps · révocable</div></div><div class="row" style="margin-top:10px"><button class="btn" onclick="closeModal()">Fermer</button></div>`); };
V.journal = () => `<div class="page"><div class="page-h"><div><a class="small" href="#/echanges">← Échanges</a><h1>Qui a vu quoi</h1><p>Chaque partage, chaque consultation, chaque envoi. Réservé à vous.</p></div></div><div class="card tbl"><table><thead><tr><th>Date</th><th>Ce qui s'est passé</th></tr></thead><tbody>${S.journal.slice().reverse().map(j => `<tr><td class="num">${fdate(j.d)}</td><td>${h(j.t)}</td></tr>`).join("")}</tbody></table></div></div>`;

/* ---------- messagerie ---------- */
V.messagerie = () => `<div class="page"><div class="page-h"><div><h1>Messagerie</h1><p>Posez une question à la mémoire de la maison. Le fil est celui du logement.</p></div><a class="btn" href="mailto:contact@vidom.fr">Nous contacter</a></div>

  <div class="print-only"><h2>${h(S.logement.nom)}</h2><p>${h(S.logement.adresseDepot)}</p><p>Vous intervenez dans ce logement ? Envoyez votre facture et votre garantie à cette adresse.</p></div></div>`;
V.etiquette.after = () => { const c = document.getElementById("qr"); if (c) drawQR(c, S.logement.adresseDepot); };

/* ---------- sommaire (téléphone) ---------- */
V.menu = () => {
  const nInbox = S.inbox.filter(i => i.statut === "propose").length;
  const nDocs = S.docs.filter(d => d.statut !== "refuse").length, nEq = S.equipements.filter(e => !e.deposee).length;
  const it = (go, ico, t, s, b, alert) => `<a class="opt" href="#/${go}" style="text-decoration:none;color:inherit"><div class="row" style="gap:10px"><span class="ico tile">${I[ico] || ICO[ico] || ""}</span><div><b>${t}</b><div class="small muted">${s}</div></div></div>${b ? `<span class="badge ${alert ? "alert" : ""}" style="background:${alert ? "var(--terra)" : "var(--bois-c)"};color:${alert ? "#fff" : "var(--ardoise)"}">${b}</span>` : ""}</a>`;
  return `<div class="page"><div class="page-h"><div><h1>La mémoire de la maison</h1><p>Toutes les sections, au même endroit.</p></div></div>
    ${it("boite", "boite", "Boîte d'arrivée — le sas", "Ce qui est arrivé par l'adresse de la maison. Vous décidez ce qui entre.", nInbox, true)}
    ${it("pieces", "pieces", "Pièces et espaces", "Photographier, pièce après pièce", "")}
    ${it("equipements", "equip", "Équipements", "Fiches, notices, SAV, garanties", nEq)}
    ${it("documents", "doc", "Documents", "Tout ce qui est conservé", nDocs)}
    ${it("chronologie", "horloge", "Chronologie", "La maison raconte son histoire", "")}
    ${it("memoire", "coeur", "Mémoire", "Le livre du logement, les moments qui comptent", "")}
    ${it("fiche", "fiche", "Fiche du logement", "Identité, adresse de dépôt, expéditeurs", "")}
    ${it("travaux", "travaux", "Travaux", "Chantiers, devis, finances", "")}
    ${it("professionnels", "pros", "Professionnels", "Ceux qui connaissent la maison", "")}
    ${it("echanges", "echanges", "Échanges et accès", "Le logement au centre, les tiers autour", "")}
    ${it("messagerie", "chat", "Messagerie", "Poser une question à la maison", "")}
    ${it("transmission", "cle", "Transmission", "Les livres, et le jour où la maison change de mains", "")}
    <div class="grp" style="color:var(--sable);margin-top:16px">À venir</div>
    ${it("consommation", "lock", "Consommation", "Dans une version ultérieure", "")}${it("locataire", "lock", "Locataire", "Dans une version ultérieure", "")}</div>`;
};

/* ---------- cadenas ---------- */
const lockView = (titre, texte, quand) => () => `<div class="page"><div class="page-h"><div><h1>${titre}</h1></div></div><div class="lockbox">${I.lock}<div><b>Dans une version ultérieure.</b><p style="margin-top:6px">${texte}</p><p class="small muted">${quand}</p></div></div></div>`;
V.consommation = lockView("Consommation", "Avec votre accord, VIDOM suivra la consommation d'électricité et de gaz de la maison, au pas mensuel — jamais la courbe de charge — pour montrer l'effet réel des travaux. La consommation appartient à celui qui habite ; elle ne se transmet jamais.", "Après la version test, une fois le contrat Enedis et GRDF en place.");
V.locataire = lockView("Locataire", "Un locataire aura sa propre mémoire, personnelle et portable, qui le suit d'un logement à l'autre. Une facture à son nom rejoint son dossier ; au nom du propriétaire, la mémoire du logement.", "Le mécanisme est à l'étude.");
V.preremplissage = lockView("Pré-remplissage riche", "À partir de l'adresse, VIDOM ira plus loin : ventes passées par numéro de lot, registre des copropriétés, hauteur et niveaux du bâtiment. Toujours en silence, toujours corrigible, jamais les voisins.", "Ces sources demandent leur propre base de données.");

/* ---------- démarrage ---------- */
document.getElementById("root") || (() => { const r = document.createElement("div"); r.id = "root"; document.body.appendChild(r); })();
document.getElementById("toasts") || (() => { const t = document.createElement("div"); t.className = "toasts"; t.id = "toasts"; document.body.appendChild(t); })();
route();
</script>
</body></html>
