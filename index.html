<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIDOM — la mémoire de votre logement</title>
<meta name="description" content="VIDOM construit avec vous la mémoire de votre logement.">
<meta name="theme-color" content="#F6F3ED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VIDOM">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235F7A6A'/%3E%3Cpath d='M14 30l18-14 18 14' fill='none' stroke='%23FFFDF9' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M19 29v18h26V29' fill='none' stroke='%23FFFDF9' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M28 47v-10h8v10' fill='none' stroke='%23FFFDF9' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%235F7A6A'/%3E%3Cpath d='M14 30l18-14 18 14' fill='none' stroke='%23FFFDF9' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M19 29v18h26V29' fill='none' stroke='%23FFFDF9' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M28 47v-10h8v10' fill='none' stroke='%23FFFDF9' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{
  --sauge:#5F7A6A;--sauge-f:#4A6255;--sauge-c:#E4EBE6;--sauge-cc:#F0F4F1;
  --ivoire:#F6F3ED;--blanc:#FFFDF9;--bois:#D8C8B2;--bois-c:#EFE6D8;--sable:#B5B0A5;
  --ardoise:#50575E;--encre:#2F3439;--terra:#C9775B;--terra-c:#F4E3DB;--terra-f:#A85F45;
  --fs:17px;--r:12px;--r2:16px;
}
html[data-texte="grand"]{--fs:19px}
html[data-texte="tres-grand"]{--fs:21px}
@media (min-width:1024px){:root{--fs:16px}html[data-texte="grand"]{--fs:18px}html[data-texte="tres-grand"]{--fs:20px}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ivoire);color:var(--encre);font-family:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;font-size:var(--fs);line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--sauge-f)}
h1,h2,h3{margin:0;font-weight:600;line-height:1.15;text-wrap:balance}
h1{font-size:1.65em}h2{font-size:1.3em}h3{font-size:1.1em}
p{margin:0}
.muted{color:var(--ardoise)}.faint{color:var(--sable)}.small{font-size:.85em}.b{font-weight:600}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
svg.i{width:20px;height:20px;flex:0 0 auto}

/* ---------- squelette ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.col{width:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 20px 8px}
.top .t{font-size:.8em;color:var(--ardoise);font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.top .back{display:inline-flex;align-items:center;gap:6px;color:var(--sauge-f);font-weight:600;min-height:44px}
.view{flex:1 1 auto;display:flex;flex-direction:column;gap:14px;padding:6px 18px 24px}
.view.center{justify-content:center;padding-bottom:120px}
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:var(--blanc);border-top:1px solid var(--bois-c)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;text-decoration:none;color:var(--ardoise);font-size:.8em;font-weight:500;border-radius:var(--r)}
.nav a svg{width:24px;height:24px}
.nav a.on{color:var(--sauge-f);background:var(--sauge-cc)}
.nav a.cam{color:var(--blanc);background:var(--sauge)}
.nav a.cam.on{background:var(--sauge-f)}

/* ---------- ordinateur ---------- */
.desk{display:none}
@media (min-width:1024px){
  body.app .col{display:none}
  body.app .desk{display:grid;grid-template-columns:420px minmax(0,1fr);gap:32px;max-width:1280px;margin:0 auto;padding:0 32px;min-height:100vh}
  .desk .pane{display:flex;flex-direction:column;min-height:100vh}
  .desk .pane.left{position:sticky;top:0;max-height:100vh;overflow:auto;padding-bottom:24px}
  .desk .pane .view{padding:6px 4px 32px}
  .desk .topbar{position:sticky;top:0;z-index:5;background:var(--ivoire);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 4px 8px}
  .desk .topbar .t{font-size:.8em;color:var(--ardoise);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .desk .topbar .actions{display:flex;gap:8px;align-items:center}
  .nav{display:none}
}

/* ---------- composants ---------- */
.card{background:var(--blanc);border:1px solid var(--bois-c);border-radius:var(--r2);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.card.soft{background:var(--sauge-cc);border-color:var(--sauge-c)}
.card.attn{border-color:var(--terra);background:var(--terra-c)}
.card.dash{border-style:dashed;background:transparent;color:var(--sable)}
a.card{text-decoration:none;color:inherit}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r);border:1px solid var(--bois);background:var(--blanc);color:var(--encre);font-size:.95em;font-weight:600;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{border-color:var(--sauge)}
.btn.primary{background:var(--sauge);border-color:var(--sauge);color:var(--blanc)}
.btn.primary:hover{background:var(--sauge-f)}
.btn.terra{background:var(--terra);border-color:var(--terra);color:var(--blanc)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sauge-f)}
.btn.big{min-height:56px;font-size:1.05em;border-radius:14px}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85em}
.btn.grow{flex:1 1 auto}
.btn svg{width:20px;height:20px}
.btn.file{position:relative;overflow:hidden}
.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--sauge-c);color:var(--sauge-f);font-size:.8em;font-weight:600;white-space:nowrap}
.chip.terra{background:var(--terra-c);color:var(--terra-f)}
.chip.neutre{background:var(--bois-c);color:var(--ardoise)}
.chip.btn-chip{border:1px solid var(--bois);background:var(--blanc);color:var(--ardoise);font-weight:500;font-size:.9em;padding:8px 14px;cursor:pointer}
.chip.btn-chip.on{background:var(--sauge-c);border-color:var(--sauge);color:var(--sauge-f)}
.input{min-height:54px;border-radius:14px;border:1.5px solid var(--bois);background:var(--blanc);padding:0 16px;font-size:1.05em;display:flex;align-items:center;width:100%;color:var(--encre)}
.input:focus{border-color:var(--sauge);outline:none}
textarea.input{min-height:90px;padding:12px 16px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px}
label.f>span{font-size:.85em;color:var(--ardoise)}
.sep{display:flex;align-items:center;gap:10px;color:var(--sable);font-size:.75em;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.sep i{flex:1 1 auto;height:1px;background:var(--sauge-c);display:block}
.when{font-size:.8em;color:var(--sable);font-weight:500}
.h{font-size:1.65em;font-weight:600;line-height:1.15}
.tile{width:40px;height:40px;border-radius:12px;background:var(--sauge-c);color:var(--sauge-f);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tile svg{width:22px;height:22px}
.tile.terra{background:var(--terra-c);color:var(--terra-f)}
.tile.dash{background:transparent;border:1.5px dashed var(--bois);color:var(--sable)}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bois-c);text-decoration:none;color:inherit}
.line:last-child{border-bottom:0}
.step{display:flex;justify-content:space-between;align-items:center;min-height:50px;border-bottom:1px solid var(--bois-c)}
.step:last-of-type{border-bottom:0}
.step .ctl{display:flex;align-items:center}
.step .ctl button{width:42px;height:42px;border-radius:10px;border:1px solid var(--bois);display:flex;align-items:center;justify-content:center;color:var(--ardoise);font-size:1.4em;background:var(--blanc)}
.step .ctl b{width:40px;text-align:center;font-size:1.1em}
.photo{border-radius:var(--r2);background:#E9E4DA;border:1px solid var(--bois);min-height:150px;display:flex;align-items:flex-end;padding:12px;overflow:hidden;position:relative}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .chip{position:relative;background:var(--blanc);color:var(--ardoise)}
.bulle{align-self:flex-end;max-width:85%;background:var(--sauge);color:var(--blanc);border-radius:18px 18px 4px 18px;padding:10px 16px}
.ask{display:flex;gap:8px;align-items:center;position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--ivoire);padding:8px 0 4px}
@media (min-width:1024px){.ask{bottom:0;padding:10px 0 18px}}
.ask input{flex:1 1 auto}
.ask button{width:54px;height:54px;border-radius:14px;background:var(--sauge);color:var(--blanc);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.house{display:block;width:100%;max-width:300px;margin:0 auto}
.house rect{cursor:pointer}
.plan{width:100%;border-radius:var(--r);border:1px solid var(--bois-c);display:block}
.mono{font-variant-numeric:tabular-nums;word-break:break-all}
.qr{width:96px;height:96px;flex:0 0 auto;border-radius:6px;background:var(--blanc);padding:4px;border:1px solid var(--bois-c)}
.qr svg{width:100%;height:100%;display:block}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--encre);color:var(--blanc);padding:10px 16px;border-radius:999px;font-size:.9em;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (min-width:1024px){.toast{bottom:32px}}
.modal-bg{position:fixed;inset:0;background:rgba(47,52,57,.35);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:0}
@media (min-width:600px){.modal-bg{align-items:center;padding:24px}}
.modal{background:var(--ivoire);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.modal{border-radius:20px;padding:24px}}
.drop{position:fixed;inset:0;background:rgba(95,122,106,.18);border:4px dashed var(--sauge);z-index:60;display:flex;align-items:center;justify-content:center;font-size:1.4em;font-weight:600;color:var(--sauge-f);pointer-events:none}
.fadein{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fadein{animation:none}.toast{transition:none}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95em}
.kv dt{color:var(--ardoise)}.kv dd{margin:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.progress{height:6px;border-radius:3px;background:var(--bois-c);overflow:hidden}
.progress i{display:block;height:100%;background:var(--sauge);border-radius:3px}
.book{background:var(--blanc);border:1px solid var(--bois);border-radius:8px;padding:18px 20px;box-shadow:2px 2px 0 var(--bois-c)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--bois-c)}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--sauge)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status"></div>
<div id="modal"></div>
<div id="drop" class="drop" hidden>Déposez vos fichiers : VIDOM range.</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

function moisFr(s){const [y,m]=s.slice(0,7).split("-").map(Number);return `${MOIS[m-1]} ${y}`}

/* adresse VIDOM réelle : allouée et vérifiée unique en base (vidom.fr, le domaine que Murielle possède) */
async function allouerDepot(nom){
  const base=slug(nom)||"logement";
  const secours=()=>`${base}-${uid().slice(0,4)}@vidom.fr`; // hors ligne, ou en dernier recours
  if(!supa)return secours();
  let session=null;
  try{const {data}=await supa.auth.getSession();session=data&&data.session}catch(e){}
  if(!session)return secours();
  for(let tentative=0;tentative<8;tentative++){
    const graine=tentative===0?[...nom].reduce((a,ch)=>a*31+ch.charCodeAt(0)|0,7):Math.floor(Math.random()*46656)+tentative;
    const c=Math.abs(graine).toString(36).padStart(3,"0").slice(0,3);
    const candidat=`${base}-${c}@vidom.fr`;
    try{
      const {error}=await supa.from("logements").upsert({id:S.logement.id,nom,adresse_depot:candidat,created_by:session.user.id},{onConflict:"id"});
      if(!error)return candidat;
      if(error.code!=="23505")return candidat; // erreur d'un autre type : on garde ce nom localement, pousserTout() réessaiera la synchro
    }catch(e){return candidat}
  }
  return secours();
}

async function fetchAvecDelai(url,ms=5000){ // une source lente ou muette ne doit jamais bloquer l'installation
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),ms);
  try{return await fetch(url,{signal:ctrl.signal})}finally{clearTimeout(t)}
}
async function chercherAdresses(v){ // Base Adresse Nationale, gratuite et sans clé

    const j=await r.json();
    return j.features||[];
  }catch(e){return []}
}
async function enrichirAdresse(){ // best-effort : chaque source est indépendante, silencieuse si elle échoue
  const lat=S.logement.latitude,lon=S.logement.longitude;
  const t=[];
  t.push((async()=>{ // base DPE de l'ADEME
    try{
      const q=encodeURIComponent(S.logement.adresse||"");
      const qs=S.logement.cp?`&qs=${encodeURIComponent(`code_postal_ban:"${S.logement.cp}"`)}`:"";
      const r=await fetchAvecDelai(`https://data.ademe.fr/data-fair/api/v1/datasets/dpe03existant/lines?size=1&q_fields=adresse_ban&q=${q}${qs}`);
      const j=await r.json();
      const d=j.results&&j.results[0];
      if(d){
        if(d.etiquette_dpe)S.logement.dpe=d.etiquette_dpe;
        if(d.etiquette_ges)S.logement.classeClimat=d.etiquette_ges;
        if(d.date_etablissement_dpe)S.logement.dpeDate=d.date_etablissement_dpe;
        if(!S.logement.annee&&d.annee_construction)S.logement.annee=d.annee_construction;
        if(!S.logement.surface&&d.surface_habitable_logement)S.logement.surface=d.surface_habitable_logement;
      }
    }catch(e){}
  })());
  if(lat!=null&&lon!=null){
    t.push((async()=>{ // cadastre IGN, par point
      try{
        const geom=encodeURIComponent(JSON.stringify({type:"Point",coordinates:[lon,lat]}));
        const r=await fetchAvecDelai(`https://apicarto.ign.fr/api/cadastre/parcelle?geom=${geom}`);
        const j=await r.json();
        const p=j.features&&j.features[0]&&j.features[0].properties;
        if(p)S.logement.numeroCadastral=[p.code_dep,p.code_com,p.section,p.numero].filter(Boolean).join(" ");
      }catch(e){}
    })());
    t.push((async()=>{ // Référentiel National des Bâtiments
      try{
        const d=0.0006;
        const r=await fetchAvecDelai(`https://rnb-api.beta.gouv.fr/api/alpha/buildings/?bbox=${lon-d},${lat-d},${lon+d},${lat+d}`);
        const j=await r.json();
        const b=(j.results||[])[0];
        if(b){S.logement.rnbId=b.rnb_id||"";S.logement.rnbStatut=b.status||""}
      }catch(e){}
    })());
    t.push((async()=>{ // altitude, Géoplateforme IGN
      try{
        const r=await fetchAvecDelai(`https://data.geopf.fr/altimetrie/1.0/calcul/alti/rest/elevation.json?lon=${lon}&lat=${lat}&resource=ign_rge_alti_wld&indent=false`);
        const j=await r.json();
        const e=j.elevations&&j.elevations[0];
        if(e&&typeof e.z==="number")S.logement.altitude=e.z;
      }catch(e){}
    })());
    t.push((async()=>{ // Géorisques
      try{
        const r=await fetchAvecDelai(`https://georisques.gouv.fr/api/v1/resultats_rapport_risque?latlon=${lon},${lat}`);
        const j=await r.json();
        if(j&&j.risquesNaturels)S.logement.risquesNaturels=j.risquesNaturels;
      }catch(e){}
    })());
  }
  await Promise.allSettled(t);
}

  S.travaux.forEach(t=>{if(t.par)pousse(t.par,t.titre,t.date)});

    S.fil=(fil||[]).map(f=>({id:f.id,d:f.horodatage,fait:!!f.fait,type:f.type,...(f.donnees||{})}));
    if(etatRow&&etatRow.etat){
      const et=etatRow.etat;
      if(et.nees)S.nees=et.nees;if(et.questionsPosees)S.questionsPosees=et.questionsPosees;
      if(et.dernierJour)S.dernierJour=et.dernierJour;if(et.reserveServie)S.reserveServie=et.reserveServie;
    }
    S.cree=true;S.etape="";S.ajout=false;S.retourVers=null;
    if(!S.logement.depot&&S.logement.nom){try{S.logement.depot=await allouerDepot(S.logement.nom)}catch(e){}} // un logement créé avant l'adresse VIDOM (VIDOM-mobile) en reçoit une
    hydrateEnCours=false;save();
  }catch(e){/* pas grave : on continue avec la dernière version connue, en local */}
  finally{hydrateEnCours=false}
}

let pousserTout_timer=null,pousserTout_actif=false,pousserTout_rejoue=false,hydrateEnCours=false;
function syncDiffere(){ if(!supa)return; clearTimeout(pousserTout_timer); pousserTout_timer=setTimeout(pousserTout,900); }
if(typeof window!=="undefined")window.addEventListener("online",()=>syncDiffere());

      risques_naturels:lig.risquesNaturels||null,
    },{onConflict:"id"});
    if(S.pieces.length)await supa.from("pieces").upsert(S.pieces.map(p=>({id:p.id,logement_id:lig.id,nom:p.nom,type_piece:p.type||null})),{onConflict:"id"});
    if(S.pros.length)await supa.from("artisans").upsert(S.pros.map(p=>({id:p.id,logement_id:lig.id,nom:p.nom,metier:p.metier||null,telephone:p.tel||null,email:p.mail||null,ville:p.ville||null})),{onConflict:"id"});
    if(S.travaux.length)await supa.from("interventions").upsert(S.travaux.map(t=>({id:t.id,logement_id:lig.id,type_intervention:t.titre||"Travaux",artisan_nom:t.par||null,date_intervention:t.date||null,cout:t.montant||null})),{onConflict:"id"});
    if(S.equipements.length){
      await supa.from("equipements").upsert(S.equipements.map(e=>({
        id:e.id,logement_id:lig.id,piece_id:(e.piece&&e.piece!=="maison")?e.piece:null,
        categorie:e.nom||"Équipement",marque:e.marque||null,modele:e.modele||null,numero_serie:e.ref||null,

        installateur:e.installateur||null,notice:!!e.notice,service_apres_vente:e.sav||null,
        etat:["bon","moyen","a_remplacer","hors_service"].includes(e.etat)?e.etat:"bon",entretien_requis:!!e.entretien
      })),{onConflict:"id"});
      const photosEq=S.equipements.filter(e=>e.chemin).map(e=>({
        id:"ph-"+e.id,logement_id:lig.id,equipement_id:e.id,piece_id:(e.piece&&e.piece!=="maison")?e.piece:null,
        type_document:"photo",titre:"Photo de l'équipement",chemin_stockage:e.chemin,mime_type:e.pdf?"application/pdf":"image/jpeg",
        source:"manuel",uploaded_by:session.user.id
      }));
      if(photosEq.length)await supa.from("documents").upsert(photosEq,{onConflict:"id"});
    }
    if(S.docs.length){
      const lignesDoc=S.docs.map(d=>{
        const eq=(d.lie&&typeof equipParLie==="function")?equipParLie(d.lie):null;
        const iv=d.travaux?S.travaux.find(t=>t.titre===d.travaux):null;
        return {
          id:d.id,logement_id:lig.id,piece_id:(d.piece&&d.piece!=="maison")?d.piece:null,
          equipement_id:eq?eq.id:(S.equipements.some(e=>e.id===d.lie)?d.lie:null),intervention_id:iv?iv.id:null,
          type_document:d.type||"autre",titre:d.titre||null,chemin_stockage:d.chemin||null,
          mime_type:d.chemin?(d.pdf?"application/pdf":"image/jpeg"):null,
          date_document:d.date?d.date.slice(0,10):null,fournisseur:d.fournisseur||null,montant_ttc:d.montant,
          date_garantie_fin:d.garantie||null,source:d.recu==="adresse"?"adresse_vidom":"manuel",uploaded_by:session.user.id
        };
      });
      await supa.from("documents").upsert(lignesDoc,{onConflict:"id"});
    }
    if(S.rappels.length)await supa.from("rappels").upsert(S.rappels.map(r=>({id:r.id,logement_id:lig.id,texte:r.t,equipement_id:S.equipements.some(e=>e.id===r.equip)?r.equip:null,date_echeance:r.du||null,fait:!!r.fait,info:!!r.info})),{onConflict:"id"});
    if(S.expediteursOk.length)await supa.from("expediteurs_autorises").upsert(S.expediteursOk.map(exp=>({logement_id:lig.id,expediteur:exp})),{onConflict:"logement_id,expediteur"});
    if(S.fil.length){
      const lignesFil=S.fil.slice(0,300).map(f=>{const {id,d,fait,type,...reste}=f;return {id,logement_id:lig.id,type:type||"info",horodatage:d||now(),fait:!!fait,donnees:reste}});
      await supa.from("fil_activite").upsert(lignesFil,{onConflict:"id"});
    }
    await supa.from("etat_logement").upsert({logement_id:lig.id,etat:{nees:S.nees,questionsPosees:S.questionsPosees,dernierJour:S.dernierJour,reserveServie:S.reserveServie},maj_le:new Date().toISOString()},{onConflict:"logement_id"});
  }catch(e){ /* réessaiera au prochain enregistrement, ou à la reconnexion */ }
  pousserTout_actif=false;
  if(pousserTout_rejoue){pousserTout_rejoue=false;syncDiffere()}
}

<script>
/* ================= pièces ================= */
function creerPieces(){
  S.pieces=[];
  const c=S.comptage;
  const ordre=[...TYPES_PIECES.map(t=>t.type),...AUTRES_PIECES.map(t=>t.type)];
  ordre.forEach(type=>{
    const n=c[type]||0;const def=[...TYPES_PIECES,...AUTRES_PIECES].find(t=>t.type===type);
    for(let i=1;i<=n;i++){S.pieces.push({id:uid(),type,nom:n>1?`${def.nom} ${i}`:def.nom,photos:[]})}
  });
}
const pieceParId=id=>S.pieces.find(p=>p.id===id);
const pieceALaLumiere=p=>S.equipements.some(e=>e.piece===p.id)||S.docs.some(d=>d.piece===p.id)||p.photos.length>0;
const nomPiece=id=>id==="maison"?"la maison entière":(pieceParId(id)?.nom||"la maison");
/* ================= reconnaissance réelle (Claude, via la fonction Edge extract-document) ================= */
function fileVersBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result||"").split(",")[1]||"");
    r.onerror=()=>reject(r.error);
    r.readAsDataURL(file);
  });
}
async function reconnaitre(file,pieceId,dataUrl,pdf,chemin){
  const rec={id:uid(),date:now(),img:dataUrl||null,pdf:!!pdf,chemin:chemin||null,statut:"propose",pieceId:pieceId||S.pieceCourante||"maison"};
  if(!supa||!file){rec.k="inconnu";rec.titre="Photo non reconnue";return rec}
  try{
    const fileBase64=await fileVersBase64(file);
    const mimeType=file.type||(pdf?"application/pdf":"image/jpeg");
    const {data,error}=await supa.functions.invoke("extract-document",{body:{fileBase64,mimeType}});
    const c=(!error&&data&&data.fields)?data.fields:null;
    if(c&&c.kind==="equipement"){
      Object.assign(rec,{k:"equip",nom:c.nom||"Équipement",marque:c.marque||"",modele:c.modele||"",ref:c.ref||"",
        achat:today(),garantie:"",installateur:"",notice:false,sav:"",etat:"bon",entretien:false});
    }else if(c&&c.kind==="document"){
      Object.assign(rec,{k:"doc",type:c.type||"autre",titre:c.titre||"Document",date:c.date_document||today(),
        fournisseur:c.fournisseur||"",montant:c.montant_ttc??null,lie:"",travaux:"",garantie:""});
    }else{
      rec.k="inconnu";rec.titre="Photo non reconnue";
    }
  }catch(e){rec.k="inconnu";rec.titre="Photo non reconnue"}
  return rec;
}
function equipParLie(lie){ // retrouve l'équipement visé par un document, par identifiant ou par nom (au cas où il a été renommé)
  if(!lie)return null;
  return S.equipements.find(x=>x.id===lie)||S.equipements.find(x=>slug(x.nom)===slug(lie));
}
function docsLies(e){ // les documents reliés à cet équipement, par identifiant ou par nom
  return S.docs.filter(d=>d.lie&&(d.lie===e.id||slug(d.lie)===slug(e.nom)));
}
function ranger(rec){ // C'est bien ça
  const nees=[];
  if(rec.k==="equip"){
    const e={id:rec.id,piece:rec.pieceId,nom:rec.nom,marque:rec.marque,modele:rec.modele,ref:rec.ref,achat:rec.achat,garantie:rec.garantie,installateur:rec.installateur||"",notice:rec.notice,sav:rec.sav,etat:rec.etat,entretien:!!rec.entretien,img:rec.img,pdf:!!rec.pdf,chemin:rec.chemin||null,date:rec.date,entretiens:rec.entretien?[{d:rec.achat,par:rec.installateur}]:[]};
    S.equipements.push(e);
    // les documents déjà rangés qui le visaient par son nom (arrivés avant lui) se relient à lui pour de bon
    S.docs.forEach(d=>{if(d.lie&&d.lie!==e.id&&slug(d.lie)===slug(e.nom))d.lie=e.id});
    if(rec.installateur)connaitrePro(rec.installateur,`Installation : ${rec.nom.toLowerCase()}`,rec.achat);
    if(rec.entretien)S.rappels.push({id:uid(),t:`L'entretien annuel de ${lc(rec.nom)} est à faire ce mois-ci.`,equip:e.id,pro:rec.installateur||"",du:today(),fait:false});
    if(rec.garantie&&joursDepuis(rec.garantie)<0&&joursDepuis(rec.garantie)>-200)S.rappels.push({id:uid(),t:`La garantie de ${lc(rec.nom)} ${rec.marque} expire le ${dateFr(rec.garantie)}.`,equip:e.id,du:rec.garantie,fait:false,info:true});
  }else if(rec.k==="doc"){
    const cible=rec.lie?equipParLie(rec.lie):null; // si l'équipement existe déjà, on relie par identifiant tout de suite
    const d={id:rec.id,piece:rec.pieceId,type:rec.type,titre:rec.titre,date:rec.date,fournisseur:rec.fournisseur,montant:rec.montant,lie:cible?cible.id:(rec.lie||""),travaux:rec.travaux||"",garantie:rec.garantie||"",img:rec.img,pdf:!!rec.pdf,chemin:rec.chemin||null,recu:rec.recu||"photo",dateRecu:rec.date0||rec.date};
    S.docs.push(d);
    if(rec.fournisseur&&RESERVE.pros[rec.fournisseur])connaitrePro(rec.fournisseur,rec.travaux?rec.travaux:(rec.type==="facture"?"Facture reçue":"Document reçu"),rec.date);
    if(rec.travaux){let t=S.travaux.find(t=>t.titre===rec.travaux);if(!t){t={id:uid(),titre:rec.travaux,par:rec.fournisseur,date:rec.date,montant:0,docs:[]};S.travaux.push(t)}t.docs.push(d.id);if(rec.type==="facture")t.montant=rec.montant;if(rec.date>t.date)t.date=rec.date}
  }
  if(rec.pieceId&&rec.pieceId!=="maison"&&rec.img){const p=pieceParId(rec.pieceId);if(p&&p.photos.length<6)p.photos.push(rec.img)}
  else if(rec.pieceId&&rec.pieceId!=="maison"){const p=pieceParId(rec.pieceId);if(p)p.photos.push(null)}
}
const lc=s=>s.charAt(0).toLowerCase()+s.slice(1);
function connaitrePro(nom,motif,date){
  let p=S.pros.find(p=>p.nom===nom);
  const ref=RESERVE.pros[nom]||{metier:"Professionnel",tel:"",mail:"",ville:""};
  if(!p){p={id:uid(),nom,...ref,interventions:[],avis:[]};S.pros.push(p)}
  if(!p.interventions.some(i=>i.motif===motif&&i.d===date))p.interventions.push({d:date,motif});
  p.interventions.sort((a,b)=>b.d.localeCompare(a.d));
  return p;
}

/* ================= les cartes, et leur naissance ================= */
const CARTES=[
  {id:"adresse",nom:"Adresse VIDOM",ico:"mail",quand:"",sub:()=>S.logement.depot,nee:()=>true},
  {id:"equipements",nom:"Équipements",ico:"outil",quand:"à la première étiquette ou facture d'appareil reconnue",sub:()=>"Notices, garanties, service après-vente",nee:()=>S.equipements.length>0,n:()=>S.equipements.length},
  {id:"documents",nom:"Documents",ico:"doc",quand:"au premier document gardé",sub:()=>"Tout ce qui est conservé",nee:()=>S.docs.length>0,n:()=>S.docs.length},
  {id:"artisans",nom:"Les artisans de la maison",ico:"gens",quand:"au premier professionnel connu",sub:()=>S.pros.slice(0,3).map(p=>p.nom).join(", "),nee:()=>S.pros.length>0,n:()=>S.pros.length},
  {id:"travaux",nom:"Travaux",ico:"travaux",quand:"au premier devis",sub:()=>"Chantiers, devis, ce que ça a coûté",nee:()=>S.travaux.length>0,n:()=>S.travaux.length},
  {id:"echanges",nom:"Échanges et accès",ico:"echanges",quand:"au premier accès ouvert à un tiers",sub:()=>"Qui voit quoi, pour combien de temps",nee:()=>S.acces.length>0,n:()=>S.acces.filter(a=>a.ouvert).length},
  {id:"transmission",nom:"Transmission",ico:"cle",quand:"le jour où la maison change de mains",sub:()=>"Les dossiers, le livre du logement",nee:()=>!!S.transmission},
];
const carteNee=id=>CARTES.find(c=>c.id===id).nee();
function naissances(){ // annonce dans le fil ce qui vient d'apparaître
  const nouvelles=[];
  CARTES.forEach(c=>{if(c.nee()&&!S.nees.includes(c.id)){S.nees.push(c.id);nouvelles.push(c)}});
  if(nouvelles.length){
    const noms=nouvelles.map(c=>c.nom);
    const t=nouvelles.length===1?`Une rubrique vient d'apparaître : ${noms[0]}.`:`${["","","Deux","Trois","Quatre","Cinq","Six"][nouvelles.length]||nouvelles.length} rubriques viennent d'apparaître : ${noms.slice(0,-1).join(", ")} et ${noms.at(-1)}.`;
    filAjouter({type:"naissance",t,go:"#/carte/"+nouvelles[0].id,ico:"maison"});
  }
  return nouvelles;
}

/* ================= le fil ================= */
function filAjouter(e){const x={id:uid(),d:now(),fait:false,...e};S.fil.unshift(x);save();return x}
function filDecider(id,choix){
  const e=S.fil.find(x=>x.id===id);if(!e)return;
  if(e.type==="recu"){
    const rec=e.rec;
    if(choix==="garder"){rec.recu="adresse";ranger(rec);naissances();e.fait=true;e.t2=`Gardé : ${rec.titre||rec.nom}.`;
      if(!S.expediteursOk.includes(rec.fournisseur)&&!e.inconnu){e.propose=rec.fournisseur}
      toast("Gardé dans la mémoire de la maison");}
    else{e.fait=true;e.t2="Refusé. Rien n'est entré.";}
  }else if(e.type==="rappel"){
    const r=S.rappels.find(r=>r.id===e.rappel);
    if(choix==="fait"){if(r){r.fait=true;r.du=shiftDate(today(),365)}e.fait=true;e.t2="Noté. Prochain rappel dans un an. Vous pourrez photographier la facture quand elle arrive.";toast("Déjà fait, noté")}
    else if(choix==="rappeler"){contacter(r?.pro||"");return}
  }else if(e.type==="question"){
    if(e.q==="annexes"){e.fait=true;e.t2=choix==="oui"?"Ajoutez-la depuis Ma maison, en deux gestes.":"Très bien.";if(choix==="oui"){save();route("#/maison");return}}
    else if(e.q==="notaire"){if(choix==="partager"){partagerAdresse();return}e.fait=true;e.t2="Vous pourrez le faire plus tard depuis Ma maison."}
    else if(e.q==="manque"){if(choix==="demander"){demanderA("Diagnostic Émeraude","le diagnostic électrique");return}e.fait=true;e.t2="Très bien. La question reviendra quand ce sera utile."}
  }
  save();render();
}
function toujoursAccepter(id,oui){const e=S.fil.find(x=>x.id===id);if(!e)return;if(oui&&e.propose&&!S.expediteursOk.includes(e.propose))S.expediteursOk.push(e.propose);e.propose=null;e.t3=oui?"Ce que cet expéditeur enverra sera gardé sans vous le demander. Vous pourrez changer d'avis dans les réglages.":"";save();render()}

/* rappels dus → une seule entrée visible à la fois */
function pousserRappels(){
  const dus=S.rappels.filter(r=>!r.fait&&r.du<=today()&&!S.fil.some(e=>e.type==="rappel"&&e.rappel===r.id&&!e.fait));
  const dejaUn=S.fil.some(e=>e.type==="rappel"&&!e.fait);
  if(dus.length&&!dejaUn){const r=dus[0];filAjouter({type:"rappel",t:r.t,rappel:r.id,pro:r.pro||"",ico:"cloche",info:!!r.info})}
}

/* une question du jour, les premiers jours seulement */
const QUESTIONS=[
  {q:"annexes",t:"Avez-vous un parking, une cave ou une annexe ?",boutons:[["Oui, ajouter","oui"],["Non","non"]]},
  {q:"notaire",t:"Votre notaire a-t-il l'adresse VIDOM de la maison ? Ce qu'il y enverra arrivera ici.",boutons:[["Partager l'adresse","partager"],["Plus tard","plus-tard"]]},
  {q:"manque",t:"Il manque le diagnostic électrique. Le demander au diagnostiqueur ?",boutons:[["Demander","demander"],["Plus tard","plus-tard"]],cond:()=>S.docs.length>=3&&!S.docs.some(d=>d.titre==="Diagnostic électrique")},
];
function questionDuJour(){
  if(!S.cree)return;
  if(S.dernierJour===today())return;
  const enAttente=S.fil.some(e=>e.type==="question"&&!e.fait);
  if(enAttente){S.dernierJour=today();return}
  const q=QUESTIONS.find(q=>!S.questionsPosees.includes(q.q)&&(!q.cond||q.cond()));
  S.dernierJour=today();
  if(q){S.questionsPosees.push(q.q);filAjouter({type:"question",q:q.q,t:q.t,boutons:q.boutons,ico:"bulle"})}
  save();
}

/* souvenirs : les anniversaires */
function souvenirs(){
  S.fil.filter(e=>e.type==="souvenir"&&e.orig).forEach(()=>{});
}

/* ================= demander à la maison, réellement (Claude, via demander-maison) ================= */
function memoireLogement(){ // résumé compact des vraies données du logement, sans images ni URLs
  return {
    logement:{nom:S.logement.nom,adresse:S.logement.adresse,ville:S.logement.ville,annee:S.logement.annee,
      surface:S.logement.surface,dpe:S.logement.dpe,dpeDate:S.logement.dpeDate,depot:S.logement.depot},
    docs:S.docs.map(d=>({id:d.id,titre:d.titre,type:d.type,date:d.date,fournisseur:d.fournisseur,montant:d.montant,garantie:d.garantie,travaux:d.travaux})),
    equipements:S.equipements.map(e=>({id:e.id,nom:e.nom,marque:e.marque,modele:e.modele,achat:e.achat,garantie:e.garantie,installateur:e.installateur,etat:e.etat,notice:e.notice,entretien:e.entretien})),
    pros:S.pros.map(p=>({id:p.id,nom:p.nom,metier:p.metier,interventions:p.interventions})),
    travaux:S.travaux.map(t=>({id:t.id,titre:t.titre,par:t.par,date:t.date,montant:t.montant})),
  };
}
async function demander(texte){
  const q=(texte||"").trim();if(!q)return;
  const e={type:"qa",q,fait:true,ico:"bulle"};
  if(!supa){e.rep="Indisponible pour l'instant.";e.manque=true;filAjouter(e);return}
  try{
    const {data,error}=await supa.functions.invoke("demander-maison",{body:{question:q,memoire:memoireLogement()}});
    if(error||!data||typeof data.rep!=="string"){e.rep="Cela n'a pas fonctionné, réessayez.";e.manque=true}
    else{
      e.rep=data.rep;e.manque=!!data.manque;
      if(data.refType==="doc"&&S.docs.some(d=>d.id===data.refId))e.doc=data.refId;
      else if(data.refType==="equip"&&S.equipements.some(x=>x.id===data.refId))e.equip=data.refId;
      else if(data.refType==="pro"&&S.pros.some(p=>p.id===data.refId))e.pro=data.refId;
    }
  }catch(err){e.rep="Cela n'a pas fonctionné, réessayez.";e.manque=true}
  filAjouter(e);
}
function suggestionsDuMoment(){
  const s=[];
  if(S.docs.some(d=>d.travaux))s.push("Quand a-t-on refait la toiture ?");
  if(S.equipements.some(e=>e.nom==="Four"))s.push("Où est la notice du four ?");
  if(S.equipements.some(e=>e.nom==="Chaudière gaz"))s.push("Qui est venu pour la chaudière ?");
  if(S.docs.some(d=>d.type==="diagnostic"))s.push("Quel est le DPE ?");
  if(S.equipements.length)s.push("Quelles garanties expirent bientôt ?");
  if(S.docs.some(d=>d.type==="acte"))s.push("Quand la maison a-t-elle été achetée ?");
  if(!s.length)s.push("Quelle est la surface de la maison ?","En quelle année a-t-elle été construite ?","Où est l'adresse VIDOM ?");
  return s.slice(0,3);
}

  const p=S.pros.find(p=>p.nom===nom)||{nom:nom||"un professionnel",tel:"",mail:"",metier:""};
  modal(`<h2>${p.tel?"Appeler":"Écrire à"} ${h(p.nom)}</h2><p class="muted">${h(p.metier)}${p.ville?" · "+h(p.ville):""}</p>
    <div class="stack">${p.tel?`<a class="btn primary big" href="tel:${p.tel.replace(/\s/g,"")}">${I.telephone} ${h(p.tel)}</a>`:""}
    ${p.mail?`<a class="btn big" href="mailto:${p.mail}?subject=${encodeURIComponent("Maison des Tilleuls — "+(p.metier||"demande"))}">${I.mail} Écrire un courriel</a>`:""}</div>
    <p class="small faint">Le message part de votre messagerie, pas de VIDOM. L'artisan que la maison connaît passe toujours avant un inconnu.</p>
    <button class="btn" onclick="closeModal()">Fermer</button>`);
}
function demanderA(nom,quoi){
  const ref=RESERVE.pros[nom]||{};
  const txt=`Bonjour,\n\nPourriez-vous m'envoyer ${quoi} concernant la maison du ${S.logement.adresse}, ${S.logement.cp} ${S.logement.ville} ?\n\nVous pouvez l'adresser directement à la mémoire de la maison : ${S.logement.depot}\n\nAvec mes remerciements,\n${S.compte.email}`;
  modal(`<h2>Demander ${h(quoi)}</h2><p class="muted">À ${h(nom)}${ref.metier?", "+h(ref.metier).toLowerCase():""}. Relisez, puis envoyez depuis votre messagerie.</p>
    <textarea class="input" id="dem" rows="8">${h(txt)}</textarea>
    <div class="row"><a class="btn primary grow" href="mailto:${ref.mail||""}?subject=${encodeURIComponent("Demande — "+quoi)}&body=${encodeURIComponent(txt)}" onclick="demandeEnvoyee('${h(nom)}','${h(quoi)}')">${I.envoi} Envoyer</a><button class="btn" onclick="closeModal()">Annuler</button></div>`);
}
function demandeEnvoyee(nom,quoi){closeModal();const e=S.fil.find(x=>x.type==="question"&&x.q==="manque"&&!x.fait);if(e){e.fait=true;e.t2=`Demandé à ${nom} le ${dateFr(today())}. La réponse arrivera par l'adresse VIDOM.`}filAjouter({type:"info",t:`Demande envoyée à ${nom} : ${quoi}. Vous serez prévenu quand la réponse arrivera.`,ico:"envoi",fait:true});S.rappels.push({id:uid(),t:`${nom} n'a pas encore répondu pour ${quoi}. Relancer ?`,pro:nom,du:shiftDate(today(),14),fait:false});save();render();toast("Demande envoyée")}
function partagerAdresse(){
  const a=S.logement.depot;
  const texte=`Voici l'adresse de la mémoire de ma maison (${S.logement.adresse}, ${S.logement.ville}) : ${a}. Tout ce que vous y enverrez y sera conservé, avec mon accord.`;
  if(navigator.share){navigator.share({title:"Adresse VIDOM",text:texte}).then(()=>adressePartagee()).catch(()=>{})}
  else{modal(`<h2>Partager l'adresse</h2><p class="muted">Copiez-la, ou envoyez-la depuis votre messagerie.</p><div class="card"><span class="mono">${h(a)}</span></div>
    <div class="row wrap"><button class="btn primary grow" onclick="copier('${h(a)}');adressePartagee();closeModal()">Copier</button><a class="btn grow" href="mailto:?subject=${encodeURIComponent("L'adresse de la mémoire de ma maison")}&body=${encodeURIComponent(texte)}" onclick="adressePartagee();closeModal()">${I.mail} Par courriel</a></div>
    <button class="btn ghost" onclick="closeModal()">Fermer</button>`)}
}
function adressePartagee(){const e=S.fil.find(x=>x.type==="question"&&x.q==="notaire"&&!x.fait);if(e){e.fait=true;e.t2="Adresse partagée. Ce qui arrivera sera proposé ici, rien n'entrera sans vous."}save();render()}
function copier(t){try{navigator.clipboard.writeText(t);toast("Copié")}catch(e){toast("Sélectionnez et copiez l'adresse")}}

/* La réception par l'adresse VIDOM est désormais réelle : c'est la fonction Edge receive-email qui
   insère directement dans fil_activite (type "recu", avec le même rec que produisait cette fonction
   avant) dès qu'un e-mail arrive vraiment. hydrate() la relit comme n'importe quelle autre entrée du
   fil, et filDecider() (déjà en place) reste le seul endroit qui range vraiment le document. */
</script>
<script>
/* ================= le dessin de la maison ================= */
function dessinMaison(opts={}){
  const rooms=S.pieces;const n=rooms.length;
  if(!n)return `<p class="small faint" style="text-align:center">Aucune pièce. Ajoutez-en une.</p>`;
  const per=n>9?4:3,bw=per===4?66:88,bh=50,gx=8,gy=8;const rows=Math.ceil(n/per);
  const W=per*bw+(per-1)*gx,H=rows*bh+(rows-1)*gy;const x0=(320-W)/2,y0=48,top=y0+H+10;
  const F='font-family="Source Sans 3, system-ui, sans-serif"';
  let s=`<svg class="house" viewBox="0 0 320 ${top+8}" style="max-width:${opts.mw||300}px" role="img" aria-label="${n} pièces">`;
  s+=`<path d="M${x0-20} ${y0-6} L160 ${y0-40} L${x0+W+20} ${y0-6}" fill="none" stroke="#50575E" stroke-width="2.5" stroke-linejoin="round"/><path d="M${x0-6} ${y0-8} L160 ${y0-34} L${x0+W+6} ${y0-8} Z" fill="#EFE6D8"/>`;
  rooms.forEach((p,i)=>{
    const r=Math.floor(i/per),c=i%per,cnt=Math.min(per,n-r*per),off=(W-(cnt*bw+(cnt-1)*gx))/2;
    const x=x0+off+c*(bw+gx),y=y0+r*(bh+gy);
    const lit=pieceALaLumiere(p),sel=opts.sel===p.id;const nom=p.nom.length>12?p.nom.slice(0,11)+"…":p.nom;const fs=p.nom.length>10?11:12;
    const go=opts.click===false?"":`onclick="location.hash='#/piece/${p.id}'"`;
    if(sel)s+=`<g ${go}><rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="6" fill="#F4E3DB" stroke="#C9775B" stroke-width="2.5"/><text x="${x+bw/2}" y="${y+bh/2+4}" text-anchor="middle" font-size="${fs}" font-weight="600" fill="#A85F45" ${F}>${h(nom)}</text></g>`;
    else if(lit)s+=`<g ${go}><rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="6" fill="#E4EBE6" stroke="#5F7A6A" stroke-width="2"/><text x="${x+bw/2}" y="${y+bh/2+4}" text-anchor="middle" font-size="${fs}" font-weight="600" fill="#4A6255" ${F}>${h(nom)}</text></g>`;
    else s+=`<g ${go}><rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="6" fill="#FFFDF9" stroke="#D8C8B2" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${x+bw/2}" y="${y+bh/2+4}" text-anchor="middle" font-size="${fs}" fill="#B5B0A5" ${F}>${h(nom)}</text></g>`;
  });
  s+=`<line x1="${x0-20}" y1="${top}" x2="${x0+W+20}" y2="${top}" stroke="#50575E" stroke-width="2.5" stroke-linecap="round"/></svg>`;
  return s;
}
function phraseCourte(){const n=S.pieces.length,l=S.pieces.filter(pieceALaLumiere).length;return n?`${l} sur ${n} pièce${n>1?"s":""}`:""}
function phrasePieces(){
  const n=S.pieces.length,l=S.pieces.filter(pieceALaLumiere).length;
  if(!n)return"";
  if(l===0)return `${n} pièce${n>1?"s":""}. Elles s'allumeront à mesure.`;
  if(l===n)return `${n} pièce${n>1?"s":""} sur ${n}. Toute la maison est connue.`;
  const reste=S.pieces.filter(p=>!pieceALaLumiere(p));
  const r=reste.length===1?`il reste ${lc(reste[0].nom)}`:(reste.every(p=>p.type==="chambre")?"les chambres attendent":`il en reste ${reste.length}`);
  return `${l} pièce${l>1?"s":""} sur ${n} · ${r}`;
}
function qrSvg(texte){
  try{const q=qrcode(0,"L");q.addData(texte);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){return `<div class="small faint">QR</div>`}
}

const V={};
V.bienvenue=()=>`<div class="view center fadein" style="gap:24px">

V.compte=()=>`<div class="view center fadein" style="gap:18px">
  <div class="stack"><h1 class="h">Votre compte.</h1><p class="muted">Pour retrouver votre maison sur tous vos appareils, et pour que personne d'autre n'y entre.</p></div>
  <form class="stack" style="gap:14px" onsubmit="event.preventDefault();compteOk()">
    <label class="f"><span>Votre adresse de courriel</span><input class="input" id="email" type="email" autocomplete="email" inputmode="email" value="${h(S.compte.email)}" placeholder="vous@exemple.fr" required></label>
    <label class="f"><span>Votre mot de passe</span><div class="row"><input class="input" id="mdp" type="password" autocomplete="new-password" placeholder="Au moins 8 caractères" minlength="8" required><button type="button" class="btn sm" onclick="const m=document.getElementById('mdp');m.type=m.type==='password'?'text':'password';this.textContent=m.type==='password'?'Afficher':'Masquer'">Afficher</button></div></label>
    <button class="btn primary big" type="submit">Créer un compte ${I.fleche}</button>
  </form>
  <button class="btn ghost" onclick="mdpOublie()">Mot de passe oublié ?</button>
  <p class="small faint" style="text-align:center">Vous avez déjà un compte ? Ressaisissez simplement votre adresse et votre mot de passe ci-dessus : VIDOM vous reconnaîtra et retrouvera votre maison.</p>
</div>`;
async function compteOk(){
  const email=document.getElementById("email").value.trim();const mdp=document.getElementById("mdp").value;
  if(!supa){S.compte.email=email;S.etape="adresse";save();render();return}
  toast("Un instant…");
  try{
    const {data,error}=await supa.auth.signUp({email,password:mdp});
    // ce courriel a peut-être déjà un compte : Supabase le signale parfois par une erreur, parfois (pour ne rien révéler) par un utilisateur sans aucune identité
    const dejaExistant=(error&&/registered/i.test(error.message))||(data&&data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0);
    if(dejaExistant){
      const r2=await supa.auth.signInWithPassword({email,password:mdp});
      if(r2.error){modal(`<h2>Ce mot de passe ne correspond pas</h2><p class="muted">Un compte existe déjà pour ${h(email)}, mais ce mot de passe-là ne fonctionne pas pour ce compte. Vérifiez-le (touchez « Afficher » pour le voir en clair), ou recevez un lien pour en choisir un nouveau.</p><button class="btn primary big" onclick="closeModal()">Réessayer</button><button class="btn ghost" onclick="closeModal();mdpOublie()">Mot de passe oublié</button>`);return}
      S.compte.email=email;await hydrate();
      if(S.cree)route("#/fil");else{S.etape="adresse";save();render()}
      return;
    }
    if(error){toast("Cela n'a pas fonctionné : "+error.message);return}
    S.compte.email=email;
    if(data&&data.session){S.etape="adresse";save();render()}
    else modal(`<h2>Vérifiez votre boîte de courriel</h2><p class="muted">VIDOM a envoyé un lien de confirmation à ${h(email)}. Une fois confirmé, revenez ici et retapez votre adresse et votre mot de passe.</p><button class="btn primary big" onclick="closeModal()">Compris</button>`);
  }catch(e){toast("Cela n'a pas fonctionné. Vérifiez votre connexion.")}
}
function mdpOublie(){const m=document.getElementById("email")?.value||"";modal(`<h2>Mot de passe oublié</h2><p class="muted">VIDOM vous envoie un courriel avec un lien pour en choisir un nouveau.</p><label class="f"><span>Votre adresse de courriel</span><input class="input" id="em2" type="email" value="${h(m)}"></label><button class="btn primary big" onclick="mdpOublieOk()">Envoyer le lien</button><button class="btn ghost" onclick="closeModal()">Annuler</button>`)}
async function mdpOublieOk(){
  const email=document.getElementById("em2").value.trim();if(!email){toast("Votre adresse de courriel, d'abord.");return}
  if(!supa){closeModal();toast("Courriel envoyé (simulé). Regardez votre boîte.");return}
  try{const {error}=await supa.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+"#/reinitialiser"});closeModal();toast(error?("Cela n'a pas fonctionné : "+error.message):"Courriel envoyé, si ce compte existe. Regardez votre boîte.")}
  catch(e){closeModal();toast("Cela n'a pas fonctionné.")}
}
V.adresse=()=>{
  const c=S.comptage;
  const ligne=(t,nom)=>`<div class="step"><span>${h(nom)}</span><span class="ctl"><button aria-label="Moins" onclick="compter('${t}',-1)">${I.moins}</button><b class="num">${c[t]||0}</b><button aria-label="Plus" onclick="compter('${t}',1)">${I.plus}</button></span></div>`;
  return `<div class="view fadein" style="gap:18px;padding-top:10px">
  <h1 class="h">Quelle est l'adresse de votre logement ?</h1>
  <div style="position:relative"><input class="input" id="adr" placeholder="Numéro, rue, ville" value="${h(S.logement.adresseSaisie||"")}" oninput="suggerer(this.value)" autocomplete="street-address"><div id="sugg"></div></div>
  <div class="stack" style="gap:2px"><h2>Et combien de pièces ?</h2><p class="small muted">Une estimation suffit, vous pourrez ajuster.</p></div>
  <div class="card" style="gap:0;padding:4px 16px">
    ${TYPES_PIECES.map(t=>ligne(t.type,t.nom)).join("")}
    ${AUTRES_PIECES.filter(t=>c[t.type]).map(t=>ligne(t.type,t.nom)).join("")}
    <div class="step" style="border:0"><button class="btn ghost" style="padding:0;gap:8px" onclick="autrePiece()">${I.plus} Autre pièce (bureau, cave, jardin…)</button></div>
  </div>
  <button class="btn primary big" onclick="adresseOk()">Valider</button>
  <p class="small faint" style="text-align:center">Deux minutes. Rien à remplir d'autre.</p>
</div>`};
function compter(t,d){S.comptage[t]=Math.max(0,(S.comptage[t]||0)+d);save();render();}
function autrePiece(){modal(`<h2>Une autre pièce</h2><div class="row wrap">${AUTRES_PIECES.map(t=>`<button class="chip btn-chip ${S.comptage[t.type]?"on":""}" onclick="S.comptage['${t.type}']=(S.comptage['${t.type}']||0)+1;save();closeModal();render()">${h(t.nom)}</button>`).join("")}</div><button class="btn ghost" onclick="closeModal()">Fermer</button>`)}
let banSuggestions=[],suggererTimer=null;
function suggerer(v){
  const box=document.getElementById("sugg");S.logement.adresseSaisie=v;
  clearTimeout(suggererTimer);
  if(v.trim().length<3){box.innerHTML="";banSuggestions=[];return}
  suggererTimer=setTimeout(async()=>{
    banSuggestions=await chercherAdresses(v.trim());
    if((document.getElementById("adr")?.value||"")!==v)return; // la saisie a changé entre-temps
    box.innerHTML=banSuggestions.length?`<div class="card" style="position:absolute;left:0;right:0;top:60px;z-index:5;padding:6px 8px;gap:0">${banSuggestions.map((f,i)=>`<button class="line" style="width:100%;text-align:left" onclick="choisirAdresse(${i})">${I.maison}<span style="flex:1 1 auto">${h(f.properties.label)}</span></button>`).join("")}</div>`:"";
  },300);
}
function choisirAdresse(i){
  const f=banSuggestions[i];if(!f)return;
  document.getElementById("adr").value=f.properties.label;
  S.logement.adresseSaisie=f.properties.label;
  S.logement._ban=f;
  document.getElementById("sugg").innerHTML="";save();
}
async function adresseOk(){
  const v=(document.getElementById("adr")?.value||S.logement.adresseSaisie||"").trim();
  if(!v){toast("L'adresse, d'abord.");document.getElementById("adr")?.focus();return}
  if(!Object.values(S.comptage).some(n=>n>0)){toast("Au moins une pièce.");return}
  S.logement.id=S.logement.id||uid();
  const f=S.logement._ban&&S.logement._ban.properties&&S.logement._ban.properties.label===v?S.logement._ban:null;
  if(f){
    const p=f.properties;
    S.logement.adresse=p.name||v;S.logement.cp=p.postcode||"";S.logement.ville=p.city||"";
    const coord=f.geometry&&f.geometry.coordinates;
    S.logement.longitude=coord?coord[0]:null;S.logement.latitude=coord?coord[1]:null;
  }else{ // pas de suggestion choisie : on garde ce qui est tapé, sans deviner de champs qu'on n'a pas
    const m=v.match(/^(.*?),?\s*(\d{5})?\s*([^\d,]*)$/);
    S.logement.adresse=(m&&m[1]||v).trim().replace(/,$/,"")||v;S.logement.cp=(m&&m[2])||"";S.logement.ville=(m&&m[3]||"").trim();
  }
  const rue=S.logement.adresse.replace(/^\d+\s*(bis|ter)?\s*/i,"").replace(/^(rue|avenue|boulevard|impasse|chemin|allée|place|route)\s+(de\s|des\s|du\s|d'|de la\s|de l')?/i,"");
  S.logement.nom=S.logement.nom||`Maison ${/^[aeiouy]/i.test(rue)?"de l'":"des "}${rue.charAt(0).toUpperCase()+rue.slice(1)}`;
  toast("VIDOM vérifie l'adresse…");
  S.logement.depot=await allouerDepot(S.logement.nom);
  await enrichirAdresse();
  if(!S.logements.some(l=>l.id===S.logement.id))S.logements.push({id:S.logement.id,nom:S.logement.nom,ville:S.logement.ville,adresse:S.logement.adresse});
  creerPieces();S.etape="maison-adresse";save();render();
}

  ${desk?porte("fichier","Importer","Depuis votre ordinateur, ou glissez vos fichiers n'importe où sur la page.",true,`<input type="file" accept="image/*,.pdf" multiple onchange="fichiers(this.files,'maison')">`):porte("camera","Photographier","Des factures, des documents, un classeur entier — ou vos appareils, si vous n'avez pas de factures.",true,`<input type="file" accept="image/*" capture="environment" multiple onchange="fichiers(this.files,'maison')">`)}

  ${desk?porte("camera","Photographier","Avec la caméra de l'ordinateur, ou continuez sur votre téléphone.",false,`<input type="file" accept="image/*" capture="environment" multiple onchange="fichiers(this.files,'maison')">`):porte("fichier","Importer","Depuis votre téléphone, Dropbox ou Google Drive.",false,`<input type="file" accept="image/*,.pdf" multiple onchange="fichiers(this.files,'maison')">`)}
  ${desk?`<div class="card" style="flex-direction:row;align-items:center;gap:14px"><div class="qr" style="width:72px;height:72px">${qrSvg(location.href.split("#")[0])}</div><span class="small muted">Continuez sur votre téléphone : ouvrez ce code, votre maison vous y attend.</span></div>`:""}

/* ================= fichiers → photos → reconnaissance ================= */
async function televerser(blob,ext,mime){ // dépose le fichier dans le vrai stockage VIDOM ; renvoie null si indisponible (compte non connecté, hors ligne…)
  if(!supa||!S.logement.id)return null;
  try{
    const chemin=`${S.logement.id}/${uid()}.${ext}`;
    const {error}=await supa.storage.from("logement-files").upload(chemin,blob,{contentType:mime,upsert:false});
    if(error)return null;
    const {data}=await supa.storage.from("logement-files").createSignedUrl(chemin,60*60*24*30);
    if(!data||!data.signedUrl)return null;
    return {chemin,url:data.signedUrl};
  }catch(e){return null}
}
function reduire(file){return new Promise(res=>{
  if(file.type==="application/pdf"){ // gardé tel quel : c'est le vrai document, pas une photo à réduire
    televerser(file,"pdf","application/pdf").then(t=>{
      if(t){res({url:t.url,pdf:true,chemin:t.chemin});return}
      const fr=new FileReader();fr.onload=()=>res({url:fr.result,pdf:true,chemin:null});fr.onerror=()=>res(null);fr.readAsDataURL(file);
    });
    return;
  }
  if(!file.type.startsWith("image/")){res(null);return}
  const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{try{
    const max=520;let w=img.width,h2=img.height;const k=Math.min(1,max/Math.max(w,h2));w=Math.round(w*k);h2=Math.round(h2*k);
    const c=document.createElement("canvas");c.width=w;c.height=h2;c.getContext("2d").drawImage(img,0,0,w,h2);
    c.toBlob(blob=>{
      URL.revokeObjectURL(url);
      if(!blob){res({url:c.toDataURL("image/jpeg",.7),pdf:false,chemin:null});return}
      televerser(blob,"jpg","image/jpeg").then(t=>{
        if(t){res({url:t.url,pdf:false,chemin:t.chemin});return}
        res({url:c.toDataURL("image/jpeg",.7),pdf:false,chemin:null});
      });
    },"image/jpeg",.7);
  }catch(e){URL.revokeObjectURL(url);res(null)}};
  img.onerror=()=>{URL.revokeObjectURL(url);res(null)};img.src=url;
})}
async function fichiers(files,pieceId){
  const list=[...files].slice(0,30);if(!list.length)return;
  closeModal();toast(list.length>1?`${list.length} fichiers reçus. VIDOM regarde…`:"VIDOM regarde…");
  const trop=S.equipements.length+S.docs.length>40;
  const lot=[];
  for(const f of list){const r=trop?null:await reduire(f);const rec=await reconnaitre(f,pieceId,r&&r.url,r&&r.pdf,r&&r.chemin);rec.pieceId=rec.pieceId||pieceId||"maison";lot.push(rec)}
  if(pieceId&&pieceId!=="maison")S.pieceCourante=pieceId;
  if(lot.length===1){S.lot=lot;if(!S.cree){S.cree=true;S.etape="";S.ajout=false;S.retourVers=null}save();route("#/reconnu")}
  else terminerLot(lot);
}

async function poserQuestion(q){filtreFil="tout";await demander(q);render();setTimeout(()=>{const el=document.querySelector(".pane.right .view, .col .view");if(el)el.scrollIntoView({block:"start"})},50)}
function carteDoc(d){return `<a class="line" href="#/document/${d.id}" style="border:1px solid var(--bois-c);border-radius:12px;padding:10px 12px">${I.doc}<span class="stack" style="flex:1 1 auto;gap:0"><span class="b">${h(d.titre)}</span><span class="small muted">${d.montant?euros(d.montant)+" · ":""}${dateFr(d.date)}</span></span>${I.fleche}</a>`}

/* ================= ma maison ================= */

  return `<div class="view" style="gap:12px">
    <div class="split" style="align-items:flex-start"><div class="stack" style="gap:2px">${S.logements.length>1?`<button class="h" style="all:unset;cursor:pointer;font:inherit;font-size:1.45em;display:inline-flex;align-items:center;gap:6px" onclick="choisirLogement()" aria-label="Changer de logement">${h(L.nom)}<span style="opacity:.55;display:inline-flex;font-size:.7em">${I.bascule}</span></button>`:`<h1 class="h" style="font-size:1.45em">${h(L.nom)}</h1>`}<p class="small muted">${h(L.adresse)}, ${h(L.ville)}${L.annee?" · "+L.annee:""}${L.surface?" · "+L.surface+" m²":""}${L.dpe?" · DPE "+h(L.dpe):""} · <button class="btn ghost sm" style="padding:0;min-height:0" onclick="corrigerLogement()">Corriger</button></p></div>${isDesk()?"":`<a class="btn sm" href="#/reglages" aria-label="Réglages">${I.reglages}</a>`}</div>
    <div class="card" style="padding:12px 16px 8px;gap:6px">
      ${S.plan?`<img class="plan" src="${S.plan}" alt="Le plan de la maison">`:""}
      ${dessinMaison({mw:S.plan?220:300})}
      <p class="small b" style="text-align:center;color:var(--sauge-f)">${h(phrasePieces())}</p>
      <div class="row wrap" style="justify-content:center;gap:6px"><label class="btn sm file">${I.plan} ${S.plan?"Changer le plan":"Vous avez un plan ?"}<input type="file" accept="image/*" onchange="planFichier(this.files)"></label><button class="btn sm" onclick="ajouterPiece()">${I.plus} Une pièce</button></div>
    </div>
    ${cartes.map(carte).join("")}
    ${prochaine?`<${prochaine.id==="echanges"?'button onclick="choisirTiers()" style="text-align:left;width:100%"':"div"} class="card dash" style="flex-direction:row;align-items:center;gap:14px;padding:12px 16px"><span class="tile dash">${I.plus}</span><span class="small">${h(prochaine.nom)} apparaîtra ${h(prochaine.quand)}.${prochaine.id==="echanges"?" Ouvrir un accès ?":""}</span></${prochaine.id==="echanges"?"button":"div"}>`:""}
  </div>`;
};
function corrigerLogement(){const L=S.logement;modal(`<h2>Corriger</h2><p class="muted">Ce que VIDOM a trouvé à l'adresse. Vous restez seul maître de la mémoire de votre logement.</p><label class="f"><span>Nom de la maison</span><input class="input" id="ln" value="${h(L.nom)}"></label><div class="grid2"><label class="f"><span>Année</span><input class="input" id="la" inputmode="numeric" value="${L.annee||""}"></label><label class="f"><span>Surface (m²)</span><input class="input" id="ls" inputmode="numeric" value="${L.surface||""}"></label></div><label class="f"><span>Classe énergétique</span><select class="input" id="ld">${"ABCDEFG".split("").map(c=>`<option ${L.dpe===c?"selected":""}>${c}</option>`).join("")}<option value="" ${!L.dpe?"selected":""}>Inconnue</option></select></label><p class="small faint">Source : ce que VIDOM a trouvé à l'adresse${L.dpeDate?" (diagnostic du "+h(L.dpeDate)+")":""}.</p><button class="btn primary big" onclick="L=S.logement;L.nom=document.getElementById('ln').value.trim()||L.nom;L.annee=+document.getElementById('la').value||null;L.surface=+document.getElementById('ls').value||null;L.dpe=document.getElementById('ld').value;closeModal();save();render()">Enregistrer</button><button class="btn ghost" onclick="closeModal()">Annuler</button>`)}
async function planFichier(files){const f=files[0];if(!f)return;const img=await reduire(f);if(img&&img.url){S.plan=img.url;filAjouter({type:"info",t:"Le plan de la maison est conservé. Le dessin s'appuie dessus.",ico:"plan",fait:true});save();render();toast("Plan conservé")}}
function ajouterPiece(){modal(`<h2>Une pièce de plus</h2><div class="row wrap">${[...TYPES_PIECES,...AUTRES_PIECES].map(t=>`<button class="chip btn-chip" onclick="creerPiece('${t.type}','${h(t.nom)}')">${h(t.nom)}</button>`).join("")}</div><label class="f"><span>Ou un autre nom</span><div class="row"><input class="input" id="pn" placeholder="Atelier, véranda…"><button class="btn" onclick="creerPiece('autre',document.getElementById('pn').value.trim())">Ajouter</button></div></label><button class="btn ghost" onclick="closeModal()">Annuler</button>`)}
function creerPiece(type,nom){if(!nom)return;const n=S.pieces.filter(p=>p.type===type).length;const def=[...TYPES_PIECES,...AUTRES_PIECES].find(t=>t.type===type);
  if(def&&n===1){const p0=S.pieces.find(p=>p.type===type);if(p0.nom===def.nom)p0.nom=def.nom+" 1"}
  S.pieces.push({id:uid(),type,nom:def&&n>0?`${def.nom} ${n+1}`:nom,photos:[]});S.comptage[type]=(S.comptage[type]||0)+1;closeModal();save();render();toast("Pièce ajoutée")}

V.piece=id=>{
  const p=pieceParId(id);if(!p)return V.maison();

    ${!eqs.length&&!docs.length?`<div class="card soft"><p class="muted">Rien encore dans ${h(lc(p.nom))}. Photographiez un appareil, son étiquette, une facture.</p></div>`:""}
    ${eqs.length?`<div class="card" style="gap:0;padding:4px 16px"><p class="small b" style="padding:8px 0 4px;color:var(--sauge-f)">Équipements</p>${eqs.map(e=>`<a class="line" href="#/equipement/${e.id}">${I.outil}<span class="stack" style="flex:1 1 auto;gap:0"><span class="b">${h(e.nom)}</span><span class="small muted">${h(e.marque)} ${h(e.modele)}</span></span>${I.fleche}</a>`).join("")}</div>`:""}
    ${docs.length?`<div class="card" style="gap:0;padding:4px 16px"><p class="small b" style="padding:8px 0 4px;color:var(--sauge-f)">Documents</p>${docs.map(d=>`<a class="line" href="#/document/${d.id}">${I.doc}<span class="stack" style="flex:1 1 auto;gap:0"><span class="b">${h(d.titre)}</span><span class="small muted">${dateFr(d.date)}</span></span>${I.fleche}</a>`).join("")}</div>`:""}
    <label class="btn primary big file">${I.camera} Photographier ici<input type="file" accept="image/*" ${isDesk()?"":'capture="environment"'} multiple onchange="fichiers(this.files,'${id}')"></label>
    <button class="btn ghost" onclick="retirerPiece('${id}')">Retirer cette pièce</button>
  </div>`;
};
function renommerPiece(id){const p=pieceParId(id);modal(`<h2>Renommer</h2><input class="input" id="rn" value="${h(p.nom)}"><button class="btn primary big" onclick="pieceParId('${id}').nom=document.getElementById('rn').value.trim()||'Pièce';closeModal();save();render()">Enregistrer</button><button class="btn ghost" onclick="closeModal()">Annuler</button>`)}
function retirerPiece(id){const p=pieceParId(id);const n=S.equipements.filter(e=>e.piece===id).length+S.docs.filter(d=>d.piece===id).length;modal(`<h2>Retirer ${h(lc(p.nom))} ?</h2><p class="muted">${n?`Ce qui y est rangé (${n} élément${n>1?"s":""}) sera rattaché à la maison entière. Rien n'est perdu.`:"Rien n'y est rangé."}</p><div class="row"><button class="btn primary grow" onclick="S.equipements.forEach(e=>{if(e.piece==='${id}')e.piece='maison'});S.docs.forEach(d=>{if(d.piece==='${id}')d.piece='maison'});S.pieces=S.pieces.filter(x=>x.id!=='${id}');closeModal();save();route('#/maison')">Retirer</button><button class="btn" onclick="closeModal()">Annuler</button></div>`)}

V.carte=id=>{

  const F={equipements:vEquipements,documents:vDocuments,artisans:vArtisans,travaux:vTravaux,echanges:vEchanges,transmission:vTransmission};

function vEquipements(){
  const parPiece={};S.equipements.forEach(e=>{(parPiece[e.piece]=parPiece[e.piece]||[]).push(e)});
  const ordre=Object.keys(parPiece).sort((a,b)=>a==="maison"?1:b==="maison"?-1:0);

    ${ordre.map(pid=>`<div class="card" style="gap:0;padding:4px 16px"><p class="small b" style="padding:8px 0 4px;color:var(--sauge-f)">${h(pid==="maison"?"La maison entière":nomPiece(pid))}</p>${parPiece[pid].map(e=>`<a class="line" href="#/equipement/${e.id}">${I.outil}<span class="stack" style="flex:1 1 auto;gap:0"><span class="b">${h(e.nom)}</span><span class="small muted">${h(e.marque)}${e.garantie&&joursDepuis(e.garantie)<0?" · garanti jusqu'en "+e.garantie.slice(0,4):""}</span></span>${I.fleche}</a>`).join("")}</div>`).join("")}
    <label class="btn file">${I.camera} Photographier un appareil<input type="file" accept="image/*" ${isDesk()?"":'capture="environment"'} multiple onchange="fichiers(this.files,'maison')"></label>

V.equipement=id=>{
  const e=S.equipements.find(x=>x.id===id);if(!e)return vEquipements();
  const docs=docsLies(e);
  return `<div class="view" style="gap:12px">
    ${e.img?`<div class="photo" style="min-height:${e.pdf?"420px":"130px"}">${vignette(e)}</div>`:""}
    <div class="stack" style="gap:2px"><h1 class="h" style="font-size:1.45em">${h(e.nom)}</h1><p class="muted">${h(e.marque)} ${h(e.modele)} · ${h(nomPiece(e.piece))}</p></div>
    <div class="card"><dl class="kv">${e.ref?`<dt>Référence</dt><dd class="num">${h(e.ref)}</dd>`:""}${e.achat?`<dt>Acheté</dt><dd>${dateFr(e.achat)}</dd>`:""}${e.garantie?`<dt>Garantie</dt><dd>${joursDepuis(e.garantie)<0?"jusqu'au "+dateFr(e.garantie):"terminée le "+dateFr(e.garantie)}</dd>`:""}${e.installateur?`<dt>Installé par</dt><dd>${h(e.installateur)}</dd>`:""}${e.entretiens&&e.entretiens.length?`<dt>Entretiens</dt><dd>${e.entretiens.map(x=>dateFr(x.d)+(x.par?" · "+h(x.par):"")).join("<br>")}</dd>`:""}<dt>État</dt><dd>${e.etat==="bon"?"Bon":h(e.etat)}</dd></dl></div>
    <div class="grid2">${e.notice?`<button class="btn" onclick="voirNotice('${e.id}')">${I.doc} Voir la notice</button>`:`<button class="btn" disabled>Pas de notice</button>`}${e.sav?`<button class="btn" onclick="sav('${e.id}')">${I.telephone} Contacter le SAV</button>`:`<button class="btn" disabled>Pas de SAV connu</button>`}${e.installateur?`<button class="btn" onclick="contacter('${h(e.installateur)}')">${I.gens} Recontacter l'installateur</button>`:""}<button class="btn terra" onclick="probleme('${e.id}')">J'ai un problème</button></div>
    ${docs.length?`<div class="card" style="gap:0;padding:4px 16px"><p class="small b" style="padding:8px 0 4px;color:var(--sauge-f)">Documents reliés</p>${docs.map(d=>`<a class="line" href="#/document/${d.id}">${I.doc}<span class="stack" style="flex:1 1 auto;gap:0"><span class="b">${h(d.titre)}</span><span class="small muted">${dateFr(d.date)}${d.montant?" · "+euros(d.montant):""}</span></span>${I.fleche}</a>`).join("")}</div>`:""}
    <p class="small faint">Notice et service après-vente retrouvés à partir de la référence lue sur l'étiquette. <button class="btn ghost sm" style="padding:0;min-height:0" onclick="corrigerItem('${e.id}')">Corriger</button></p>

};
function voirNotice(id){const e=S.equipements.find(x=>x.id===id);modal(`<h2>Notice — ${h(e.marque)} ${h(e.modele)}</h2><div class="book"><p class="small muted">Retrouvée sur le site du fabricant à partir de la référence ${h(e.ref)}.</p><p style="margin-top:10px"><b>Mise en service.</b> Raccordez l'appareil, vérifiez le niveau, lancez un premier cycle à vide.</p><p><b>Entretien.</b> Nettoyez le filtre une fois par mois. Détartrez tous les six mois.</p><p><b>En cas de panne.</b> Le code affiché indique la cause : E15, fuite ; E22, filtre obstrué ; E24, évacuation.</p></div><div class="row"><button class="btn primary grow" onclick="closeModal();toast('Notice conservée dans Documents')">Conserver dans Documents</button><button class="btn" onclick="closeModal()">Fermer</button></div>`)}
function sav(id){const e=S.equipements.find(x=>x.id===id);modal(`<h2>Service après-vente ${h(e.marque)}</h2><p class="muted">Retrouvé à partir de la référence ${h(e.ref)}. ${e.garantie&&joursDepuis(e.garantie)<0?"L'appareil est encore sous garantie.":"L'appareil n'est plus sous garantie."}</p><a class="btn primary big" href="tel:${e.sav.replace(/\s/g,"")}">${I.telephone} ${h(e.sav)}</a><p class="small faint">Ayez sous la main : la référence ${h(e.ref)}, la date d'achat (${dateFr(e.achat)}) et la facture, qui est dans la mémoire de la maison.</p><button class="btn" onclick="closeModal()">Fermer</button>`)}
function probleme(id){const e=S.equipements.find(x=>x.id===id);const garanti=e.garantie&&joursDepuis(e.garantie)<0;const pro=S.pros.find(p=>p.nom===e.installateur);modal(`<h2>Un problème avec ${h(lc(e.nom))} ?</h2><p class="muted">${garanti?"Il est sous garantie : le service après-vente d'abord.":(pro?`${h(pro.nom)} connaît cet appareil : la maison le propose en premier.`:"Voici par où commencer.")}</p><div class="stack">${garanti&&e.sav?`<button class="btn primary big" onclick="closeModal();sav('${e.id}')">${I.telephone} Appeler le SAV</button>`:""}${pro?`<button class="btn ${garanti?"":"primary"} big" onclick="closeModal();contacter('${h(pro.nom)}')">${I.gens} Recontacter ${h(pro.nom)}</button>`:""}<button class="btn big" onclick="closeModal();trouverPro('${h(e.nom)}')">Trouver un professionnel</button><button class="btn big" onclick="closeModal();sinistre('${e.id}')">Déclarer un sinistre à l'assureur</button></div><button class="btn ghost" onclick="closeModal()">Fermer</button>`)}
function sinistre(id){const e=S.equipements.find(x=>x.id===id);const ass=S.docs.find(d=>d.type==="contrat");modal(`<h2>Déclaration de sinistre</h2><p class="muted">VIDOM prépare le dossier avec ce que la maison sait. Vous relisez, vous envoyez.</p><div class="book"><p class="b">${h(S.logement.nom)} — ${h(S.logement.adresse)}, ${h(S.logement.cp)} ${h(S.logement.ville)}</p><p class="small muted">${ass?"Contrat : "+h(ass.fournisseur)+", attestation du "+dateFr(ass.date):"Attestation d'assurance : à photographier"}</p><p style="margin-top:8px"><b>Équipement concerné :</b> ${h(e.nom)} ${h(e.marque)} ${h(e.modele)}, ${e.achat?"acheté le "+dateFr(e.achat):""}${e.installateur?", installé par "+h(e.installateur):""}.</p><p><b>Pièces jointes :</b> facture d'achat, photos, ${e.notice?"notice":""}.</p></div><div class="row"><a class="btn primary grow" href="mailto:?subject=${encodeURIComponent("Déclaration de sinistre — "+S.logement.adresse)}" onclick="closeModal();filAjouter({type:'info',t:'Déclaration de sinistre préparée pour '+'${h(lc(e.nom))}'+'. Envoyée depuis votre messagerie.',ico:'envoi',fait:true});render()">${I.envoi} Envoyer</a><button class="btn" onclick="closeModal()">Fermer</button></div>`)}

function vDocuments(){
  const vue=S.reglages.docsPar||"type";
  const ligne=d=>`<a class="line" href="#/document/${d.id}">${I.doc}<span class="stack" style="flex:1 1 auto;gap:0"><span class="b">${h(d.titre)}</span><span class="small muted">${dateFr(d.date)}${d.montant?" · "+euros(d.montant):""} · ${d.piece==="maison"?"la maison":h(nomPiece(d.piece))}</span></span>${I.fleche}</a>`;
  let corps;
  if(vue==="enseigne"){
    const par={};S.docs.forEach(d=>{const k=d.fournisseur||"Sans enseigne connue";(par[k]=par[k]||[]).push(d)});
    const noms=Object.keys(par).sort((a,b)=>a==="Sans enseigne connue"?1:b==="Sans enseigne connue"?-1:a.localeCompare(b));
    corps=noms.map(n=>`<div class="card" style="gap:0;padding:4px 16px"><p class="small b" style="padding:8px 0 4px;color:var(--sauge-f)">${h(n)}</p>${par[n].sort((a,b)=>b.date.localeCompare(a.date)).map(ligne).join("")}</div>`).join("");
  }else{
    const TYPES={acte:"Acte",diagnostic:"Diagnostics",facture:"Factures",devis:"Devis",notice:"Notices",contrat:"Contrats et attestations",impot:"Impôts",plan:"Plans",autre:"Autres"};
    const par={};S.docs.forEach(d=>{(par[d.type]=par[d.type]||[]).push(d)});
    corps=Object.keys(TYPES).filter(t=>par[t]).map(t=>`<div class="card" style="gap:0;padding:4px 16px"><p class="small b" style="padding:8px 0 4px;color:var(--sauge-f)">${TYPES[t]}</p>${par[t].sort((a,b)=>b.date.localeCompare(a.date)).map(ligne).join("")}</div>`).join("");
  }
  return `<div class="view" style="gap:12px"><h1 class="h" style="font-size:1.45em">Documents</h1>

    ${corps}
    <div class="row"><label class="btn grow file">${I.camera} Photographier<input type="file" accept="image/*" ${isDesk()?"":'capture="environment"'} multiple onchange="fichiers(this.files,'maison')"></label><button class="btn grow" onclick="emporter()">${I.telechargement} Emporter</button></div>
  </div>`;
}
V.document=id=>{const d=S.docs.find(x=>x.id===id);if(!d)return vDocuments();const t=S.travaux.find(t=>t.docs.includes(d.id));const eqLie=d.lie?equipParLie(d.lie):null;

  <div class="card" style="gap:6px"><p class="small b" style="color:var(--sauge-f)">À qui la donner</p><p class="small muted">Notaire, agent immobilier, artisans, assureur, syndic, diagnostiqueur — tous ceux qui détiennent des papiers de votre logement. Ils envoient, vous décidez.</p></div>
  <div class="card" style="gap:6px"><p class="small b" style="color:var(--sauge-f)">Expéditeurs acceptés sans vous demander</p>${S.expediteursOk.length?S.expediteursOk.map(x=>`<div class="line"><span>${h(x)}</span><button class="btn sm" onclick="S.expediteursOk=S.expediteursOk.filter(y=>y!=='${h(x)}');save();render()">Me redemander</button></div>`).join(""):`<p class="small muted">Aucun. Chaque envoi vous est proposé.</p>`}</div>
  <button class="btn" onclick="etiquette()">${I.qr} Imprimer l'étiquette</button>
</div>`;
