  return `
    <div class="center mb-24">
      <div style="width:64px;height:64px;margin:0 auto 18px;border-radius:18px;background:var(--sage);color:#fff;display:grid;place-items:center">
        <div style="width:30px;height:30px">${I.home}</div>
      </div>
      <h1>${fini?'Votre maison a désormais une mémoire.':'Construction en cours…'}</h1>
      <p class="muted mt-8">${S.ob.adresse || LOGEMENT.adresse+', '+LOGEMENT.cp+' '+LOGEMENT.ville}</p>
    </div>
    <div class="card"><div class="card-body">
      ${BUILD_LINES.map((l,i)=>`<div class="build-line ${i<n?'on':''}">
        <div class="bi">${I.check}</div><div class="small ${i<n?'strong':'muted'}">${l}</div>
      </div>`).join('')}
      ${fini?`
        <div class="note mt-16">${I.home}<div>
          Nous allons construire la mémoire de votre maison. Elle ne sera jamais complète aujourd'hui. Mais elle grandira avec le temps.</div></div>
        <button class="btn btn-primary btn-block btn-lg mt-16" data-act="obportes">Continuer</button>
      `:''}
    </div></div>`;
}

function runBuild(){
  if (S.ob.build >= BUILD_LINES.length) return;
  setTimeout(()=>{
    if (S.mode!=='onboarding' || S.ob.step!==2) return;
    S.ob.build++;
    render();
    runBuild();
  }, S.ob.build===0?450:700);
}

/* ---------- Étape 4 — les quatre portes ---------- */
function obStep3(){
  return `
    <h1>Par où voulez-vous commencer ?</h1>
    <p class="muted mt-8 mb-24">Il n'y a pas d'ordre imposé, et rien n'est obligatoire. Vous pourrez ouvrir les autres portes plus tard, ou jamais.</p>
    <div class="portes">
      ${PORTES.map(p=>`
        <button class="porte" data-act="obporte" data-p="${p.id}">
          <div class="pi">${I[p.ic]}</div>
          <div class="pn">${p.n}</div>
          <div class="pt">${p.t}</div>
          <div class="pd">${p.d}</div>
          <div class="pf">${p.f}</div>
        </button>`).join('')}
    </div>
    <button class="btn btn-quiet btn-block mt-16" data-act="enterFromOb">Plus tard — entrer dans ma maison</button>`;
}

function obStep4(){
  const p = PORTES.find(x=>x.id===S.ob.porte) || PORTES[1];

  if (p.id === 'filmer'){
    return `
      <h1 id="recotitre">Filmez votre cuisine, sans vous presser.</h1>
      <p class="muted mt-8 mb-20" id="recosous">Pièce par pièce, pas d'un seul trait. Restez un moment sur chaque équipement.</p>
      <div class="film mb-20">${I.video}<div class="fl">Cuisine · 00:48</div></div>
      <div class="card"><div class="card-body">
        <div class="section-title mb-8">Nous avons reconnu</div>
        <div id="recobox"></div>
        <div id="recoafter"></div>
      </div></div>`;
  }

  const contenus = {
    decrire: { intro:"Vous racontez vos pièces à voix haute ou en quelques mots. VIDOM en fait la structure de la maison : chaque pièce devient un espace avec sa propre mémoire.",
      lignes:[["Cuisine","17 m², rez-de-chaussée"],["Séjour","34 m², rez-de-chaussée"],["Salle de bain","9 m², étage"],["Buanderie","7 m², rez-de-chaussée"],["Garage","22 m², rez-de-chaussée"]],
      apres:"Onze espaces créés en quelques minutes. Les équipements viendront s'y ranger tout seuls." },
    importer: { intro:"Photographiez votre classeur, page après page, sans rien trier. Vous donnez un titre — « le four de la cuisine » — et VIDOM range.",
      lignes:[["18 photographies","reçues en vrac"],["12 documents reconnus","factures, garanties, notices"],["4 équipements identifiés","four, fenêtres, chaudière, VMC"],["2 à préciser","titre demandé"]],
      apres:"Une seule séance suffit à rattraper des années de papier." },
    retrouver: { intro:"VIDOM ne lit pas votre boîte mail. Il vous donne les bons mots pour la chercher vous-même — c'est vous qui gardez la main.",
      lignes:[["Pour le four","« Darty » · « commande » · 2022"],["Pour les fenêtres","« Menuiseries de l'Erdre » · « devis » · 2020"],["Pour la toiture","« Couverture Bretonne » · « facture » · 2023"],["Pour la pompe à chaleur","« Daikin » · « MaPrimeRénov » · 2022"]],
      apres:"Copiez un mot-clé, cherchez dans vos mails, transférez le résultat à factures@vidom.app." }
  };
  const c = contenus[p.id];
  return `
    <h1>${p.t}</h1>
    <p class="muted mt-8 mb-20">${c.intro}</p>
    <div class="card mb-16"><div class="card-body" style="padding-top:8px;padding-bottom:8px">
      ${c.lignes.map(([k,v])=>`<div class="extract-row in"><div class="ck">${I.check}</div><div class="k">${k}</div><div class="v grow">${v}</div></div>`).join('')}
    </div></div>
    <div class="note mb-20">${I.check}<div class="small">${c.apres}</div></div>
    <div class="row gap-8">
      <button class="btn btn-ghost" data-act="obportes">Une autre porte</button>
      <button class="btn btn-primary grow btn-lg" data-act="enterFromOb">Entrer dans ma maison</button>
    </div>`;
}

function runReco(){
  const box = document.getElementById('recobox');
  if (!box) return;
  let k = 0;
  const tick = () => {
    if (!document.getElementById('recobox')) return;
    if (k < RECONNU.length){
      const x = RECONNU[k];
      const row = document.createElement('div');
      row.className = 'reco';
      row.innerHTML = `<div class="rk">${I.check}</div><div class="grow"><div class="rt">${x.t}</div><div class="rs">${x.s}</div></div>`;
      box.appendChild(row);
      requestAnimationFrame(()=>row.classList.add('in'));
      k++; S.ob.reco = k;
      S.ob.timer = setTimeout(tick, 520);
    } else {
      const ti = document.getElementById('recotitre'), so = document.getElementById('recosous');
      if (ti) ti.textContent = "Voilà ce que nous avons reconnu.";
      if (so) so.textContent = "Une vidéo dit ce qui existe. Elle ne dit pas depuis quand, ni par qui. C'est un point de départ, pas la réponse.";
      const after = document.getElementById('recoafter');
      if (after) after.innerHTML = `
        <div class="note wood mt-16">${I.info}<div class="small">
          Il nous manque seulement la <b>facture du four</b>. La marque, le modèle et la date d'installation ne se voient pas à l'image — une photo de la plaque signalétique suffira, trente secondes par équipement.</div></div>
        <div class="row gap-8 mt-16">
          <button class="btn btn-ghost" data-act="obportes">Une autre porte</button>
          <button class="btn btn-primary grow" data-act="enterFromOb">Entrer dans ma maison</button>
        </div>`;
      bind();
    }
  };
  S.ob.timer = setTimeout(tick, 700);
}


/* ============================================================
   INTERACTIONS
   ============================================================ */
function bind(){
  document.querySelectorAll('[data-act]').forEach(el => {
    if (el.__bound) return;
    el.__bound = true;
    el.addEventListener('click', ev => {
      const a = el.dataset.act;

      // Un clic sur le fond ne ferme que si l'on vise bien le fond
      if ((a === 'closePanel' || a === 'closeModal' || a === 'closeDrawer') && ev.target !== el) return;
      ev.stopPropagation();

      switch(a){
        case 'go':           go(el.dataset.v); break;
        case 'panel':        S.modal = null; openPanel(el.dataset.t, el.dataset.id); break;
        case 'closePanel':   closePanel(); break;
        case 'modal':        openModal(el.dataset.m); break;
        case 'closeModal':   closeModal(); break;
        case 'openDrawer':   S.drawer = true; render(); break;
        case 'closeDrawer':  S.drawer = false; render(); break;
        case 'fdoc':         S.fDoc = el.dataset.f; render(); break;
        case 'feq':          S.fEq = el.dataset.f; render(); break;
        case 'ftl':          S.fTl = el.dataset.f; render(); break;
        case 'togglearchive':S.showArchive = !S.showArchive; render(); break;
        case 'qset':         S.qLive = el.dataset.q; render(); setTimeout(()=>{const i=document.getElementById('qinput'); if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},20); break;
        case 'addgo':        S.add.step = 1; render(); runExtraction(); break;
        case 'addstep':      S.add.step = +el.dataset.s; render(); break;
        case 'afterAdd':     S.modal = null; openPanel(el.dataset.v, el.dataset.id); break;
        case 'site':         S.mode = 'site'; S.panel = null; S.modal = null; window.scrollTo(0,0); render(); break;
        case 'enter':        S.mode = 'app'; S.view = 'accueil'; window.scrollTo(0,0); render(); break;
        case 'enterFromOb':  S.mode = 'app'; S.view = 'accueil'; window.scrollTo(0,0); render(); break;
        case 'obstart':      S.mode = 'onboarding'; S.ob.step = 0; S.ob.build = 0; window.scrollTo(0,0); render(); break;
        case 'obnext':       obNext(); break;
        case 'obback':       S.ob.step = Math.max(0, S.ob.step-1); render(); break;
        case 'obtype':       S.ob.type = el.dataset.t; render(); break;

        /* --- Les quatre portes --- */
        case 'obportes':     if(S.ob.timer) clearTimeout(S.ob.timer);
                             S.ob.step = 3; S.ob.porte = null; S.ob.reco = 0; window.scrollTo(0,0); render(); break;
        case 'obporte':      S.ob.porte = el.dataset.p; S.ob.reco = 0; S.ob.step = 4; window.scrollTo(0,0); render();
                             if (el.dataset.p === 'filmer') runReco(); break;
        case 'porte':        S.modal = null;
                             if (el.dataset.p === 'filmer' || el.dataset.p === 'importer'){ openModal('souvenir'); }
                             else if (el.dataset.p === 'retrouver'){ openModal('recherche'); }
                             else { go('pieces'); }
                             break;

        /* --- Ajouter un souvenir --- */
        case 'souv':         if (el.dataset.k === 'facture'){ S.modal='ajout'; S.add={step:1,timer:null}; render(); runExtraction(); }
                             else { S.souv = {step:1, kind:el.dataset.k}; render(); }
                             break;
        case 'souvback':     S.souv = {step:0, kind:null}; render(); break;
        case 'go2':          S.modal = null; go(el.dataset.v); break;

        /* --- Sinistre, partage, livres --- */
        case 'sintype':      S.sin = {step:1, type:el.dataset.k}; render(); break;
        case 'dest':         S.dest = el.dataset.d; S.modal = 'partage'; render(); break;
        case 'livre':        S.livre = el.dataset.l; S.modal = 'livre'; render(); break;

        /* --- Dépôts par un tiers (code de fin de travaux) — VIDOM-024 --- */
        case 'validerdoc':   validerDocument(el.dataset.id); break;
        case 'refuserdoc':   refuserDocument(el.dataset.id); break;
      }
    });
  });

  // Champs de l'onboarding
  document.querySelectorAll('[data-obfield]').forEach(el => {
    if (el.__bound) return;
    el.__bound = true;
    el.addEventListener('input', () => { S.ob[el.dataset.obfield] = el.value; });
    el.addEventListener('keydown', e => { if (e.key === 'Enter') obNext(); });
  });

  // Champ de recherche — mise à jour ciblée pour ne pas perdre le curseur
  const qi = document.getElementById('qinput');
  if (qi && !qi.__bound){
    qi.__bound = true;
    qi.addEventListener('input', () => {
      S.qLive = qi.value;
      const pos = qi.selectionStart;
      const box = document.querySelector('.search-box');
      if (!box) return;
      const tmp = document.createElement('div');
      tmp.innerHTML = searchHTML();
      const fresh = tmp.querySelector('.search-box');
      box.querySelector('.search-results').replaceWith(fresh.querySelector('.search-results'));
      const foot = box.querySelector('.search-box > div:last-child');
      bind();
      const again = document.getElementById('qinput');
      if (again){ again.focus(); again.setSelectionRange(pos, pos); }
    });
  }

  // Défilement du panneau latéral remis à zéro
  const pb = document.querySelector('.panel');
  if (pb && !pb.__scrolled){ pb.__scrolled = true; pb.scrollTop = 0; }
}

function obNext(){
  if (S.ob.step === 0){
    const el = document.getElementById('obadr');
    if (el) S.ob.adresse = el.value;
    S.ob.step = 1; render(); return;
  }
  if (S.ob.step === 1){
    const a = document.getElementById('oban'), b = document.getElementById('obsu');
    if (a) S.ob.annee = a.value;
    if (b) S.ob.surface = b.value;
    S.ob.step = 2; S.ob.build = 0; render(); runBuild(); return;
  }
}

/* ---------- Raccourcis clavier ---------- */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    if (S.mode === 'app') openModal('recherche');
  }
  if (e.key === 'Escape'){
    if (S.modal) closeModal();
    else if (S.panel) closePanel();
    else if (S.drawer){ S.drawer = false; render(); }
  }
});

/* ---------- Démarrage ---------- */
render();

</script>
</body>
</html>
