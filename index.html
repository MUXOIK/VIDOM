<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIDOM — Maquette interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   VIDOM — Système de design
   Palette et principes issus de 042 Univers graphique
   ============================================================ */
:root{
  --sage:#5F7A6A;
  --sage-dark:#4A6154;
  --sage-mid:#8AA396;
  --sage-pale:#E6EBE7;
  --sage-wash:#F0F4F1;
  --ivory:#F6F3ED;
  --ivory-deep:#EFEAE0;
  --wood:#D8C8B2;
  --wood-pale:#EDE4D6;
  --stone:#B5B0A5;
  --slate:#50575E;
  --terracotta:#C9775B;
  --terracotta-pale:#F6E7E0;
  --surface:#FFFDFA;
  --ink:#2B3134;
  --ink-soft:#6B7278;
  --ink-faint:#9AA0A4;
  --line:#E4DFD4;
  --line-soft:#EFEBE2;
  --radius:14px;
  --radius-sm:9px;
  --radius-lg:20px;
  --shadow:0 1px 2px rgba(43,49,52,.04), 0 8px 24px rgba(43,49,52,.05);
  --shadow-lg:0 4px 12px rgba(43,49,52,.07), 0 24px 60px rgba(43,49,52,.10);
  --sans:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--ivory);
  color:var(--ink);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 0;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-weight:600;line-height:1.25;letter-spacing:-.011em}
h1{font-size:29px;letter-spacing:-.02em}
h2{font-size:21px}
h3{font-size:16px}
h4{font-size:14px}
::selection{background:var(--sage-pale)}
.mono-num{font-variant-numeric:tabular-nums}

/* ---------- Utilitaires ---------- */
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.small{font-size:13px}
.xsmall{font-size:12px}
.strong{font-weight:600}
.center{text-align:center}
.right{text-align:right}
.row{display:flex;align-items:center;gap:12px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:16px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column}
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-20{gap:20px}.gap-24{gap:24px}
.mt-4{margin-top:4px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}.mt-24{margin-top:24px}.mt-32{margin-top:32px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hide-mobile{display:initial}
.only-mobile{display:none}

/* ---------- Boutons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:40px;padding:0 18px;border-radius:10px;
  font-size:14px;font-weight:500;letter-spacing:-.005em;
  transition:background .15s ease, border-color .15s ease, color .15s ease;
  white-space:nowrap;
}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--sage);color:#fff}
.btn-primary:hover{background:var(--sage-dark)}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--ivory);border-color:var(--stone)}
.btn-quiet{color:var(--ink-soft);padding:0 10px}
.btn-quiet:hover{color:var(--sage);background:var(--sage-wash)}
.btn-sm{height:32px;padding:0 13px;font-size:13px;border-radius:8px}
.btn-sm svg{width:15px;height:15px}
.btn-lg{height:48px;padding:0 26px;font-size:15px;border-radius:12px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- Badges & pastilles ---------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  height:23px;padding:0 9px;border-radius:6px;
  font-size:12px;font-weight:500;letter-spacing:-.003em;white-space:nowrap;
  background:var(--ivory-deep);color:var(--ink-soft);
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge-ok{background:var(--sage-pale);color:var(--sage-dark)}
.badge-alert{background:var(--terracotta-pale);color:#A55B41}
.badge-wood{background:var(--wood-pale);color:#8A7355}
.badge-outline{background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:31px;padding:0 13px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-size:13px;color:var(--ink-soft);cursor:pointer;transition:.15s;white-space:nowrap;
}
.chip:hover{border-color:var(--sage-mid);color:var(--ink)}
.chip.active{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:500}
.chip .count{font-size:11px;opacity:.7}

/* ---------- Cartes ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.card-pad{padding:22px 24px}
.card-head{
  padding:18px 24px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.card-head h3{font-size:15px}
.card-body{padding:20px 24px}
.card-body-flush{padding:6px 0}
.card-foot{padding:14px 24px;border-top:1px solid var(--line-soft);background:#FDFBF7;border-radius:0 0 var(--radius) var(--radius)}

.section-title{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}

/* ---------- Structure application ---------- */
#root{min-height:100%}
.shell{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
.sidebar{
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sb-brand{padding:22px 20px 18px;display:flex;align-items:center;gap:11px}
.logo-mark{width:32px;height:32px;border-radius:9px;background:var(--sage);display:grid;place-items:center;flex:none}
.logo-mark svg{width:18px;height:18px;stroke:#fff}
.logo-word{font-size:17px;font-weight:600;letter-spacing:.13em;color:var(--ink)}
.sb-home{
  margin:0 12px 14px;padding:12px 13px;border-radius:11px;background:var(--sage-wash);
  border:1px solid var(--sage-pale);cursor:pointer;transition:.15s;
}
.sb-home:hover{border-color:var(--sage-mid)}
.sb-home .addr{font-size:13.5px;font-weight:600;line-height:1.35}
.sb-home .meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.sb-nav{padding:0 12px;flex:1}
.sb-group{margin-bottom:16px}
.sb-group-label{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);padding:0 12px 6px}
.sb-item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:8px 12px;border-radius:9px;font-size:14px;color:var(--ink-soft);
  transition:.13s;text-align:left;margin-bottom:1px;
}
.sb-item svg{width:17px;height:17px;flex:none;opacity:.75}
.sb-item:hover{background:var(--ivory);color:var(--ink)}
.sb-item.active{background:var(--sage-pale);color:var(--sage-dark);font-weight:600}
.sb-item.active svg{opacity:1}
.sb-item .tag{margin-left:auto;font-size:11px;font-weight:600;background:var(--terracotta);color:#fff;height:18px;min-width:18px;padding:0 5px;border-radius:9px;display:grid;place-items:center}
.sb-item .tag.quiet{background:var(--ivory-deep);color:var(--ink-soft)}
.sb-foot{padding:14px 20px;border-top:1px solid var(--line-soft)}
.sb-user{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--wood);color:#6E5B41;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(246,243,237,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:14px 34px;display:flex;align-items:center;gap:16px;
}
.searchbar{
  flex:1;max-width:520px;display:flex;align-items:center;gap:10px;
  height:40px;padding:0 15px;border-radius:11px;background:var(--surface);
  border:1px solid var(--line);color:var(--ink-faint);cursor:text;transition:.15s;
}
.searchbar:hover{border-color:var(--stone)}
.searchbar svg{width:16px;height:16px;flex:none}
.searchbar .kbd{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink-faint)}
.content{padding:30px 34px 90px;max-width:1280px;width:100%}
.page-head{margin-bottom:26px}
.page-head .sub{color:var(--ink-soft);font-size:14.5px;margin-top:6px;max-width:66ch}

/* ---------- Grilles ---------- */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g-main{grid-template-columns:1.62fr 1fr}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.g-auto-lg{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}

/* ---------- Statistiques ---------- */
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stat .label{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:7px}
.stat .label svg{width:14px;height:14px;opacity:.6}
.stat .value{font-size:27px;font-weight:600;letter-spacing:-.025em;margin-top:7px;line-height:1.1}
.stat .value .unit{font-size:15px;font-weight:500;color:var(--ink-soft);letter-spacing:0}
.stat .foot{font-size:12.5px;color:var(--ink-faint);margin-top:5px}

/* ---------- Listes ---------- */
.list{display:flex;flex-direction:column}
.list-row{
  display:flex;align-items:center;gap:14px;padding:13px 24px;
  border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .13s;
  text-align:left;width:100%;
}
.list-row:last-child{border-bottom:none}
.list-row:hover{background:#FBF9F5}
.list-row .ic{
  width:36px;height:36px;border-radius:9px;background:var(--ivory);
  display:grid;place-items:center;flex:none;color:var(--sage);
}
.list-row .ic svg{width:17px;height:17px}
.list-row .ic.wood{background:var(--wood-pale);color:#8A7355}
.list-row .ic.alert{background:var(--terracotta-pale);color:#A55B41}
.list-row > svg{width:17px;height:17px;flex:none;color:var(--ink-faint)}
.list-row .t{font-size:14px;font-weight:500;line-height:1.35}
.list-row .s{font-size:12.5px;color:var(--ink-soft);margin-top:1px}

/* ---------- Tableaux ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{
  text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-faint);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tbody tr{cursor:pointer;transition:background .13s}
.tbl tbody tr:hover{background:#FBF9F5}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}

/* ---------- Chronologie ---------- */
.tl{position:relative;padding-left:34px}
.tl:before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-year{
  position:relative;margin:26px 0 14px -34px;padding-left:34px;
  font-size:12px;font-weight:600;letter-spacing:.09em;color:var(--ink-faint);
}
.tl-year:first-child{margin-top:0}
.tl-year:before{
  content:"";position:absolute;left:5px;top:6px;width:14px;height:14px;border-radius:50%;
  background:var(--ivory);border:2px solid var(--stone);
}
.tl-item{position:relative;margin-bottom:12px;cursor:pointer}
.tl-item:before{
  content:"";position:absolute;left:-29px;top:19px;width:11px;height:11px;border-radius:50%;
  background:var(--sage);border:2.5px solid var(--surface);box-shadow:0 0 0 1.5px var(--sage-pale);
}
.tl-item.alert:before{background:var(--terracotta);box-shadow:0 0 0 1.5px var(--terracotta-pale)}
.tl-item.soft:before{background:var(--stone);box-shadow:0 0 0 1.5px var(--ivory-deep)}
.tl-card{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:14px 18px;box-shadow:var(--shadow);transition:.15s;
}
.tl-item:hover .tl-card{border-color:var(--sage-mid);transform:translateX(2px)}
.tl-date{font-size:11.5px;color:var(--ink-faint);font-weight:500;letter-spacing:.02em}
.tl-title{font-size:14.5px;font-weight:600;margin-top:2px}
.tl-desc{font-size:13px;color:var(--ink-soft);margin-top:4px;line-height:1.5}
.tl-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}

/* ---------- Documents ---------- */
.doc-tile{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:.15s;box-shadow:var(--shadow);text-align:left;width:100%;
}
.doc-tile:hover{border-color:var(--sage-mid);box-shadow:var(--shadow-lg)}
.doc-thumb{height:112px;background:var(--ivory-deep);display:grid;place-items:center;position:relative;border-bottom:1px solid var(--line-soft);overflow:hidden}
.doc-thumb .page{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:64px;height:80px;background:var(--surface);border:1px solid var(--line);border-radius:4px 4px 0 0;box-shadow:0 2px 6px rgba(43,49,52,.06)}
.doc-thumb .page:before,.doc-thumb .page:after{content:"";position:absolute;left:10px;right:10px;height:2px;background:var(--line-soft);border-radius:1px}
.doc-thumb .page:before{top:54px}
.doc-thumb .page:after{top:62px;right:26px}
.doc-thumb svg{position:relative;z-index:1;margin-top:-22px;width:22px;height:22px;color:var(--sage);opacity:.85}
.doc-thumb svg{width:30px;height:30px;color:var(--stone)}
.doc-thumb .ext{position:absolute;top:9px;left:9px;font-size:10px;font-weight:600;letter-spacing:.05em;background:var(--surface);border:1px solid var(--line);padding:1px 6px;border-radius:5px;color:var(--ink-soft)}
.doc-info{padding:12px 14px}
.doc-info .n{font-size:13.5px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:37px}
.doc-info .m{font-size:11.5px;color:var(--ink-faint);margin-top:6px}

/* ---------- Fiches équipement ---------- */
.eq-card{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:18px;cursor:pointer;transition:.15s;box-shadow:var(--shadow);text-align:left;width:100%;
  display:flex;flex-direction:column;height:100%;
}
.eq-card > .mt-12:last-child{margin-top:auto;padding-top:14px}
.eq-card:hover{border-color:var(--sage-mid);box-shadow:var(--shadow-lg)}
.eq-card.archived{opacity:.62;background:#FAF8F4}
.eq-top{display:flex;align-items:flex-start;gap:12px}
.eq-ic{width:42px;height:42px;border-radius:11px;background:var(--sage-wash);display:grid;place-items:center;flex:none;color:var(--sage)}
.eq-ic svg{width:20px;height:20px}
.eq-name{font-size:14.5px;font-weight:600;line-height:1.3}
.eq-brand{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
.eq-meta{margin-top:14px;padding-top:13px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px}
.eq-line{display:flex;justify-content:space-between;font-size:12.5px;gap:10px}
.eq-line .k{color:var(--ink-faint)}
.eq-line .v{font-weight:500;text-align:right}

/* ---------- Barre de vie / jauge ---------- */
.gauge{height:5px;border-radius:3px;background:var(--ivory-deep);overflow:hidden}
.gauge > i{display:block;height:100%;border-radius:3px;background:var(--sage)}
.gauge.warn > i{background:var(--terracotta)}
.gauge.stone > i{background:var(--stone)}

/* ---------- Graphiques ---------- */
.chart{width:100%}
.chart-bars{display:flex;align-items:flex-end;gap:2px;height:170px;padding-top:20px}
.cb-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:0;height:100%;position:relative;cursor:default}
.cb-bar{
  width:100%;max-width:46px;background:var(--sage);border-radius:4px 4px 0 0;
  transition:background .15s;position:relative;min-height:2px;
}
.cb-col:hover .cb-bar{background:var(--sage-dark)}
.cb-val{
  position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:5px;
  font-size:11px;font-weight:600;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;
  opacity:0;transition:opacity .13s;
}
.cb-col:hover .cb-val{opacity:1}
.cb-col.peak .cb-val{opacity:1}
.cb-x{margin-top:7px;font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.chart-axis{display:flex;gap:2px;border-top:1px solid var(--line)}
.chart-axis > div{flex:1;text-align:center}

.hbar{display:flex;align-items:center;gap:12px;padding:7px 0}
.hbar .lb{width:150px;font-size:13px;flex:none;color:var(--ink)}
.hbar .track{flex:1;height:14px;background:var(--ivory-deep);border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--sage);border-radius:4px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.hbar .vl{width:86px;text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;flex:none}

/* ---------- Panneau latéral / modale ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(43,49,52,.32);backdrop-filter:blur(2px);
  z-index:200;display:flex;justify-content:flex-end;
  animation:fadeIn .18s ease;
}
.overlay.center{align-items:center;justify-content:center;padding:24px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(26px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes popIn{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
.panel{
  width:min(560px,100%);background:var(--ivory);height:100%;overflow-y:auto;
  animation:slideIn .22s cubic-bezier(.2,.7,.3,1);box-shadow:var(--shadow-lg);
}
.modal{
  width:min(620px,100%);max-height:86vh;overflow-y:auto;background:var(--ivory);
  border-radius:var(--radius-lg);animation:popIn .18s cubic-bezier(.2,.7,.3,1);box-shadow:var(--shadow-lg);
}
.panel-head{
  position:sticky;top:0;background:rgba(246,243,237,.94);backdrop-filter:blur(10px);
  padding:18px 26px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px;z-index:2;
}
.panel-body{padding:24px 26px 60px}
.icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-soft);transition:.13s;flex:none}
.icon-btn:hover{background:var(--ivory-deep);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 22px;font-size:13.5px}
.kv dt{color:var(--ink-faint)}
.kv dd{font-weight:500;text-align:right}

/* ---------- Recherche ---------- */
.search-overlay{
  position:fixed;inset:0;background:rgba(43,49,52,.34);backdrop-filter:blur(3px);
  z-index:300;display:flex;justify-content:center;padding:9vh 20px 20px;animation:fadeIn .15s;
}
.search-box{
  width:min(680px,100%);background:var(--surface);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);overflow:hidden;height:fit-content;max-height:78vh;
  display:flex;flex-direction:column;animation:popIn .17s cubic-bezier(.2,.7,.3,1);
}
.search-input-row{display:flex;align-items:center;gap:13px;padding:19px 22px;border-bottom:1px solid var(--line-soft)}
.search-input-row svg{width:19px;height:19px;color:var(--ink-faint);flex:none}
.search-input-row input{flex:1;border:none;outline:none;font-size:16.5px;background:none}
.search-input-row input::placeholder{color:var(--ink-faint)}
.search-results{overflow-y:auto;padding:8px 0}
.search-hint{padding:16px 22px 20px}
.sug{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 22px;text-align:left;
  font-size:14px;color:var(--ink-soft);transition:.12s;
}
.sug:hover{background:var(--sage-wash);color:var(--ink)}
.sug svg{width:15px;height:15px;color:var(--ink-faint);flex:none}
.answer{
  margin:4px 14px 10px;padding:16px 18px;background:var(--sage-wash);
  border:1px solid var(--sage-pale);border-radius:12px;
}
.answer .a-lead{font-size:14.5px;line-height:1.55}
.answer .a-lead b{font-weight:600}

/* ---------- Dépôt de document ---------- */
.dropzone{
  border:1.5px dashed var(--stone);border-radius:var(--radius);background:#FBF9F5;
  padding:34px 24px;text-align:center;transition:.2s;cursor:pointer;
}
.dropzone:hover{border-color:var(--sage);background:var(--sage-wash)}
.dropzone svg{width:30px;height:30px;color:var(--stone);margin-bottom:10px}
.extract-row{
  display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft);
  opacity:0;transform:translateY(5px);
}
.extract-row.in{opacity:1;transform:none;transition:opacity .3s ease, transform .3s ease}
.extract-row:last-child{border-bottom:none}
.extract-row .ck{width:19px;height:19px;border-radius:50%;background:var(--sage);display:grid;place-items:center;flex:none}
.extract-row .ck svg{width:11px;height:11px;stroke:#fff;stroke-width:3}
.extract-row .k{font-size:12.5px;color:var(--ink-faint);width:112px;flex:none}
.extract-row .v{font-size:13.5px;font-weight:500}
.spinner{width:19px;height:19px;border:2px solid var(--sage-pale);border-top-color:var(--sage);border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Bandeau d'information ---------- */
.note{
  display:flex;gap:11px;padding:13px 16px;border-radius:11px;
  background:var(--sage-wash);border:1px solid var(--sage-pale);font-size:13.5px;line-height:1.5;
}
.note svg{width:17px;height:17px;flex:none;color:var(--sage);margin-top:1px}
.note.wood{background:var(--wood-pale);border-color:#E2D5C0}
.note.wood svg{color:#8A7355}
.note.alert{background:var(--terracotta-pale);border-color:#EED6CB}
.note.alert svg{color:var(--terracotta)}

.empty{padding:52px 24px;text-align:center;color:var(--ink-faint)}
.empty svg{width:34px;height:34px;margin-bottom:12px;opacity:.5}

/* ---------- Onglets ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{padding:9px 15px;font-size:14px;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:.13s}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--sage-dark);border-bottom-color:var(--sage);font-weight:600}

/* ---------- Barre de navigation mobile ---------- */
.sb-close{display:none}
.mobile-nav{display:none}
.mobile-top{display:none}

/* ============================================================
   VITRINE (landing)
   ============================================================ */
.site{background:var(--ivory)}
.site-nav{
  position:sticky;top:0;z-index:50;background:rgba(246,243,237,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:16px 0;
}
.container{max-width:1080px;margin:0 auto;padding:0 28px}
.hero{padding:86px 0 70px;text-align:center}
.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.08;letter-spacing:-.03em;max-width:19ch;margin:0 auto}
.hero .lead{font-size:clamp(16px,2vw,19px);color:var(--ink-soft);max-width:56ch;margin:22px auto 0;line-height:1.6}
.hero-actions{display:flex;gap:12px;justify-content:center;margin-top:32px;flex-wrap:wrap}
.hero-note{font-size:13px;color:var(--ink-faint);margin-top:16px}
.site-section{padding:70px 0;border-top:1px solid var(--line)}
.site-section h2{font-size:clamp(24px,3.4vw,32px);letter-spacing:-.022em}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sage);margin-bottom:12px}
.feature{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.feature .fi{width:38px;height:38px;border-radius:10px;background:var(--sage-wash);color:var(--sage);display:grid;place-items:center;margin-bottom:14px}
.feature .fi svg{width:19px;height:19px}
.feature h3{font-size:15.5px;margin-bottom:6px}
.feature p{font-size:13.5px;color:var(--ink-soft);line-height:1.6}
.price-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px;position:relative}
.price-card.feat{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-pale)}
.price-card .tagline{position:absolute;top:-11px;left:28px;background:var(--sage);color:#fff;font-size:11px;font-weight:600;letter-spacing:.05em;padding:3px 11px;border-radius:6px}
.price-card .p{font-size:33px;font-weight:600;letter-spacing:-.03em;margin:10px 0 2px}
.price-card .p .per{font-size:14px;font-weight:400;color:var(--ink-soft);letter-spacing:0}
.price-list{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:9px}
.price-list li{display:flex;gap:9px;font-size:13.5px;color:var(--ink-soft);line-height:1.45}
.price-list svg{width:15px;height:15px;color:var(--sage);flex:none;margin-top:3px}
.quote-block{font-size:clamp(20px,3vw,27px);line-height:1.42;letter-spacing:-.02em;max-width:22ch}
.site-foot{padding:44px 0;border-top:1px solid var(--line);color:var(--ink-faint);font-size:13px}

/* ============================================================
   ONBOARDING
   ============================================================ */
.ob{min-height:100vh;display:flex;flex-direction:column;background:var(--ivory)}
.ob-top{padding:22px 28px;display:flex;align-items:center;justify-content:space-between}
.ob-main{flex:1;display:grid;place-items:center;padding:20px 24px 60px}
.ob-card{width:min(560px,100%)}
.ob-steps{display:flex;gap:6px;margin-bottom:30px}
.ob-steps > i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.ob-steps > i.on{background:var(--sage)}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);margin-bottom:6px}
.field input,.field select{
  width:100%;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);outline:none;transition:.15s;font-size:14.5px;
}
.field input:focus,.field select:focus{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-pale)}
.field .help{font-size:12px;color:var(--ink-faint);margin-top:5px}
.radio-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.radio-tile{
  border:1px solid var(--line);border-radius:11px;padding:13px;background:var(--surface);
  cursor:pointer;transition:.14s;text-align:left;font-size:14px;
}
.radio-tile:hover{border-color:var(--sage-mid)}
.radio-tile.on{border-color:var(--sage);background:var(--sage-wash);box-shadow:0 0 0 2px var(--sage-pale)}
.radio-tile .rt{font-weight:500}
.radio-tile .rs{font-size:12px;color:var(--ink-faint);margin-top:2px}
.build-line{display:flex;align-items:center;gap:11px;padding:9px 0;opacity:.3;transition:opacity .35s}
.build-line.on{opacity:1}
.build-line .bi{width:20px;height:20px;border-radius:50%;background:var(--sage-pale);display:grid;place-items:center;flex:none}
.build-line.on .bi{background:var(--sage)}
.build-line .bi svg{width:11px;height:11px;stroke:#fff;stroke-width:3;opacity:0;transition:opacity .3s}
.build-line.on .bi svg{opacity:1}

/* ============================================================
   MÉMOIRE — l'écran émotionnel
   ============================================================ */
.mem-hero{
  background:linear-gradient(152deg,var(--sage-dark),var(--sage) 58%,#6E8A78);
  border-radius:var(--radius-lg);padding:38px 34px 34px;color:#fff;box-shadow:var(--shadow-lg);
  position:relative;overflow:hidden;
}
.mem-hero:before{content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.06)}
.mem-hero .eyebrow{color:rgba(255,255,255,.72)}
.mem-hero h1{font-size:clamp(22px,3.2vw,31px);letter-spacing:-.028em;line-height:1.18;max-width:20ch;position:relative}
.mem-hero p{color:rgba(255,255,255,.78);margin-top:11px;font-size:14.5px;max-width:62ch;line-height:1.6;position:relative}
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:30px;position:relative}
.mem-tile{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.17);border-radius:var(--radius);padding:17px 17px 15px}
.mem-tile .mi{width:29px;height:29px;border-radius:9px;background:rgba(255,255,255,.17);display:grid;place-items:center;margin-bottom:13px}
.mem-tile .mi svg{width:16px;height:16px;stroke:#fff}
.mem-tile .mv{font-size:27px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.mem-tile .ml{font-size:12.5px;color:rgba(255,255,255,.76);margin-top:7px;line-height:1.35}

/* ============================================================
   LES QUATRE PORTES — la collecte comme une aventure
   ============================================================ */
.portes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.porte{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:.15s;
}
.porte:hover{border-color:var(--sage);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.porte .pi{width:36px;height:36px;border-radius:10px;background:var(--sage-wash);color:var(--sage);display:grid;place-items:center;flex:none}
.porte .pi svg{width:18px;height:18px}
.porte .pn{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sage)}
.porte .pt{font-size:15px;font-weight:600;letter-spacing:-.012em;margin-top:-4px}
.porte .pd{font-size:13px;color:var(--ink-soft);line-height:1.5}
.porte .pf{margin-top:auto;padding-top:4px;font-size:12px;color:var(--ink-faint)}

/* ============================================================
   AJOUTER UN SOUVENIR
   ============================================================ */
.souv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.souv-tile{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);
  padding:13px 14px;display:flex;align-items:center;gap:11px;text-align:left;transition:.14s;
}
.souv-tile:hover{border-color:var(--sage);background:var(--sage-wash)}
.souv-tile svg{width:18px;height:18px;color:var(--sage);flex:none}
.souv-tile .st{font-size:13.5px;font-weight:500;line-height:1.3}
.souv-tile .ss{font-size:11.5px;color:var(--ink-faint);margin-top:2px;line-height:1.3}

/* ============================================================
   LE HUB DES ÉCHANGES
   ============================================================ */
.hub{position:relative;width:100%;max-width:430px;aspect-ratio:1/1;margin:6px auto 0}
.hub-ring{position:absolute;inset:19%;border:1px dashed var(--line);border-radius:50%}
.hub-ring.out{inset:2%;border-color:var(--line-soft)}
.hub-center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:124px;height:124px;border-radius:50%;background:var(--sage);color:#fff;
  display:grid;place-items:center;text-align:center;padding:12px;z-index:2;box-shadow:var(--shadow-lg);
}
.hub-center svg{width:20px;height:20px;stroke:#fff;margin:0 auto 5px}
.hub-center .hc{font-size:11.5px;line-height:1.3;opacity:.92}
.hub-node{
  position:absolute;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:6px 11px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;
  box-shadow:var(--shadow);white-space:nowrap;transition:.14s;
}
.hub-node:hover{border-color:var(--sage);color:var(--sage-dark);transform:translate(-50%,-50%) scale(1.04)}
.hub-node svg{width:13px;height:13px;color:var(--sage)}
.hub-node.off{opacity:.55}

.dest{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px;text-align:left;transition:.15s;box-shadow:var(--shadow)}
.dest:hover{border-color:var(--sage);box-shadow:var(--shadow-lg)}
.dest .dh{display:flex;align-items:center;gap:11px}
.dest .di{width:34px;height:34px;border-radius:10px;background:var(--sage-wash);color:var(--sage);display:grid;place-items:center;flex:none}
.dest .di svg{width:17px;height:17px}

/* ============================================================
   LES LIVRES DU LOGEMENT
   ============================================================ */
.livre{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;text-align:left;transition:.15s;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.livre:hover{border-color:var(--sage);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.livre-cov{height:158px;display:grid;place-items:center;background:var(--ivory-deep);border-bottom:1px solid var(--line-soft)}
.lc{
  width:96px;height:124px;border-radius:2px 7px 7px 2px;color:#fff;padding:14px 12px 12px 17px;
  display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 8px 22px rgba(43,49,52,.22);position:relative;
}
.lc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:rgba(0,0,0,.20);border-radius:2px 0 0 2px}
.lc .lct{font-size:11px;font-weight:600;line-height:1.25;letter-spacing:-.005em}
.lc .lcm{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.72}
.lc.sage{background:var(--sage)}
.lc.wood{background:#8A7355}
.lc.terracotta{background:var(--terracotta)}
.lc.stone{background:var(--slate)}
.livre-body{padding:16px 17px;display:flex;flex-direction:column;gap:5px;flex:1}
.livre-body .lt{font-size:14.5px;font-weight:600;letter-spacing:-.012em}
.livre-body .ls{font-size:12.5px;color:var(--ink-soft);line-height:1.45}
.livre-body .lf{margin-top:auto;padding-top:10px;font-size:11.5px;color:var(--ink-faint)}

/* ============================================================
   QR CODE DE FIN DE TRAVAUX
   ============================================================ */
.qr{width:158px;height:158px;display:grid;grid-template-columns:repeat(25,1fr);grid-template-rows:repeat(25,1fr);background:#fff;padding:9px;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.qr i{background:transparent}
.qr i.on{background:var(--ink);border-radius:.5px}

/* ============================================================
   RÉSULTAT D'ANALYSE (vidéo, reconnaissance)
   ============================================================ */
.reco{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-soft);opacity:0;transform:translateY(5px)}
.reco.in{opacity:1;transform:none;transition:opacity .3s ease,transform .3s ease}
.reco:last-child{border-bottom:none}
.reco .rk{width:22px;height:22px;border-radius:50%;background:var(--sage);display:grid;place-items:center;flex:none}
.reco .rk svg{width:12px;height:12px;stroke:#fff;stroke-width:3}
.reco .rt{font-size:13.5px;font-weight:500}
.reco .rs{font-size:11.5px;color:var(--ink-faint)}
.film{
  aspect-ratio:16/10;border-radius:var(--radius);background:linear-gradient(160deg,#3C4A42,#2B3134);
  display:grid;place-items:center;color:rgba(255,255,255,.5);position:relative;overflow:hidden;
}
.film:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.10),transparent 55%)}
.film svg{width:34px;height:34px;stroke:rgba(255,255,255,.55)}
.film .fl{position:absolute;left:14px;bottom:12px;font-size:11.5px;letter-spacing:.05em;color:rgba(255,255,255,.62)}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1120px){
  .g-main{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  body{font-size:14.5px}
  .hide-mobile{display:none !important}
  .only-mobile{display:initial}
  .shell{grid-template-columns:1fr}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:270px;z-index:400;
    transform:translateX(-100%);transition:transform .24s cubic-bezier(.2,.7,.3,1);
    box-shadow:var(--shadow-lg);
  }
  .sidebar.open{transform:none}
  .sb-close{display:grid}
  .sb-scrim{position:fixed;inset:0;background:rgba(43,49,52,.34);z-index:390;animation:fadeIn .18s}
  .topbar{display:none}
  .mobile-top{
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;
    background:rgba(246,243,237,.92);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);padding:11px 16px;
  }
  .content{padding:20px 16px 96px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .grid{gap:14px}
  h1{font-size:23px}
  h2{font-size:18px}
  .page-head{margin-bottom:20px}
  .card-pad,.card-body{padding:16px 17px}
  .card-head{padding:15px 17px}
  .list-row{padding:12px 17px;gap:11px}
  .panel{width:100%;border-radius:0}
  .panel-head{padding:15px 18px}
  .panel-body{padding:18px 18px 80px}
  .kv{grid-template-columns:1fr auto}
  .hbar .lb{width:104px;font-size:12px}
  .hbar .vl{width:70px;font-size:12px}
  .g-auto{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .container{padding:0 20px}
  .hero{padding:52px 0 44px}
  .site-section{padding:48px 0}
  .radio-grid{grid-template-columns:1fr}
  .search-overlay{padding:0}
  .search-box{border-radius:0;max-height:100vh;height:100%}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;
    background:rgba(255,253,250,.96);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));
  }
  .mn-item{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:5px 2px;font-size:10.5px;color:var(--ink-faint);transition:.13s;
  }
  .mn-item svg{width:20px;height:20px}
  .mn-item.active{color:var(--sage-dark);font-weight:600}
  .mn-item.add .mnb{width:36px;height:36px;border-radius:11px;background:var(--sage);color:#fff;display:grid;place-items:center;margin-top:-8px;box-shadow:var(--shadow)}
  .mn-item.add .mnb svg{width:19px;height:19px}
  .chart-bars{height:130px}
  .tbl th,.tbl td{padding:10px 11px}
  .modal{border-radius:16px}
  .mem-hero{padding:26px 20px 24px;border-radius:var(--radius)}
  .mem-grid{grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px}
  .mem-tile{padding:14px}
  .mem-tile .mv{font-size:23px}
  .portes{grid-template-columns:1fr}
  .hub{display:none}
}
@media (max-width:520px){
  .g-auto{grid-template-columns:1fr 1fr}
  .doc-thumb{height:88px}
  .stat .value{font-size:23px}
  .souv-grid{grid-template-columns:1fr}
}
</style>

/* ---------- Utilitaires de format ---------- */
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MOIS_C = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const TODAY = new Date(2026, 6, 28); // 28 juillet 2026

function d(iso){ const [y,m,j] = iso.split('-').map(Number); return new Date(y, m-1, j); }
function fdate(iso){ const x = d(iso); return `${x.getDate()} ${MOIS[x.getMonth()]} ${x.getFullYear()}`; }
function fdateC(iso){ const x = d(iso); return `${x.getDate()} ${MOIS_C[x.getMonth()]} ${x.getFullYear()}`; }
function feur(n, dec){ return new Intl.NumberFormat('fr-FR',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0}).format(n) + ' €'; }
function fnum(n){ return new Intl.NumberFormat('fr-FR').format(n); }
function joursDepuis(iso){ return Math.round((TODAY - d(iso)) / 86400000); }
function ecart(iso){
  const j = Math.round((d(iso) - TODAY) / 86400000);
  if (j < 0) return { j, txt: `il y a ${humain(-j)}`, passe:true };
  return { j, txt: `dans ${humain(j)}`, passe:false };
}
function humain(j){
  if (j < 31) return j <= 1 ? "1 jour" : j + " jours";
  const mois = Math.round(j/30.4);
  if (mois < 22) return mois <= 1 ? "1 mois" : mois + " mois";
  const ans = Math.round(j/365);
  return ans + " ans";
}
function anciennete(iso){
  const j = joursDepuis(iso);
  const ans = Math.floor(j/365); const mois = Math.floor((j%365)/30.4);
  if (ans === 0) return mois <= 1 ? "1 mois" : mois + " mois";
  if (ans === 1) return mois === 0 ? "1 an" : "1 an et " + mois + " mois";
  return ans + " ans";
}
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- Calculs ---------- */
const eqActifs = () => EQUIPEMENTS.filter(e => !e.archive);
const garActives = () => GARANTIES.filter(g => d(g.fin) >= TODAY);
const totalTravaux = () => INTERVENTIONS.filter(i => i.categorie === 'travaux').reduce((s,i) => s + Math.max(0,i.cout), 0);
const totalEntretien = () => INTERVENTIONS.filter(i => i.categorie === 'entretien' || i.categorie === 'controle').reduce((s,i) => s + i.cout, 0);
const totalAides = () => INTERVENTIONS.reduce((s,i) => s + (i.aide||0), 0);
const coutsParAnnee = () => {
  const m = {};
  for (let y = 2019; y <= 2026; y++) m[y] = 0;
  INTERVENTIONS.forEach(i => {
    if (i.categorie === 'ancien' || i.categorie === 'vie' || i.cout <= 0) return;
    const y = +i.date.slice(0,4);
    if (m[y] !== undefined) m[y] += i.cout - (i.aide||0);
  });
  return Object.entries(m).map(([an,v]) => ({ an:+an, v }));
};
const rappelsProches = () => RAPPELS.filter(r => ecart(r.date).j < 120).length;
const rappelsTries = () => [...RAPPELS].sort((a,b) => d(a.date) - d(b.date));
const interventionsTriees = () => [...INTERVENTIONS].sort((a,b) => d(b.date) - d(a.date));
/* ---------- Dépôts par un tiers (code de fin de travaux) — VIDOM-024 ---------- */
const depotsAValider = () => DOCUMENTS.filter(x => x.depot && x.depot.statut === 'a_valider');
const isoToday = () => `${TODAY.getFullYear()}-${String(TODAY.getMonth()+1).padStart(2,'0')}-${String(TODAY.getDate()).padStart(2,'0')}`;
const nbPhotos = () => PIECES.reduce((s,p) => s + (p.photos||0), 0);
const anneesDocumentees = () => {
  const y = new Set();
  INTERVENTIONS.forEach(i => y.add(i.date.slice(0,4)));
  DOCUMENTS.forEach(x => y.add(x.date.slice(0,4)));
  return y.size;
};

function vChronologie(){
  const filtres = ['Tous','Travaux','Entretien','Sinistre','Avant 2019'];
  let items = interventionsTriees();
  if (S.fTl === 'Travaux')     items = items.filter(i=>i.categorie==='travaux');
  if (S.fTl === 'Entretien')   items = items.filter(i=>i.categorie==='entretien'||i.categorie==='controle');
  if (S.fTl === 'Sinistre')    items = items.filter(i=>i.categorie==='sinistre');
  if (S.fTl === 'Avant 2019')  items = items.filter(i=>i.categorie==='ancien');

  const annees = [...new Set(items.map(i=>i.date.slice(0,4)))];

  return `
  <div class="page-head">
    <h1>L'histoire de votre maison</h1>
    <p class="sub">${INTERVENTIONS.length} événements enregistrés depuis la construction en ${LOGEMENT.annee}. Chaque document déposé vient enrichir cette chronologie automatiquement.</p>
  </div>

  <div class="row gap-8 wrap mb-24">
    ${filtres.map(f=>`<button class="chip ${S.fTl===f?'active':''}" data-act="ftl" data-f="${f}">${f}</button>`).join('')}
  </div>

  <div class="tl">
    ${annees.map(an => {
      const list = items.filter(i=>i.date.slice(0,4)===an);
      return `<div class="tl-year">${an}</div>` + list.map(tlItem).join('');
    }).join('')}
  </div>

  ${S.fTl==='Tous' ? `<div class="note wood mt-24">${I.info}<div>
    <b>Avant 2019, la mémoire est incomplète.</b> Trois événements seulement ont pu être reconstitués à partir des documents transmis lors de la vente.
    VIDOM ne peut pas retrouver ce qui n'a jamais été conservé — il empêche que cela se reproduise à partir d'aujourd'hui.</div></div>` : ''}`;
}

function tlItem(i){
  const cls = i.categorie==='sinistre' ? 'alert' : i.categorie==='ancien' ? 'soft' : '';
  const art = i.artisan ? ART[i.artisan] : null;
  return `<div class="tl-item ${cls}" data-act="panel" data-t="intervention" data-id="${i.id}">
    <div class="tl-card">
      <div class="row-between">
        <div class="tl-date">${fdate(i.date)}</div>
        ${i.cout>0?`<div class="small strong mono-num">${feur(i.cout)}</div>`:i.cout<0?`<div class="small strong mono-num" style="color:var(--sage)">+ ${feur(-i.cout)}</div>`:''}
      </div>
      <div class="tl-title">${i.titre}</div>
      <div class="tl-desc">${i.desc}</div>
      <div class="tl-meta">
        <span class="badge">${i.type}</span>
        ${art?`<span class="badge badge-outline">${art.nom}</span>`:''}
        ${(i.docs&&i.docs.length)?`<span class="badge badge-outline">${i.docs.length} document${i.docs.length>1?'s':''}</span>`:''}
        ${i.aide?`<span class="badge badge-ok">${feur(i.aide)} d'aides</span>`:''}
        ${(i.equipements&&i.equipements.length)?`<span class="badge badge-outline">${i.equipements.map(e=>EQ[e].nom).join(', ')}</span>`:''}
      </div>
    </div>
  </div>`;
}

  if (S.fEq!=='Tous') list = list.filter(e=>e.cat===S.fEq);
  list = list.sort((a,b)=> (a.archive?1:0)-(b.archive?1:0) || d(b.pose)-d(a.pose));

  return `

    <div class="row-between wrap">
      <div>
        <h1>Équipements</h1>
        <p class="sub">Chaque équipement possède sa fiche : marque, modèle, numéro de série, installateur, garantie, entretiens et documents.</p>

  <div class="row gap-8 wrap mb-24">
    ${cats.map(c=>`<button class="chip ${S.fEq===c?'active':''}" data-act="feq" data-f="${c}">${c}</button>`).join('')}

  <div class="grid g-auto-lg">
    ${list.map(eqCard).join('')}

  ${!S.showArchive ? `<div class="note mt-24">${I.info}<div>
    <b>${EQUIPEMENTS.filter(e=>e.archive).length} équipements ont été déposés</b> depuis 2019. Ils ne sont pas supprimés : leur histoire reste consultable et reliée à l'équipement qui les a remplacés.</div></div>`:''}`;
}

function eqCard(e){
  const g = e.garantie ? GAR[e.garantie] : null;
  const gActive = g && d(g.fin) >= TODAY;
  const age = joursDepuis(e.pose)/365;
  const usure = Math.min(100, Math.round(age/e.vie*100));
  const ent = e.dernierEntretien ? ecart(e.dernierEntretien) : null;

  return `<button class="eq-card ${e.archive?'archived':''}" data-act="panel" data-t="equipement" data-id="${e.id}">
    <div class="eq-top">
      <div class="eq-ic">${I[e.icone]}</div>
      <div class="grow">
        <div class="eq-name">${e.nom}</div>
        <div class="eq-brand">${e.marque}${e.marque!=='—'?' · ':''}${e.modele}</div>
      </div>
      ${e.archive?`<span class="badge">Déposé</span>`:gActive?`<span class="badge badge-ok"><span class="dot"></span>Sous garantie</span>`:''}
    </div>
    <div class="eq-meta">
      <div class="eq-line"><span class="k">${e.archive?'Posé le':'Installé le'}</span><span class="v">${fdateC(e.pose)}</span></div>
      ${e.archive?`<div class="eq-line"><span class="k">Déposé le</span><span class="v">${fdateC(e.depose)}</span></div>`:
        `<div class="eq-line"><span class="k">Âge</span><span class="v">${anciennete(e.pose)}</span></div>`}
      ${e.installateur?`<div class="eq-line"><span class="k">Installateur</span><span class="v">${ART[e.installateur].nom}</span></div>`:''}
      ${g?`<div class="eq-line"><span class="k">Garantie</span><span class="v">${gActive?`jusqu'au ${fdateC(g.fin)}`:'expirée'}</span></div>`:''}
      ${(!e.archive && e.entretienFreq)?`<div class="eq-line"><span class="k">Dernier entretien</span><span class="v">${ent?ent.txt:'jamais enregistré'}</span></div>`:''}
    </div>
    ${!e.archive?`<div class="mt-12">
      <div class="row-between xsmall muted mb-8"><span>Durée de vie estimée</span><span>${usure} %</span></div>
      <div class="gauge ${usure>75?'warn':usure>50?'stone':''}"><i style="width:${usure}%"></i></div>
    </div>`:''}
  </button>`;
}

          return `<button class="list-row" data-act="panel" data-t="equipement" data-id="${e.id}">
            <div class="ic ${retard?'alert':''}">${I[e.icone]}</div>

          </button>`;
        }).join('')}
      </div>

  </div>`;
}

/* ============================================================
   VUE — GARANTIES
   ============================================================ */
function vGaranties(){
  const act = GARANTIES.filter(g=>d(g.fin)>=TODAY).sort((a,b)=>d(a.fin)-d(b.fin));
  const exp = GARANTIES.filter(g=>d(g.fin)<TODAY).sort((a,b)=>d(b.fin)-d(a.fin));

  const ligne = g => {
    const e = ecart(g.fin);
    const active = !e.passe;
    const dur = (d(g.fin)-d(g.debut))/86400000;
    const reste = Math.max(0, Math.min(100, Math.round((d(g.fin)-TODAY)/86400000/dur*100)));
    return `<tr data-act="panel" data-t="garantie" data-id="${g.id}">
      <td>
        <div class="strong">${g.nom}</div>
        <div class="xsmall muted">${g.equipement?EQ[g.equipement].nom:''}${g.fournisseur?' · '+ART[g.fournisseur].nom:''}</div>
      </td>
      <td><span class="badge ${g.type==='Décennale'?'badge-ok':'badge-outline'}">${g.type}</span></td>
      <td class="small">${fdateC(g.debut)}</td>
      <td class="small">${fdateC(g.fin)}</td>
      <td style="min-width:140px">
        ${active?`<div class="row gap-8"><div class="gauge grow ${reste<20?'warn':''}"><i style="width:${reste}%"></i></div><span class="xsmall muted" style="white-space:nowrap">${e.txt}</span></div>`
                :`<span class="badge">Expirée ${e.txt}</span>`}
      </td>
    </tr>`;
  };

  return `
  <div class="page-head">
    <h1>Garanties</h1>
    <p class="sub">${act.length} garanties encore actives sur ${GARANTIES.length}. Chacune est reliée à son équipement, à l'entreprise concernée et au document qui en fait la preuve.</p>
  </div>

  <div class="grid g3 mb-24">
    ${stat("Garanties actives", act.length, "", `sur ${GARANTIES.length} enregistrées`, 'shield')}
    ${stat("Décennales en cours", act.filter(g=>g.type==='Décennale').length, "", "toiture, isolation, salle de bain, photovoltaïque", 'roof')}
    ${stat("Prochaine échéance", fdateC(act[0].fin), "", act[0].nom, 'calendar')}
  </div>

  <div class="card mb-24">
    <div class="card-head"><h3>Garanties actives</h3></div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>Garantie</th><th>Type</th><th>Début</th><th>Fin</th><th>Reste à courir</th></tr></thead>
        <tbody>${act.map(ligne).join('')}</tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>Garanties expirées</h3><span class="badge">${exp.length}</span></div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>Garantie</th><th>Type</th><th>Début</th><th>Fin</th><th>Statut</th></tr></thead>
        <tbody>${exp.map(ligne).join('')}</tbody>
      </table>
    </div>
  </div>`;
}

          <div class="chart">
            <div class="row-between xsmall faint" style="border-bottom:1px dashed var(--line);padding-bottom:4px">
              <span>Maximum de la période</span><span class="mono-num">${feur(max)}</span>

            <div class="chart-bars">
              ${parAn.map(x=>`

                </div>`).join('')}

/* ============================================================
   PANNEAUX LATÉRAUX
   ============================================================ */
function panelHTML(){
  const { type, id } = S.panel;
  let head = '', body = '';
  if (type === 'equipement')   [head, body] = pEquipement(EQ[id]);
  if (type === 'document')     [head, body] = pDocument(DOC[id]);
  if (type === 'intervention') [head, body] = pIntervention(INT[id]);
  if (type === 'artisan')      [head, body] = pArtisan(ART[id]);
  if (type === 'garantie')     [head, body] = pGarantie(GAR[id]);
  if (type === 'piece')        [head, body] = pPiece(PC[id]);
  if (type === 'contrat')      [head, body] = pContrat(CTR[id]);
  if (type === 'rappel')       [head, body] = pRappel(RAPPELS.find(r=>r.id===id));
  if (type === 'manque')       [head, body] = pManque(MANQUES.find(m=>m.id===id));

  return `<div class="overlay" data-act="closePanel">
    <div class="panel" data-stop>
      <div class="panel-head">
        <div class="grow">${head}</div>
        <button class="icon-btn" data-act="closePanel" aria-label="Fermer">${I.close}</button>
      </div>
      <div class="panel-body">${body}</div>
    </div>
  </div>`;
}

function pTitle(sur, titre, sous){
  return `<div class="xsmall" style="letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)">${sur}</div>
          <h2 style="margin-top:3px">${titre}</h2>
          ${sous?`<div class="small muted mt-4">${sous}</div>`:''}`;
}

function docRow(x){
  return `<button class="list-row" style="padding-left:0;padding-right:0" data-act="panel" data-t="document" data-id="${x.id}">
    <div class="ic">${I[ICONE_CAT[x.cat]||'file']}</div>
    <div class="grow"><div class="t">${x.nom}</div><div class="s">${x.cat} · ${fdateC(x.date)} · ${x.taille}</div></div>
    ${I.chevron}
  </button>`;
}

/* ---------- Équipement ---------- */
function pEquipement(e){
  const g = e.garantie ? GAR[e.garantie] : null;
  const gA = g && d(g.fin) >= TODAY;
  const inters = INTERVENTIONS.filter(i=>i.equipements.includes(e.id)).sort((a,b)=>d(b.date)-d(a.date));
  const docs = (e.docs||[]).map(x=>DOC[x]).filter(Boolean);
  const usure = Math.min(100, Math.round(joursDepuis(e.pose)/365/e.vie*100));

  const head = pTitle(e.cat, e.nom, `${e.marque}${e.marque!=='—'?' · ':''}${e.modele}`);

  const body = `
    ${e.archive?`<div class="note wood mb-16">${I.archive}<div><b>Équipement déposé le ${fdateC(e.depose)}.</b> Sa mémoire est conservée${e.remplacePar?` et reliée à l'équipement qui l'a remplacé.`:'.'}</div></div>`:''}
    ${gA?`<div class="note mb-16">${I.shield}<div>Sous garantie <b>${g.type.toLowerCase()}</b> jusqu'au <b>${fdate(g.fin)}</b>, soit ${ecart(g.fin).txt}.</div></div>`:''}

    <div class="card mb-16">
      <div class="card-body">
        <dl class="kv">
          <dt>Marque</dt><dd>${e.marque}</dd>
          <dt>Modèle</dt><dd>${e.modele}</dd>
          <dt>Numéro de série</dt><dd class="mono-num">${e.serie}</dd>
          ${e.puissance&&e.puissance!=='—'?`<dt>Caractéristique</dt><dd>${e.puissance}</dd>`:''}
          <dt>${e.archive?'Posé le':'Installé le'}</dt><dd>${fdate(e.pose)}</dd>
          ${e.archive?`<dt>Déposé le</dt><dd>${fdate(e.depose)}</dd>`:`<dt>Âge</dt><dd>${anciennete(e.pose)}</dd>`}
          ${e.installateur?`<dt>Installateur</dt><dd>${ART[e.installateur].nom}</dd>`:''}
          ${e.piece?`<dt>Emplacement</dt><dd>${PC[e.piece].nom}</dd>`:''}
          <dt>État</dt><dd>${e.etat}</dd>
          ${e.cout?`<dt>Coût d'installation</dt><dd class="mono-num">${feur(e.cout)}</dd>`:''}
        </dl>
      </div>
    </div>

    ${!e.archive?`
    <div class="card mb-16">
      <div class="card-body">
        <div class="row-between mb-8"><span class="small strong">Durée de vie estimée</span><span class="small muted">${anciennete(e.pose)} sur ${e.vie} ans</span></div>
        <div class="gauge ${usure>75?'warn':usure>50?'stone':''}"><i style="width:${usure}%"></i></div>
        <div class="xsmall muted mt-8">Estimation indicative, fondée sur la durée de vie moyenne de ce type d'équipement. Elle ne préjuge pas de son état réel.</div>
      </div>
    </div>`:''}

    ${e.note?`<div class="note mb-16">${I.info}<div>${e.note}</div></div>`:''}

    ${e.remplace?`<div class="card mb-16"><div class="card-head"><h3>Remplace</h3></div>
      <div class="list"><button class="list-row" data-act="panel" data-t="equipement" data-id="${e.remplace}">
        <div class="ic wood">${I.archive}</div>
        <div class="grow"><div class="t">${EQ[e.remplace].nom}</div><div class="s">${EQ[e.remplace].marque} · déposé le ${fdateC(EQ[e.remplace].depose)}</div></div>
        ${I.chevron}</button></div></div>`:''}
    ${e.remplacePar?`<div class="card mb-16"><div class="card-head"><h3>Remplacé par</h3></div>
      <div class="list"><button class="list-row" data-act="panel" data-t="equipement" data-id="${e.remplacePar}">
        <div class="ic">${I[EQ[e.remplacePar].icone]}</div>
        <div class="grow"><div class="t">${EQ[e.remplacePar].nom}</div><div class="s">installé le ${fdateC(EQ[e.remplacePar].pose)}</div></div>
        ${I.chevron}</button></div></div>`:''}

    ${inters.length?`<div class="mb-16">
      <div class="section-title mb-12">Historique · ${inters.length} intervention${inters.length>1?'s':''}</div>
      <div class="tl" style="padding-left:26px">
        ${inters.map(i=>`<div class="tl-item ${i.categorie==='entretien'?'soft':''}" data-act="panel" data-t="intervention" data-id="${i.id}">
          <div class="tl-card">
            <div class="tl-date">${fdate(i.date)}</div>
            <div class="tl-title" style="font-size:14px">${i.titre}</div>
            ${i.artisan?`<div class="tl-desc">${ART[i.artisan].nom}${i.cout?` · ${feur(i.cout)}`:''}</div>`:''}
          </div></div>`).join('')}
      </div>
    </div>`:''}

    ${docs.length?`<div>
      <div class="section-title mb-8">Documents · ${docs.length}</div>
      <div class="list">${docs.map(docRow).join('')}</div>
    </div>`:''}

    ${(!e.archive&&e.entretienFreq)?`<div class="card mt-16"><div class="card-body">
      <div class="row-between"><span class="small strong">Entretien recommandé</span><span class="badge badge-outline">tous les ${e.entretienFreq} mois</span></div>
      <div class="small muted mt-8">${e.dernierEntretien?`Dernier entretien enregistré le ${fdate(e.dernierEntretien)}, soit ${ecart(e.dernierEntretien).txt}.`:'Aucun entretien enregistré à ce jour.'}</div>
    </div></div>`:''}`;

  return [head, body];
}

/* ---------- Document ---------- */
function pDocument(x){
  const liens = [];
  if (x.lie.equipement)   liens.push(['Équipement', EQ[x.lie.equipement].nom, 'equipement', x.lie.equipement]);
  if (x.lie.intervention) liens.push(['Événement', INT[x.lie.intervention].titre, 'intervention', x.lie.intervention]);
  if (x.lie.garantie)     liens.push(['Garantie', GAR[x.lie.garantie].nom, 'garantie', x.lie.garantie]);
  if (x.lie.contrat)      liens.push(['Contrat', CTR[x.lie.contrat].nom, 'contrat', x.lie.contrat]);
  if (x.lie.piece)        liens.push(['Pièce', PC[x.lie.piece].nom, 'piece', x.lie.piece]);

  const head = pTitle(x.cat, x.nom, `${fdate(x.date)} · ${x.ext} · ${x.taille}`);
  const enAttente = x.depot && x.depot.statut === 'a_valider';

  const body = `
    <div class="card mb-16">

        </div>
      </div>
      <div class="card-body">
        <div class="row gap-8 wrap">

          <button class="btn btn-ghost btn-sm">${I.download} Télécharger</button>
          <button class="btn btn-ghost btn-sm">${I.share} Partager</button>
        </div>
      </div>
    </div>

    ${x.depot ? `<div class="card mb-16">
      <div class="card-head"><h3>Provenance</h3>
        ${enAttente?`<span class="badge badge-wood"><span class="dot"></span>À valider</span>`
          :x.depot.statut==='valide'?`<span class="badge badge-ok"><span class="dot"></span>Validé</span>`
          :`<span class="badge">Refusé</span>`}</div>
      <div class="card-body">
        <dl class="kv">
          <dt>Déposé par</dt><dd>${artisanDepot?artisanDepot.nom:'Un tiers'} (${x.depot.canal})</dd>
          <dt>Reçu le</dt><dd>${fdateC(x.depot.envoye)}</dd>
          <dt>Code valable jusqu'au</dt><dd>${fdateC(x.depot.expire)}</dd>
          ${x.depot.statut==='valide'&&x.depot.valideLe?`<dt>Validé le</dt><dd>${fdateC(x.depot.valideLe)}</dd>`:''}
        </dl>
        ${enAttente?`<div class="note wood mt-16">${I.info}<div class="small">
          Ce document a été déposé par un tiers via un code à usage unique. Il n'a pas encore rejoint la mémoire du logement : vérifiez-le, puis validez-le ou refusez-le.</div></div>
        <div class="row gap-8 wrap mt-16">
          <button class="btn btn-primary btn-sm" data-act="validerdoc" data-id="${x.id}">${I.check} Valider et intégrer</button>
          <button class="btn btn-ghost btn-sm" data-act="refuserdoc" data-id="${x.id}">${I.close} Refuser</button>
        </div>`:''}
      </div>
    </div>`:''}

    ${x.alerte?`<div class="note alert mb-16">${I.alert}<div>${x.alerte}</div></div>`:''}

    <div class="card mb-16">
      <div class="card-head"><h3>Informations retenues</h3>
        <span class="badge ${x.confiance>=90?'badge-ok':x.confiance>=70?'badge-wood':'badge-alert'}">Fiabilité ${x.confiance} %</span></div>
      <div class="card-body">
        <dl class="kv">
          ${Object.entries(x.extrait).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}
          <dt>Source</dt><dd>${x.source}</dd>
        </dl>
        ${x.confiance<80?`<div class="note wood mt-16">${I.info}<div class="small">Ces informations ont été lues automatiquement sur un document de qualité moyenne. Vérifiez-les avant de vous y fier.</div></div>`:''}
      </div>
    </div>

    ${liens.length?`<div class="card">
      <div class="card-head"><h3>Ce document enrichit</h3></div>
      <div class="list">
        ${liens.map(([k,v,t,id])=>`
          <button class="list-row" data-act="panel" data-t="${t}" data-id="${id}">
            <div class="ic">${I.link}</div>
            <div class="grow"><div class="t">${v}</div><div class="s">${k}</div></div>

          </button>`).join('')}
      </div>
    </div>`:`<div class="note wood">${I.info}<div>Ce document n'est rattaché à aucun équipement ni à aucun événement. Vous pouvez le relier manuellement.</div></div>`}`;

  return [head, body];
}

/* ---------- Validation d'un dépôt tiers — VIDOM-024 ---------- */
function validerDocument(id){
  const x = DOC[id];
  if (!x || !x.depot) return;
  x.depot.statut = 'valide';
  x.depot.valideLe = isoToday();
  JOURNAL.unshift({ date:`${isoToday()} 09:00`, acte:"Document validé", qui:"Claire Lefèvre", detail:x.nom });
  render();
}
function refuserDocument(id){
  const x = DOC[id];
  if (!x || !x.depot) return;
  x.depot.statut = 'refuse';
  JOURNAL.unshift({ date:`${isoToday()} 09:00`, acte:"Document refusé", qui:"Claire Lefèvre", detail:x.nom });
  closePanel();
}

/* ---------- Garantie ---------- */
function pGarantie(g){
  const e = ecart(g.fin);
  const dur = (d(g.fin)-d(g.debut))/86400000;
  const reste = Math.max(0, Math.min(100, Math.round((d(g.fin)-TODAY)/86400000/dur*100)));

  const head = pTitle(g.type, g.nom, `Du ${fdateC(g.debut)} au ${fdateC(g.fin)}`);

  const body = `
    <div class="note ${e.passe?'alert':''} mb-16">${e.passe?I.alert:I.shield}<div>
      ${e.passe?`Cette garantie a expiré ${e.txt}.`:`Cette garantie est active. Elle expire ${e.txt}, le ${fdate(g.fin)}.`}</div></div>

    ${!e.passe?`<div class="card mb-16"><div class="card-body">
      <div class="row-between mb-8"><span class="small strong">Temps restant</span><span class="small muted">${reste} %</span></div>
      <div class="gauge ${reste<20?'warn':''}"><i style="width:${reste}%"></i></div>
    </div></div>`:''}

    <div class="card mb-16"><div class="card-body">
      <dl class="kv">
        <dt>Type</dt><dd>${g.type}</dd>
        <dt>Début</dt><dd>${fdate(g.debut)}</dd>
        <dt>Fin</dt><dd>${fdate(g.fin)}</dd>
        <dt>Durée</dt><dd>${Math.round(dur/365)} ans</dd>
        ${g.fournisseur?`<dt>Émetteur</dt><dd>${ART[g.fournisseur].nom}</dd>`:''}
        ${g.equipement?`<dt>Équipement couvert</dt><dd>${EQ[g.equipement].nom}</dd>`:''}

      <div class="mt-16 small" style="line-height:1.6">${g.conditions}</div>

  return [head, body];
}

  if (r.lien.contrat) { const x = CTR[r.lien.contrat];
    lien = `<div class="card"><div class="card-head"><h3>Contrat concerné</h3></div><div class="list">

/* ------------------------------------------------------------
   RECHERCHE — questions en langage naturel
   ------------------------------------------------------------ */
const EXEMPLES = [
  "Où est la facture de la pompe à chaleur ?",
  "Quand la toiture a-t-elle été refaite ?",
  "Quel artisan a posé la cuisine ?",
  "Quelles garanties sont encore actives ?",
  "Combien ont coûté les travaux depuis 2020 ?",
  "Quel est le numéro de série de la pompe à chaleur ?"
];

function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function repondre(q){
  const n = norm(q);
  const a = (txt, items) => ({ txt, items });

  if (/(facture|ou est).*(pompe|chaleur|pac|chaudiere)|chaudiere.*facture/.test(n))
    return a(`La facture de la <b>pompe à chaleur Daikin Altherma 3</b> date du <b>12 février 2022</b>. Montant : <b>16 900 €</b>, dont 5 000 € d'aides déduites. Installée par Thermic Ouest.`,
      [['document','d21'],['equipement','e1'],['intervention','i9']]);

  if (/toiture|toit|couverture/.test(n))
    return a(`La toiture a été <b>entièrement refaite le 22 mai 2023</b> par Couverture Bretonne, pour <b>21 300 €</b>. Tuiles Monier Romane Évolution sur 128 m². La garantie décennale court jusqu'au 22 mai 2033. Un versant avait déjà été repris en 2011 par la propriétaire précédente.`,
      [['intervention','i20'],['equipement','e4'],['garantie','g1'],['document','d28']]);

  if (/cuisine/.test(n))
    return a(`La cuisine a été posée par <b>Schmidt Nantes Sud</b> le <b>16 septembre 2022</b>, pour <b>14 600 €</b>. Gamme Arcos, façade chêne clair. Garantie de 10 ans sur les caissons, jusqu'au 16 septembre 2032.`,
      [['artisan','a8'],['intervention','i11'],['equipement','e7'],['garantie','g7']]);

  if (/garantie/.test(n)){
    const act = garActives().sort((x,y)=>d(x.fin)-d(y.fin));
    return a(`<b>${act.length} garanties sont encore actives</b> sur les ${GARANTIES.length} enregistrées. La plus proche à expirer est celle de la pompe à chaleur, le ${fdate(act[0].fin)} — soit ${ecart(act[0].fin).txt}.`,
      act.slice(0,5).map(g=>['garantie',g.id]));
  }

  if (/(combien|cout|coute|prix|depense).*(travaux|renovation|total)|travaux.*combien/.test(n))
    return a(`Depuis l'achat en 2019, <b>${feur(totalTravaux())}</b> de travaux ont été engagés sur ${INTERVENTIONS.filter(i=>i.categorie==='travaux').length} chantiers, dont <b>${feur(totalAides())}</b> couverts par des aides. En ajoutant l'entretien courant, le total investi s'élève à <b>${feur(totalTravaux()+totalEntretien())}</b>.`,
      [['intervention','i20'],['intervention','i9'],['intervention','i11']]);

  if (/(numero|serie|reference).*(pompe|chaleur|pac)/.test(n))
    return a(`Le numéro de série de la pompe à chaleur Daikin est <b>8471-2022-DK-0917</b>. Modèle Altherma 3 H HT ERGA06EVH, installée le 12 février 2022.`,
      [['equipement','e1'],['document','d23']]);

  if (/fenetre|menuiserie|vitrage/.test(n))
    return a(`Les <b>huit fenêtres</b> ont été remplacées le <b>19 octobre 2020</b> par Menuiseries de l'Erdre, pour <b>11 800 €</b>. PVC double vitrage 4/16/4 argon, Uw 1,3. Garantie de 10 ans jusqu'au 19 octobre 2030.`,
      [['equipement','e5'],['intervention','i5'],['garantie','g6'],['document','d14']]);

  if (/degat|eau|sinistre|fuite|inondation/.test(n))
    return a(`Un <b>dégât des eaux</b> est survenu le <b>14 mars 2021</b> dans la salle de bain : rupture d'un flexible sous la vasque. La MAIF a indemnisé <b>6 180 €</b> le 28 avril. La salle de bain a été entièrement refaite en juin 2021 pour 9 400 €.`,
      [['intervention','i6'],['intervention','i7'],['intervention','i8'],['document','d16']]);

  if (/dpe|energie|energetique|classe/.test(n))
    return a(`Le logement est classé <b>D</b> depuis le diagnostic du 14 juin 2023, avec 198 kWh/m²/an. Il était classé <b>F</b> en 2019. L'isolation des combles, le remplacement des fenêtres et la pompe à chaleur expliquent ce gain.`,
      [['document','d32'],['equipement','e16'],['equipement','e1']]);

  if (/ramonage|insert|chemine/.test(n))
    return a(`Le dernier <b>ramonage de l'insert</b> a eu lieu le <b>12 mars 2026</b>, réalisé par Thermic Ouest. Le certificat est conservé. Le prochain est à prévoir avant le 15 octobre 2026.`,
      [['intervention','i26'],['document','d38'],['equipement','e13']]);

  if (/photovolt|solaire|panneau/.test(n))
    return a(`L'installation photovoltaïque de <b>3,0 kWc</b> a été posée le <b>18 mars 2024</b> par Solaire Atlantique, pour <b>8 900 €</b> (prime de 780 € déduite). Production 2025 : 3 240 kWh, dont 62 % autoconsommés.`,
      [['equipement','e11'],['intervention','i23'],['document','d33']]);

  if (/assurance|maif/.test(n))
    return a(`Le contrat d'assurance habitation est souscrit auprès de la <b>MAIF</b> pour <b>512 € par an</b>. Prochaine échéance le 1er janvier 2027, avec reconduction tacite. Une assurance dommage-ouvrage couvre par ailleurs la toiture jusqu'en 2033.`,
      [['contrat','c1'],['garantie','g11'],['document','d41']]);

  return null;
}

function chercher(q){
  const n = norm(q);
  if (n.length < 2) return [];
  const out = [];
  const push = (t,id,titre,sous) => out.push({t,id,titre,sous});
  DOCUMENTS.forEach(x=>{ if(norm(x.nom+' '+x.cat+' '+x.source).includes(n)) push('document',x.id,x.nom,`${x.cat} · ${fdateC(x.date)}`); });
  EQUIPEMENTS.forEach(x=>{ if(norm(x.nom+' '+x.marque+' '+x.modele+' '+x.cat+' '+x.serie).includes(n)) push('equipement',x.id,x.nom,`${x.marque} · ${x.cat}`); });
  ARTISANS.forEach(x=>{ if(norm(x.nom+' '+x.metier+' '+x.ville).includes(n)) push('artisan',x.id,x.nom,x.metier); });
  INTERVENTIONS.forEach(x=>{ if(norm(x.titre+' '+x.desc+' '+x.type).includes(n)) push('intervention',x.id,x.titre,`${x.type} · ${fdateC(x.date)}`); });
  GARANTIES.forEach(x=>{ if(norm(x.nom+' '+x.type).includes(n)) push('garantie',x.id,x.nom,x.type); });
  PIECES.forEach(x=>{ if(norm(x.nom).includes(n)) push('piece',x.id,x.nom,x.etage); });
  return out.slice(0,14);
}

function runExtraction(){
  const box = document.getElementById('extract');
  if (!box) return;
  let k = 0;
  const tick = () => {
    if (!document.getElementById('extract')) return;
    if (k < EXTRACTION.length){
      const [key, val] = EXTRACTION[k];
      const row = document.createElement('div');
      row.className = 'extract-row';
      row.innerHTML = `<div class="ck">${I.check}</div><div class="k">${key}</div><div class="v grow">${val}</div>`;
      box.appendChild(row);
      requestAnimationFrame(()=>row.classList.add('in'));
      k++;
      S.add.timer = setTimeout(tick, 380);
    } else {
      const sp = document.getElementById('sp');
      if (sp) sp.outerHTML = `<div class="ck" style="width:22px;height:22px">${I.check}</div>`;
      const after = document.getElementById('afterExtract');
      if (after) after.innerHTML = `<div class="row gap-8 mt-20"><button class="btn btn-primary grow" data-act="addstep" data-s="2">Continuer</button></div>`;
      bind();
    }
  };
  S.add.timer = setTimeout(tick, 500);
}

/* ------------------------------------------------------------
   FIN DE TRAVAUX — le code à scanner
   ------------------------------------------------------------ */
function qrCells(){
  const N = 25, out = [];
  const fin = (r,c,R,C) => {
    const dr = r-R, dc = c-C;
    if (dr<0||dr>6||dc<0||dc>6) return null;
    const m = Math.max(Math.abs(dr-3), Math.abs(dc-3));
    return (m===3 || m<=1);
  };
  let seed = 20260728;
  const rnd = () => { seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed/0x7fffffff; };
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    let v = fin(r,c,0,0);
    if (v===null) v = fin(r,c,0,N-7);
    if (v===null) v = fin(r,c,N-7,0);
    if (v===null){
      const zone = (r<8&&c<8) || (r<8&&c>=N-8) || (r>=N-8&&c<8);
      v = zone ? false : rnd() > 0.53;
    }
    out.push(v);
  }
  return out;
}
