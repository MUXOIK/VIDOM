/* ================= échanges et accès ================= */
function vEchanges(){
  return `<div class="view" style="gap:12px"><h1 class="h" style="font-size:1.45em">Échanges et accès</h1><p class="muted">Le logement au centre. Chaque tiers ne voit que ce qui le concerne, pour un temps, et vous voyez qui a vu quoi.</p>
    ${RESERVE.tiers.map(t=>{const a=S.acces.find(x=>x.tiers===t.id&&x.ouvert);return `<div class="card" style="gap:8px"><div class="row"><span class="tile">${I[t.ico]}</span><span class="stack" style="flex:1 1 auto;gap:0"><span class="b">${h(t.nom)}</span><span class="small muted">${a?`Ouvert à ${h(a.nom)} jusqu'au ${dateFr(a.fin)}`:`Voit : ${t.voit.join(", ").toLowerCase()}`}</span></span>${a?`<span class="chip">Ouvert</span>`:""}</div><div class="row wrap">${a?`<button class="btn sm" onclick="voirComme('${t.id}')">${I.oeil} Voir comme</button><button class="btn sm" onclick="fermerAcces('${a.id}')">Fermer l'accès</button>`:`<button class="btn sm primary" onclick="ouvrirAcces('${t.id}')">Ouvrir l'accès</button><button class="btn sm" onclick="voirComme('${t.id}')">${I.oeil} Voir comme</button>`}</div></div>`}).join("")}
    <div class="card" style="gap:0;padding:4px 16px"><p class="small b" style="padding:8px 0 4px;color:var(--sauge-f)">Qui a vu quoi</p>${S.journalAcces.length?S.journalAcces.slice(0,12).map(j=>`<div class="line"><span class="small">${h(j.t)}</span><span class="small muted" style="white-space:nowrap">${dateFr(j.d)} ${heure(j.d)}</span></div>`).join(""):`<p class="small muted" style="padding:6px 0">Personne n'a encore rien vu.</p>`}</div>
  </div>`;
}
function choisirTiers(){modal(`<h2>Ouvrir un accès à un tiers</h2><p class="muted">Il ne verra que ce qui le concerne, pour un temps, et vous verrez chaque ouverture.</p><div class="card" style="gap:0;padding:4px 16px">${RESERVE.tiers.map(t=>`<button class="line" style="width:100%;text-align:left" onclick="closeModal();ouvrirAcces('${t.id}')"><span class="tile" style="width:36px;height:36px">${I[t.ico]}</span><span class="stack" style="gap:0;flex:1 1 auto"><span class="b">${h(t.nom)}</span><span class="small muted">${h(t.voit.join(', '))}</span></span>${I.fleche}</button>`).join("")}</div><button class="btn ghost" onclick="closeModal()">Annuler</button>`)}
function ouvrirAcces(tid){const t=RESERVE.tiers.find(x=>x.id===tid);modal(`<h2>Ouvrir l'accès : ${h(t.nom.toLowerCase())}</h2><label class="f"><span>Son nom</span><input class="input" id="an" value="${h(t.ex)}" placeholder="Nom ou cabinet"></label><label class="f"><span>Pour combien de temps</span><select class="input" id="ad"><option value="30">Un mois</option><option value="90" ${t.duree==="3 mois"?"selected":""}>Trois mois</option><option value="180" ${t.duree==="6 mois"?"selected":""}>Six mois</option><option value="365">Un an</option></select></label><div class="card soft" style="gap:4px"><p class="small b" style="color:var(--sauge-f)">Ce qu'il verra</p><p class="small">${t.voit.join(" · ")}</p><p class="small muted">Et rien d'autre. Ce qui n'est pas dans cette liste ne lui est pas envoyé.</p></div><button class="btn primary big" onclick="accesOk('${tid}')">Ouvrir, et obtenir le lien</button><button class="btn ghost" onclick="closeModal()">Annuler</button>`)}
function accesOk(tid){const t=RESERVE.tiers.find(x=>x.id===tid);const nom=document.getElementById("an").value.trim()||t.nom;const j=+document.getElementById("ad").value;const code=Math.random().toString(36).slice(2,10);
  const a={id:uid(),tiers:tid,nom,debut:today(),fin:shiftDate(today(),j),ouvert:true,lien:`vidom.fr/p/${code}`};S.acces.push(a);S.journalAcces.unshift({d:now(),t:`Accès ouvert à ${nom} (${t.nom.toLowerCase()}), jusqu'au ${dateFr(a.fin)}`});naissances();
  filAjouter({type:"acces",t:`Accès ouvert à ${nom} jusqu'au ${dateFr(a.fin)}. Vous verrez chaque ouverture ici.`,go:"#/carte/echanges",ico:"echanges",fait:true});
  closeModal();save();render();modal(`<h2>Le lien à lui envoyer</h2><div class="card"><span class="mono">${h(a.lien)}</span></div><p class="small muted">Envoyez-le depuis votre messagerie. Il ouvre une page à part, sans compte, qui montre exactement ce que vous avez choisi, jusqu'au ${dateFr(a.fin)}. Ensuite, la page dit « cet accès est terminé ».</p><div class="row"><button class="btn primary grow" onclick="copier('${h(a.lien)}')">Copier le lien</button><button class="btn" onclick="closeModal()">Fermer</button></div>`)}
function fermerAcces(id){const a=S.acces.find(x=>x.id===id);a.ouvert=false;S.journalAcces.unshift({d:now(),t:`Accès de ${a.nom} fermé par vous`});save();render();toast("Accès fermé")}
function voirComme(tid){const t=RESERVE.tiers.find(x=>x.id===tid);const a=S.acces.find(x=>x.tiers===tid&&x.ouvert);
  const blocs=t.voit.map(v=>{const l=v.toLowerCase();let items=[];if(l.includes("acte"))items=S.docs.filter(d=>d.type==="acte");else if(l.includes("diagnostic"))items=S.docs.filter(d=>d.type==="diagnostic");else if(l.includes("facture"))items=S.docs.filter(d=>d.type==="facture"&&d.travaux);else if(l.includes("plan"))items=S.docs.filter(d=>d.type==="plan");else if(l.includes("équipement"))items=S.equipements;else if(l.includes("travaux"))items=S.travaux;else if(l.includes("artisan"))items=S.pros;else if(l.includes("document"))items=S.docs.filter(d=>d.type!=="acte"&&d.type!=="impot"&&d.type!=="contrat");else if(l.includes("fiche"))items=[{titre:`${S.logement.nom} · ${S.logement.annee||"?"} · ${S.logement.surface||"?"} m² · DPE ${S.logement.dpe||"?"}`}];else if(l.includes("notice"))items=S.equipements.filter(e=>e.notice);else if(l.includes("intervention"))items=S.pros.flatMap(p=>p.interventions.map(i=>({titre:i.motif+" — "+p.nom})));else if(l.includes("dossier"))items=[{titre:"Le dossier, tel que vous l'aurez validé"}];return `<p class="small b" style="color:var(--sauge-f);margin-top:8px">${h(v)}</p>${items.length?items.map(i=>`<p class="small">· ${h(i.titre||i.nom)}</p>`).join(""):`<p class="small faint">— rien encore</p>`}`}).join("");
  if(a){S.journalAcces.unshift({d:now(),t:`${a.nom} a ouvert la page (simulation « voir comme »)`});save()}
  modal(`<div class="book" style="background:#E9E4DA;border-radius:8px 8px 0 0;padding:8px 12px;box-shadow:none"><span class="small mono">${a?h(a.lien):"vidom.fr/p/…"}</span></div><div class="book" style="border-radius:0 0 8px 8px"><p class="small muted">Partagé par ${h(S.compte.email||"le gardien")} avec ${h(a?a.nom:t.nom.toLowerCase())}${a?" · jusqu'au "+dateFr(a.fin):""}</p><p class="b" style="margin-top:6px">${h(S.logement.nom)}</p>${blocs}<p class="small faint" style="margin-top:10px">Ce que vous ne voyez pas n'a pas été transmis.</p></div><button class="btn" onclick="closeModal();render()">Fermer</button>`)}

/* ================= transmission ================= */
function vTransmission(){const T=S.transmission;
  const dossier=(id,nom,contenu)=>`<button class="card" style="text-align:left;gap:4px" onclick="ouvrirDossier('${id}')"><span class="b">${nom}</span><span class="small muted">${contenu}</span></button>`;
  return `<div class="view" style="gap:12px"><h1 class="h" style="font-size:1.45em">Transmission</h1><p class="muted">${T.motif==="vente"?"La maison va changer de mains. Voici ce qu'elle peut laisser au suivant.":T.motif==="depart"?"Vous quittez la maison. Sa mémoire peut continuer sans vous.":"Quelqu'un demande la mémoire de la maison."}</p>
    ${dossier("vente","Le dossier de vente","Acte, diagnostics, travaux, équipements et garanties — pour le notaire, l'agent, l'acquéreur.")}
    ${dossier("livre","Le livre du logement","Son histoire, année par année, avec les artisans qui la connaissent. Gratuit, toujours.")}
    ${dossier("carnet","Le carnet d'entretien","Ce qui est à faire, et quand. Gratuit, toujours.")}
    <div class="card soft" style="gap:8px"><p class="small b" style="color:var(--sauge-f)">Le jour où la maison change de mains</p><p class="small">Vous triez en trois catégories : ce qui reste à la maison, ce qui part avec vous, ce qui s'efface. Rien ne part sans votre geste.</p><button class="btn" onclick="trierTransmission()">Faire le tri</button><button class="btn ghost sm" onclick="modeBlanc()">Le jouer à blanc, sans rien changer</button></div>
    <button class="btn ghost" onclick="S.transmission=null;S.nees=S.nees.filter(x=>x!=='transmission');save();route('#/maison')">Finalement, pas maintenant</button>
  </div>`}
function ouvrirDossier(id){const docs=S.docs;const eqs=S.equipements;const pages={vente:{titre:"Dossier de vente",pages:[["Le logement",[`${S.logement.nom}, ${S.logement.adresse}, ${S.logement.cp} ${S.logement.ville}`,`Construite en ${S.logement.annee||"?"} · ${S.logement.surface||"?"} m² · DPE ${S.logement.dpe||"?"}`]],["Acte et diagnostics",docs.filter(d=>d.type==="acte"||d.type==="diagnostic").map(d=>d.titre+" — "+dateFr(d.date))],["Travaux",S.travaux.map(t=>`${t.titre} — ${t.par}, ${dateFr(t.date)}${t.montant?", "+euros(t.montant):""}`)],["Équipements et garanties",eqs.map(e=>`${e.nom} ${e.marque}${e.garantie&&joursDepuis(e.garantie)<0?" — garanti jusqu'en "+e.garantie.slice(0,4):""}`)]]},
    livre:{titre:"Le livre du logement",pages:[["L'histoire",[...docs.map(d=>dateFr(d.date)+" — "+d.titre),...S.fil.filter(e=>e.type==="souvenir").map(e=>dateFr(e.d)+" — "+e.t)].sort()],["Ceux qui la connaissent",S.pros.map(p=>`${p.nom}, ${p.metier.toLowerCase()}`)]]},
    carnet:{titre:"Le carnet d'entretien",pages:[["À faire chaque année",eqs.filter(e=>e.entretien).map(e=>`${e.nom} — entretien annuel${e.installateur?", "+e.installateur:""}`)],["Garanties en cours",eqs.filter(e=>e.garantie&&joursDepuis(e.garantie)<0).map(e=>`${e.nom} — jusqu'au ${dateFr(e.garantie)}`)]]}}[id];
  modal(`<h2>${pages.titre}</h2>${pages.pages.map(([t,l])=>`<div class="book"><p class="b">${h(t)}</p>${l.length?l.map(x=>`<label class="check"><input type="checkbox" checked><span class="small">${h(x)}</span></label>`).join(""):`<p class="small faint">Rien encore.</p>`}</div>`).join("")}<p class="small muted">Chaque ligne se garde ou se retire. ${id==="vente"?"19 € — gratuit pendant la version test.":"Gratuit."}</p><div class="row"><a class="btn primary grow" href="mailto:?subject=${encodeURIComponent(pages.titre+" — "+S.logement.nom)}" onclick="closeModal();S.journalAcces.unshift({d:now(),t:'${h(pages.titre)} envoyé par vous'});filAjouter({type:'info',t:'${h(pages.titre)} envoyé depuis votre messagerie.',ico:'envoi',fait:true});render()">${I.envoi} Envoyer</a><button class="btn" onclick="closeModal()">Fermer</button></div>`)}
function trierTransmission(blanc){const cat=x=>`<div class="card" style="gap:4px"><p class="small b" style="color:var(--sauge-f)">${x[0]}</p><p class="small muted">${x[1]}</p>${x[2].map(i=>`<label class="check"><input type="checkbox" checked><span class="small">${h(i)}</span></label>`).join("")||`<p class="small faint">Rien.</p>`}</div>`;
  modal(`<h2>${blanc?"À blanc — rien ne change":"Le tri"}</h2>${cat(["Reste à la maison","Pour le prochain gardien.",[...S.docs.filter(d=>d.type!=="impot"&&d.type!=="contrat").map(d=>d.titre),...S.equipements.map(e=>e.nom),...S.pros.map(p=>p.nom)]])}${cat(["Part avec vous","Vos papiers à vous.",S.docs.filter(d=>d.type==="impot"||d.type==="contrat").map(d=>d.titre)])}${cat(["S'efface","Ce qui ne regarde personne.",S.fil.filter(e=>e.type==="souvenir").map(e=>e.t)])}<div class="row"><button class="btn ${blanc?"":"primary"} grow" onclick="closeModal();${blanc?"toast('Joué à blanc. Rien n\\'a changé.')":"transmettre()"}">${blanc?"Terminer l'essai":"Transmettre la mémoire"}</button><button class="btn" onclick="closeModal()">Annuler</button></div>`)}
function modeBlanc(){trierTransmission(true)}
function transmettre(){modal(`<div class="book" style="text-align:center"><p class="b" style="font-size:1.2em">La mémoire de ${h(S.logement.nom)} continue avec ses prochains gardiens.</p><p class="small muted" style="margin-top:8px">${S.docs.length} documents, ${S.equipements.length} équipements, ${S.pros.length} artisans. Merci d'en avoir pris soin.</p></div><p class="small muted">Dans cette maquette, rien n'est transmis pour de vrai. Vous pouvez « Repartir de zéro » dans les réglages.</p><button class="btn primary big" onclick="closeModal();S.journalAcces.unshift({d:now(),t:'Transmission jouée jusqu\\'au bout (maquette)'});save();route('#/fil')">Fermer</button>`)}
function changerDeMains(motif){S.transmission={motif,d:today()};naissances();filAjouter({type:"naissance",t:motif==="vente"?"Vous vendez la maison. La rubrique Transmission est apparue : le dossier de vente, le livre du logement, et le tri du dernier jour.":"Vous quittez la maison. La rubrique Transmission est apparue.",go:"#/carte/transmission",ico:"cle"});save();route("#/carte/transmission")}

/* ================= réglages ================= */
V.reglages=()=>`<div class="view" style="gap:12px"><h1 class="h" style="font-size:1.45em">Réglages</h1>
  <div class="card" style="gap:0;padding:4px 16px">
    <button class="line" style="width:100%;text-align:left" onclick="corrigerLogement()"><span class="stack" style="gap:0;flex:1 1 auto"><span class="b">${h(S.logement.nom)}</span><span class="small muted">Nom, année, surface, classe énergétique</span></span>${I.fleche}</button>
    <button class="line" style="width:100%;text-align:left" onclick="modal('<h2>Votre compte</h2><p class=muted>'+h(S.compte.email||'Sans courriel')+'</p><p class=\\'small faint\\'>Votre compte et la mémoire de votre logement sont enregistrés pour de vrai, et retrouvés sur chacun de vos appareils quand vous vous connectez.</p><button class=\\'btn\\' onclick=closeModal()>Fermer</button>')"><span class="stack" style="gap:0;flex:1 1 auto"><span class="b">Votre compte</span><span class="small muted">${h(S.compte.email||"—")}</span></span>${I.fleche}</button>
    <button class="line" style="width:100%;text-align:left" onclick="choisirLogement()"><span class="stack" style="gap:0;flex:1 1 auto"><span class="b">Vos logements</span><span class="small muted">${S.logements.length>1?S.logements.length+" logements sur ce compte":"Un seul pour l'instant"} · ajouter un logement</span></span>${I.fleche}</button>
    <a class="line" href="#/adresse-vidom"><span class="stack" style="gap:0;flex:1 1 auto"><span class="b">Adresse VIDOM et QR</span><span class="small muted mono">${h(S.logement.depot)}</span></span>${I.fleche}</a>
  </div>
  <div class="card" style="gap:8px"><p class="small b" style="color:var(--sauge-f)">Taille du texte</p><div class="row">${[["normal","Normal"],["grand","Grand"],["tres-grand","Très grand"]].map(([k,n])=>`<button class="chip btn-chip ${S.reglages.texte===k?"on":""}" onclick="S.reglages.texte='${k}';document.documentElement.dataset.texte='${k}';save();render()">${n}</button>`).join("")}</div></div>
  <div class="card" style="gap:8px"><p class="small b" style="color:var(--sauge-f)">Donner accès à un tiers</p><p class="small muted">Notaire, agent, artisan, assureur : chacun ne voit que ce qui le concerne.</p><button class="btn" onclick="choisirTiers()">${I.echanges} Ouvrir un accès</button></div>
  <div class="card" style="gap:8px"><p class="small b" style="color:var(--sauge-f)">La maison change de mains</p><p class="small muted">Le jour venu, et seulement ce jour-là, la rubrique Transmission apparaît.</p><div class="row"><button class="btn grow" onclick="changerDeMains('vente')">Je vends</button><button class="btn grow" onclick="changerDeMains('depart')">Je pars</button></div></div>
  <div class="card" style="gap:8px"><p class="small b" style="color:var(--sauge-f)">Votre mémoire vous appartient</p><div class="row wrap"><button class="btn grow" onclick="emporter()">${I.telechargement} Emporter ma mémoire</button><a class="btn grow" href="mailto:contact@vidom.fr?subject=${encodeURIComponent("Mon avis sur la maquette VIDOM")}&body=${encodeURIComponent("Écran : "+location.hash+"\n\n")}">${I.mail} Donner mon avis</a></div><p class="small faint">${S.docs.length} documents · ${S.equipements.length} équipements · ${S.fil.length} moments dans le fil.</p></div>
  <div class="card" style="gap:8px"><button class="btn terra" onclick="modal('<h2>Repartir de zéro ?</h2><p class=muted>Tout ce qui est sur cet appareil s\\'efface : la maison, les photos, le fil.</p><div class=row><button class=\\'btn terra grow\\' onclick=\\'toutEffacer()\\'>Tout effacer</button><button class=btn onclick=closeModal()>Annuler</button></div>')">Repartir de zéro</button></div>
  <p class="small faint" style="text-align:center">VIDOM — maquette du 15 septembre 2026. Votre mémoire est enregistrée sur votre compte et retrouvée sur chacun de vos appareils.</p>
</div>`;
function toutEffacer(){try{Object.keys(localStorage).filter(k=>k===KEY||k.startsWith(KEY+":")).forEach(k=>localStorage.removeItem(k))}catch(e){}location.hash="";location.reload()}
function emporter(){const data=JSON.stringify(S,null,2);const b=new Blob([data],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`vidom-${slug(S.logement.nom||"maison")}-${today()}.json`;document.body.appendChild(a);a.click();a.remove();toast("Votre mémoire est téléchargée")}
</script>
<script>
/* ================= navigation et rendu ================= */
const TITRES={fil:"Le fil",maison:"Ma maison",reglages:"Réglages",carte:"Ma maison",piece:"Ma maison",equipement:"Équipements",document:"Documents",pro:"Les artisans de la maison",tri:"Le tri","adresse-vidom":"Adresse VIDOM",reconnu:"Photographier"};
const RETOUR={carte:"#/maison",piece:"#/maison",equipement:"#/carte/equipements",document:"#/carte/documents",pro:"#/carte/artisans",reglages:"#/maison","adresse-vidom":"#/maison",tri:"#/fil",reconnu:"#/fil"};
function parseHash(){const hh=location.hash.replace(/^#\/?/,"");const [name,...rest]=hh.split("/");return {name:name||"fil",arg:rest.join("/")}}
function vue(name,arg){
  if(name==="carte")return V.carte(arg);
  if(name==="piece")return V.piece(arg);
  if(name==="equipement")return V.equipement(arg);
  if(name==="document")return V.document(arg);
  if(name==="pro")return V.pro(arg);
  if(V[name])return V[name]();
  return V.fil();
}
function nav(name){
  const on=k=>k===name?"on":"";
  const cap=isDesk()?"":'capture="environment"';
  return `<nav class="nav">
    <a href="#/fil" class="${on("fil")}">${I.bulle}<span>Le fil</span></a>
    <label class="cam ${on("reconnu")}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;border-radius:var(--r);color:var(--blanc);background:var(--sauge);font-size:.8em;font-weight:500;cursor:pointer;position:relative;overflow:hidden">${I.camera}<span>Photographier</span><input class="sr" type="file" accept="image/*" ${cap} multiple onchange="fichiers(this.files,S.pieceCourante||'maison')"></label>
    <a href="#/maison" class="${["maison","carte","piece","equipement","document","pro","adresse-vidom","reglages"].includes(name)?"on":""}">${I.maison}<span>Ma maison</span></a>
  </nav>`;
}
function renderReinitialiser(){
  document.body.classList.remove("app");
  document.getElementById("app").innerHTML=`<div class="col"><div class="top"><span class="t">VIDOM</span></div><div class="view center fadein" style="gap:18px">
    <div class="stack"><h1 class="h">Nouveau mot de passe.</h1><p class="muted">Choisissez un nouveau mot de passe pour votre compte VIDOM.</p></div>
    <form class="stack" style="gap:14px" onsubmit="event.preventDefault();reinitialiserOk()">
      <label class="f"><span>Nouveau mot de passe</span><input class="input" id="npw" type="password" autocomplete="new-password" minlength="8" required></label>
      <button class="btn primary big" type="submit">Enregistrer</button>
    </form>
  </div></div>`;
}
async function reinitialiserOk(){
  const pw=document.getElementById("npw").value;
  if(!supa){toast("Indisponible pour l'instant.");return}
  try{
    const {error}=await supa.auth.updateUser({password:pw});
    if(error){toast("Cela n'a pas fonctionné : "+error.message);return}
    toast("Mot de passe enregistré.");
    await hydrate();
    location.hash=S.cree?"#/fil":"#/";
    render();
  }catch(e){toast("Cela n'a pas fonctionné.")}
}
function render(){
  document.documentElement.dataset.texte=S.reglages.texte||"normal";
  const app=document.getElementById("app");
  if(parseHash().name==="reinitialiser"||location.hash.indexOf("type=recovery")>-1){renderReinitialiser();return}
  if(!S.cree){
    document.body.classList.remove("app");
    const e=S.etape||"bienvenue";
    const pre=e==="bienvenue"||e==="compte"?"VIDOM":(e==="adresse"?(S.ajout?"Un logement de plus":"Commençons"):h(S.logement.nom||"VIDOM"));
    const right=e==="maison-adresse"||e==="commencons"?`<span class="chip">Premier jour</span>`:"";
    const back=e==="compte"?`<button class="back" onclick="S.etape='bienvenue';save();render()">${I.retour}</button>`:e==="adresse"?`<button class="back" onclick="${S.ajout?"annulerAjout()":"S.etape='compte';save();render()"}">${I.retour}</button>`:e==="maison-adresse"?`<button class="back" onclick="S.etape='adresse';save();render()">${I.retour}</button>`:e==="commencons"?`<button class="back" onclick="S.etape='maison-adresse';save();render()">${I.retour}</button>`:"";
    app.innerHTML=`<div class="col"><div class="top"><span class="row">${back}<span class="t">${pre}</span></span>${right}</div>${(V[e]||V.bienvenue)()}</div>`;
    return;
  }
  document.body.classList.add("app");
  questionDuJour();
  const {name,arg}=parseHash();
  const html=vue(name,arg);
  const titre=TITRES[name]||"VIDOM";
  const retour=RETOUR[name];
  if(isDesk()){
    const rightName=name==="maison"?"fil":name;
    const rightHtml=name==="maison"?V.fil():html;
    const rt=name==="maison"?"Le fil":titre;
    const rr=name==="maison"?"":retour;
    app.innerHTML=`<div class="desk">
      <div class="pane left"><div class="topbar">${boutonLogement(S.logement.nom,"")}<span class="small muted">${h(S.logement.ville)}</span></div>${V.maison()}</div>
      <div class="pane right"><div class="topbar"><span class="row">${rr&&rr!=="#/fil"&&rightName!=="fil"?`<a class="back" href="${rr}">${I.retour}</a>`:(rightName!=="fil"&&rightName!=="maison"?`<a class="back" href="#/fil">${I.retour}</a>`:"")}<span class="t">${rt}</span></span><span class="actions"><label class="btn primary file">${I.plus} Ajouter<input type="file" accept="image/*,.pdf" multiple onchange="fichiers(this.files,S.pieceCourante||'maison')"></label><button class="btn" onclick="ajouterDesk()" aria-label="Photographier ou continuer sur le téléphone">${I.camera}</button><a class="btn" href="#/reglages" aria-label="Réglages">${I.reglages}</a></span></div>${rightHtml}</div>
    </div>`;
  }else{
    app.innerHTML=`<div class="col"><div class="top"><span class="row">${retour?`<a class="back" href="${retour}">${I.retour}</a>`:""}${name==="fil"?boutonLogement(S.logement.nom,""):`<span class="t">${titre}</span>`}</span>${name==="fil"?`<span class="chip">${h(phraseCourte())}</span>`:""}</div>${html}${nav(name)}</div>`;
  }
  const dv=document.querySelector(".pane.right")||window;
  if(render.lastRoute!==location.hash){window.scrollTo(0,0);render.lastRoute=location.hash}
}
function ajouterDesk(){modal(`<h2>Photographier</h2><div class="stack"><label class="btn primary big file">${I.camera} Avec la caméra de l'ordinateur<input type="file" accept="image/*" capture="environment" multiple onchange="fichiers(this.files,S.pieceCourante||'maison')"></label><div class="card" style="flex-direction:row;align-items:center;gap:14px"><div class="qr" style="width:96px;height:96px">${qrSvg(location.href.split("#")[0])}</div><span class="small muted">Pour continuer sur votre téléphone, ouvrez ce code avec l'appareil photo, puis connectez-vous avec le même compte : vous retrouverez la même maison.</span></div></div><button class="btn" onclick="closeModal()">Fermer</button>`)}
function route(hsh){if(hsh&&location.hash!==hsh){location.hash=hsh}else render()}
window.addEventListener("hashchange",render);
window.addEventListener("resize",()=>{clearTimeout(render.rt);render.rt=setTimeout(render,120)});

/* glisser-déposer, n'importe où sur la page */
(function(){
  let n=0;const d=document.getElementById("drop");
  document.addEventListener("dragenter",e=>{if(!S.cree&&S.etape!=="commencons")return;n++;d.hidden=false});
  document.addEventListener("dragleave",()=>{n=Math.max(0,n-1);if(!n)d.hidden=true});
  document.addEventListener("dragover",e=>e.preventDefault());
  document.addEventListener("drop",e=>{e.preventDefault();n=0;d.hidden=true;if(e.dataTransfer&&e.dataTransfer.files.length)fichiers(e.dataTransfer.files,S.pieceCourante||"maison")});
})();
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
/* rendre le premier écran : si un compte réel est déjà connecté, on va d'abord chercher sa vraie mémoire */
(async function(){
  if(supa){
    let recuperation=location.hash.indexOf("type=recovery")>-1; // repli si l'évènement ci-dessous n'arrivait pas à temps
    try{supa.auth.onAuthStateChange((event)=>{ // enregistré avant tout "await" : sinon la fenêtre de récupération de mot de passe peut être manquée
      if(event==="PASSWORD_RECOVERY"){recuperation=true;location.hash="#/reinitialiser";render()}
    })}catch(e){}
    try{
      const {data}=await supa.auth.getSession();
      if(!recuperation&&data&&data.session&&parseHash().name!=="reinitialiser"){
        document.getElementById("app").innerHTML=`<div class="view center" style="min-height:100vh"><p class="muted">Un instant, VIDOM retrouve votre maison…</p></div>`;
        await hydrate();
      }
    }catch(e){}
  }
  if(S.cree&&!location.hash)location.hash="#/fil";
  render();
})();
</script>
</body>
</html>
